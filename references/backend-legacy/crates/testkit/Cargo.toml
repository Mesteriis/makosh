[package]
name = "makosh-backend-testkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[dependencies]
async-nats = "0.49.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
makosh-backend = { path = "../../backend", features = ["test-support"] }
makosh-communications-api = { path = "../communications-api" }
makosh-communications-postgres = { path = "../communications-postgres" }
makosh-test-session = { path = "../test-session" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
testcontainers = { version = "0.27", features = ["docker-compose"] }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3.27"
