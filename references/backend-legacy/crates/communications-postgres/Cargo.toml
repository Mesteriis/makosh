[package]
name = "makosh-communications-postgres"
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
makosh-communications-api = { path = "../communications-api" }
makosh-events-api = { path = "../events-api" }
makosh-events-postgres = { path = "../events-postgres" }
makosh-observations-api = { path = "../observations-api" }
makosh-observations-postgres = { path = "../observations-postgres" }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
