# Signed development bundles contain every managed runtime. Keep only the
# cryptographic digest implementation optimized so trust verification remains
# representative while ordinary workspace code retains debuginfo and fast
# incremental development builds.
[profile.dev.package."sha2:0.10.9"]
opt-level = 3

[profile.dev.package."sha2:0.11.0"]
opt-level = 3
