[package]
name = "makosh-telegram-automation-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
conformance-test-support = []

[package.metadata.makosh]
role = "integration"
owner = "telegram"
surface = "persistence"

[dependencies]
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-telegram-automation-core = { path = "../telegram-automation-core" }
sha2 = { version = "=0.10.9", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
