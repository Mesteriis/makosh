syntax = "proto3";

package makosh.tasks.command.v1;

// Exact target-domain command. Presentation bytes remain in the Tasks-bound
// Blob referenced by candidate_content and never enter the durable envelope.
message CreateTaskFromReviewedCandidateCommandV1 {
  bytes command_id = 1;
  bytes approved_candidate_id = 2;
  bytes candidate_digest = 3;
  bytes source_evidence_id = 4;
  uint64 source_evidence_revision = 5;
  bytes review_id = 6;
  uint64 decision_revision = 7;
  bytes decided_by_owner_device_id = 8;
  TasksTargetBoundCandidateReceiptV1 candidate_content = 9;
  string logical_owner_id = 10;
}

message TaskCreatedFromReviewedCandidateV1 {
  bytes command_id = 1;
  bytes approved_candidate_id = 2;
  bytes task_id = 3;
  uint64 task_revision = 4;
  string logical_owner_id = 5;
}

message TaskCreationFromReviewedCandidateRejectedV1 {
  bytes command_id = 1;
  bytes approved_candidate_id = 2;
  TaskCreationRejectCodeV1 code = 3;
  string logical_owner_id = 4;
}

message TasksTargetBoundCandidateReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

// Plaintext schema held only by the Tasks-target-bound Blob.
message ReviewedTaskCandidateContentV1 {
  string title = 1;
  optional string due_text_hint = 2;
  optional string assignee_label_hint = 3;
}

enum TaskCreationRejectCodeV1 {
  TASK_CREATION_REJECT_CODE_UNSPECIFIED = 0;
  TASK_CREATION_REJECT_CODE_INVALID_REQUEST = 1;
  TASK_CREATION_REJECT_CODE_BLOB_UNAVAILABLE = 2;
  TASK_CREATION_REJECT_CODE_BLOB_MISMATCH = 3;
  TASK_CREATION_REJECT_CODE_CONFLICT = 4;
  TASK_CREATION_REJECT_CODE_POLICY = 5;
}
