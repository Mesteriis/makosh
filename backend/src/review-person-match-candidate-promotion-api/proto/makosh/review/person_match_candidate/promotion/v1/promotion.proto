syntax = "proto3";

package makosh.review.person_match_candidate.promotion.v1;

message ReviewPersonMatchCandidatePromotionResultV1 {
  bytes result_id = 1;
  bytes review_id = 2;
  bytes candidate_id = 3;
  bytes decision_id = 4;
  uint64 expected_review_revision = 5;
  ReviewPersonMatchCandidatePromotionOutcomeV1 outcome = 6;
  optional bytes persons_command_id = 7;
  ReviewPersonMatchCandidatePromotionFailureCodeV1 failure_code = 8;
  string logical_owner_id = 9;
  int64 completed_at_unix_millis = 10;
}

enum ReviewPersonMatchCandidatePromotionOutcomeV1 {
  REVIEW_PERSON_MATCH_CANDIDATE_PROMOTION_OUTCOME_UNSPECIFIED = 0;
  REVIEW_PERSON_MATCH_CANDIDATE_PROMOTION_OUTCOME_SUCCEEDED = 1;
  REVIEW_PERSON_MATCH_CANDIDATE_PROMOTION_OUTCOME_FAILED = 2;
}

enum ReviewPersonMatchCandidatePromotionFailureCodeV1 {
  REVIEW_PERSON_MATCH_CANDIDATE_PROMOTION_FAILURE_CODE_UNSPECIFIED = 0;
  REVIEW_PERSON_MATCH_CANDIDATE_PROMOTION_FAILURE_CODE_INVALID_REQUEST = 1;
  REVIEW_PERSON_MATCH_CANDIDATE_PROMOTION_FAILURE_CODE_ACTION_DIGEST_MISMATCH = 2;
  REVIEW_PERSON_MATCH_CANDIDATE_PROMOTION_FAILURE_CODE_PERSONS_REJECTED = 3;
  REVIEW_PERSON_MATCH_CANDIDATE_PROMOTION_FAILURE_CODE_CONFLICT = 4;
  REVIEW_PERSON_MATCH_CANDIDATE_PROMOTION_FAILURE_CODE_POLICY = 5;
}
