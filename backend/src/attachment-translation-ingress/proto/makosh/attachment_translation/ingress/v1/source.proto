syntax = "proto3";

package makosh.attachment_translation.ingress.v1;

// Target-owned durable command. Text and Blob authority are absent; the
// Attachment Text Extraction owner resolves its current derived artifact.
message RequestAttachmentTranslationSourceV1 {
  bytes request_id = 1;
  bytes translation_run_id = 2;
  bytes source_extraction_run_id = 3;
  uint64 expected_source_revision = 4;
  string logical_owner_id = 5;
}

// Internal result consumed only by Attachment Translation. Blob authority is
// forbidden from public query, realtime and client_blob bodies.
message AttachmentTranslationSourcePreparedV1 {
  bytes request_id = 1;
  bytes translation_run_id = 2;
  bytes source_extraction_run_id = 3;
  uint64 source_revision = 4;
  bytes source_reference_id = 5;
  uint64 declared_size = 6;
  bytes receipt_sha256 = 7;
  bytes custody_transfer_source_proof = 8;
  string logical_owner_id = 9;
}

message AttachmentTranslationSourceRejectedV1 {
  bytes request_id = 1;
  bytes translation_run_id = 2;
  bytes source_extraction_run_id = 3;
  AttachmentTranslationSourceRejectCodeV1 code = 4;
  string logical_owner_id = 5;
}

enum AttachmentTranslationSourceRejectCodeV1 {
  ATTACHMENT_TRANSLATION_SOURCE_REJECT_CODE_V1_UNSPECIFIED = 0;
  ATTACHMENT_TRANSLATION_SOURCE_REJECT_CODE_V1_INVALID_REQUEST = 1;
  ATTACHMENT_TRANSLATION_SOURCE_REJECT_CODE_V1_NOT_READY = 2;
  ATTACHMENT_TRANSLATION_SOURCE_REJECT_CODE_V1_STALE_REVISION = 3;
  ATTACHMENT_TRANSLATION_SOURCE_REJECT_CODE_V1_CUSTODY_UNAVAILABLE = 4;
  ATTACHMENT_TRANSLATION_SOURCE_REJECT_CODE_V1_POLICY = 5;
}
