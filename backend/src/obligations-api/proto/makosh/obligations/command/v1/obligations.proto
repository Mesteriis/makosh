syntax = "proto3";

package makosh.obligations.command.v1;

message TimestampV1 {
  int64 unix_seconds = 1;
  int32 nanos = 2;
}

message ReviewedObligationEvidenceLinkV1 {
  bytes evidence_link_id = 1;
  string evidence_owner_id = 2;
  bytes evidence_record_id = 3;
  uint64 evidence_revision = 4;
  bytes evidence_digest = 5;
}

// Exact target-domain command. Presentation bytes remain in the Obligations-bound
// Blob referenced by candidate_content and never enter the durable envelope.
message CreateObligationFromReviewedCandidateCommandV1 {
  bytes command_id = 1;
  bytes approved_candidate_id = 2;
  bytes candidate_digest = 3;
  bytes source_evidence_id = 4;
  uint64 source_evidence_revision = 5;
  bytes review_id = 6;
  uint64 decision_revision = 7;
  bytes decided_by_owner_device_id = 8;
  ObligationsTargetBoundCandidateReceiptV1 candidate_content = 9;
  string logical_owner_id = 10;
}

message ObligationCreatedFromReviewedCandidateV1 {
  bytes command_id = 1;
  bytes approved_candidate_id = 2;
  bytes obligation_id = 3;
  uint64 obligation_revision = 4;
  string logical_owner_id = 5;
}

message ObligationCreationFromReviewedCandidateRejectedV1 {
  bytes command_id = 1;
  bytes approved_candidate_id = 2;
  ObligationCreationRejectCodeV1 code = 3;
  string logical_owner_id = 4;
}

message ObligationsTargetBoundCandidateReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

// Plaintext schema held only by the Obligations-target-bound Blob.
message ReviewedObligationCandidateContentV1 {
  string statement = 1;
  optional TimestampV1 due_at = 2;
  optional string condition = 3;
  bytes obligated_party_id = 4;
  optional bytes beneficiary_party_id = 5;
  repeated ReviewedObligationEvidenceLinkV1 evidence_links = 6;
}

enum ObligationCreationRejectCodeV1 {
  OBLIGATION_CREATION_REJECT_CODE_UNSPECIFIED = 0;
  OBLIGATION_CREATION_REJECT_CODE_INVALID_REQUEST = 1;
  OBLIGATION_CREATION_REJECT_CODE_BLOB_UNAVAILABLE = 2;
  OBLIGATION_CREATION_REJECT_CODE_BLOB_MISMATCH = 3;
  OBLIGATION_CREATION_REJECT_CODE_CONFLICT = 4;
  OBLIGATION_CREATION_REJECT_CODE_POLICY = 5;
}
