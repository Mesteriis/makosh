syntax = "proto3";

package makosh.communication_note_candidate.v1;

message StartCommunicationNoteCandidateRequestV1 {
  uint32 protocol_major = 1;
  bytes operation_id = 2;
  bytes source_message_id = 3;
  uint64 expected_source_revision = 4;
}

message StartCommunicationNoteCandidateResponseV1 {
  bytes run_id = 1;
  CommunicationNoteCandidateStateV1 state = 2;
  CommunicationNoteCandidateErrorCodeV1 error = 15;
}

message GetCommunicationNoteCandidateRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message GetCommunicationNoteCandidateResponseV1 {
  bytes run_id = 1;
  bytes source_message_id = 2;
  uint64 expected_source_revision = 3;
  CommunicationNoteCandidateStateV1 state = 4;
  uint64 state_revision = 5;
  repeated CommunicationNoteCandidateV1 candidates = 6;
  CommunicationNoteCandidateCompletenessV1 completeness = 7;
  CommunicationNoteCandidateErrorCodeV1 error = 15;
}

message CommunicationNoteCandidateV1 {
  bytes candidate_id = 1;
  bytes candidate_digest = 2;
  string title = 3;
  string excerpt = 4;
  repeated CommunicationNoteTopicHintV1 topic_hints = 5;
  CommunicationNoteSourceBasisV1 source_basis = 6;
  uint32 confidence_basis_points = 7;
  bytes source_evidence_id = 8;
  uint64 source_evidence_revision = 9;
}

message CommunicationNoteCandidateStatusChangedV1 {
  bytes run_id = 1;
  CommunicationNoteCandidateStateV1 state = 2;
  uint64 state_revision = 3;
  uint64 occurred_at_unix_millis = 4;
  CommunicationNoteCandidateErrorCodeV1 error = 15;
}

service CommunicationNoteCandidateCommandService {
  rpc Start(StartCommunicationNoteCandidateRequestV1)
      returns (StartCommunicationNoteCandidateResponseV1);
}

service CommunicationNoteCandidateQueryService {
  rpc Get(GetCommunicationNoteCandidateRequestV1)
      returns (GetCommunicationNoteCandidateResponseV1);
}

enum CommunicationNoteSourceBasisV1 {
  COMMUNICATION_NOTE_SOURCE_BASIS_UNSPECIFIED = 0;
  COMMUNICATION_NOTE_SOURCE_BASIS_SUBJECT = 1;
  COMMUNICATION_NOTE_SOURCE_BASIS_BODY = 2;
  COMMUNICATION_NOTE_SOURCE_BASIS_COMBINED = 3;
}

enum CommunicationNoteTopicHintV1 {
  COMMUNICATION_NOTE_TOPIC_HINT_UNSPECIFIED = 0;
  COMMUNICATION_NOTE_TOPIC_HINT_FINANCIAL = 1;
  COMMUNICATION_NOTE_TOPIC_HINT_LEGAL = 2;
  COMMUNICATION_NOTE_TOPIC_HINT_DECISION_STATEMENT = 3;
  COMMUNICATION_NOTE_TOPIC_HINT_DEADLINE_STATEMENT = 4;
}

enum CommunicationNoteCandidateCompletenessV1 {
  COMMUNICATION_NOTE_CANDIDATE_COMPLETENESS_UNSPECIFIED = 0;
  COMMUNICATION_NOTE_CANDIDATE_COMPLETENESS_COMPLETE = 1;
}

enum CommunicationNoteCandidateStateV1 {
  COMMUNICATION_NOTE_CANDIDATE_STATE_UNSPECIFIED = 0;
  COMMUNICATION_NOTE_CANDIDATE_STATE_ACCEPTED = 1;
  COMMUNICATION_NOTE_CANDIDATE_STATE_PREPARING_SOURCE = 2;
  COMMUNICATION_NOTE_CANDIDATE_STATE_EXTRACTING = 3;
  COMMUNICATION_NOTE_CANDIDATE_STATE_READY = 4;
  COMMUNICATION_NOTE_CANDIDATE_STATE_REJECTED = 5;
}

enum CommunicationNoteCandidateErrorCodeV1 {
  COMMUNICATION_NOTE_CANDIDATE_ERROR_CODE_UNSPECIFIED = 0;
  COMMUNICATION_NOTE_CANDIDATE_ERROR_CODE_INVALID_REQUEST = 1;
  COMMUNICATION_NOTE_CANDIDATE_ERROR_CODE_NOT_FOUND = 2;
  COMMUNICATION_NOTE_CANDIDATE_ERROR_CODE_SOURCE_REJECTED = 3;
  COMMUNICATION_NOTE_CANDIDATE_ERROR_CODE_EXTRACTION_REJECTED = 4;
  COMMUNICATION_NOTE_CANDIDATE_ERROR_CODE_POLICY = 5;
  COMMUNICATION_NOTE_CANDIDATE_ERROR_CODE_UNAVAILABLE = 6;
}
