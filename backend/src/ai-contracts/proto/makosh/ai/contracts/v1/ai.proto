syntax = "proto3";

package makosh.ai.contracts.v1;

enum AiUseCaseV1 {
  AI_USE_CASE_UNSPECIFIED = 0;
  AI_USE_CASE_COMMUNICATION_REPLY_SUGGESTION = 1;
  AI_USE_CASE_COMMUNICATION_SUMMARY = 2;
  AI_USE_CASE_COMMUNICATION_TRANSLATION = 3;
  AI_USE_CASE_COMMUNICATION_EXPLANATION = 4;
  AI_USE_CASE_ATTACHMENT_TRANSLATION = 5;
}

enum AiExplanationReasonKindV1 {
  AI_EXPLANATION_REASON_KIND_UNSPECIFIED = 0;
  AI_EXPLANATION_REASON_KIND_URGENCY = 1;
  AI_EXPLANATION_REASON_KIND_FINANCIAL_ATTENTION = 2;
  AI_EXPLANATION_REASON_KIND_LEGAL_OR_CONTRACTUAL = 3;
  AI_EXPLANATION_REASON_KIND_REPLY_REQUESTED = 4;
  AI_EXPLANATION_REASON_KIND_DEADLINE = 5;
  AI_EXPLANATION_REASON_KIND_ATTACHMENT_REFERENCE = 6;
  AI_EXPLANATION_REASON_KIND_MARKETING_OR_BULK = 7;
  AI_EXPLANATION_REASON_KIND_OTHER_ATTENTION = 8;
}

enum AiExplanationSourceBasisV1 {
  AI_EXPLANATION_SOURCE_BASIS_UNSPECIFIED = 0;
  AI_EXPLANATION_SOURCE_BASIS_SUBJECT = 1;
  AI_EXPLANATION_SOURCE_BASIS_BODY = 2;
  AI_EXPLANATION_SOURCE_BASIS_CANONICAL_METADATA = 3;
  AI_EXPLANATION_SOURCE_BASIS_COMBINED = 4;
}

enum AiTranslationLanguageV1 {
  AI_TRANSLATION_LANGUAGE_UNSPECIFIED = 0;
  AI_TRANSLATION_LANGUAGE_ENGLISH = 1;
  AI_TRANSLATION_LANGUAGE_SPANISH = 2;
  AI_TRANSLATION_LANGUAGE_RUSSIAN = 3;
}

enum AiDetectedLanguageV1 {
  AI_DETECTED_LANGUAGE_UNSPECIFIED = 0;
  AI_DETECTED_LANGUAGE_UNKNOWN = 1;
  AI_DETECTED_LANGUAGE_ENGLISH = 2;
  AI_DETECTED_LANGUAGE_SPANISH = 3;
  AI_DETECTED_LANGUAGE_RUSSIAN = 4;
}

enum AiSummaryLanguageV1 {
  AI_SUMMARY_LANGUAGE_UNSPECIFIED = 0;
  AI_SUMMARY_LANGUAGE_AUTO = 1;
  AI_SUMMARY_LANGUAGE_ENGLISH = 2;
  AI_SUMMARY_LANGUAGE_SPANISH = 3;
  AI_SUMMARY_LANGUAGE_RUSSIAN = 4;
}

enum AiSummaryLengthV1 {
  AI_SUMMARY_LENGTH_UNSPECIFIED = 0;
  AI_SUMMARY_LENGTH_SHORT = 1;
  AI_SUMMARY_LENGTH_STANDARD = 2;
  AI_SUMMARY_LENGTH_DETAILED = 3;
}

enum AiReplyToneV1 {
  AI_REPLY_TONE_UNSPECIFIED = 0;
  AI_REPLY_TONE_NEUTRAL = 1;
  AI_REPLY_TONE_WARM = 2;
  AI_REPLY_TONE_FORMAL = 3;
  AI_REPLY_TONE_CONCISE = 4;
}

enum AiReplyLanguageV1 {
  AI_REPLY_LANGUAGE_UNSPECIFIED = 0;
  AI_REPLY_LANGUAGE_AUTO = 1;
  AI_REPLY_LANGUAGE_ENGLISH = 2;
  AI_REPLY_LANGUAGE_SPANISH = 3;
  AI_REPLY_LANGUAGE_RUSSIAN = 4;
}

enum AiReplySubjectPolicyV1 {
  AI_REPLY_SUBJECT_POLICY_UNSPECIFIED = 0;
  AI_REPLY_SUBJECT_POLICY_PRESERVE = 1;
  AI_REPLY_SUBJECT_POLICY_GENERATE_IF_MISSING = 2;
  AI_REPLY_SUBJECT_POLICY_OMIT = 3;
}

enum AiEgressPolicyV1 {
  AI_EGRESS_POLICY_UNSPECIFIED = 0;
  AI_EGRESS_POLICY_LOCAL_ONLY = 1;
}

enum AiInferenceTerminalStatusV1 {
  AI_INFERENCE_TERMINAL_STATUS_UNSPECIFIED = 0;
  AI_INFERENCE_TERMINAL_STATUS_READY = 1;
  AI_INFERENCE_TERMINAL_STATUS_REJECTED_POLICY = 2;
  AI_INFERENCE_TERMINAL_STATUS_REJECTED_INPUT = 3;
  AI_INFERENCE_TERMINAL_STATUS_PROVIDER_UNAVAILABLE = 4;
  AI_INFERENCE_TERMINAL_STATUS_PROVIDER_REJECTED = 5;
}

enum AiInferenceCompletenessV1 {
  AI_INFERENCE_COMPLETENESS_UNSPECIFIED = 0;
  AI_INFERENCE_COMPLETENESS_COMPLETE = 1;
  AI_INFERENCE_COMPLETENESS_PARTIAL = 2;
}

message AiPrivateSourceReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

// Provider-neutral private source content written by the workflow into a
// target-bound Blob. It never enters durable events, run storage or settings.
message AiReplySourceContentV1 {
  bytes sender_utf8 = 1;
  bytes subject_utf8 = 2;
  bytes body_utf8 = 3;
}

message AiSummarySourceContentV1 {
  bytes sender_utf8 = 1;
  bytes subject_utf8 = 2;
  bytes body_utf8 = 3;
}

message AiTranslationSourceContentV1 {
  bytes sender_utf8 = 1;
  bytes subject_utf8 = 2;
  bytes body_utf8 = 3;
}

message AiExplanationSourceContentV1 {
  bytes sender_utf8 = 1;
  bytes subject_utf8 = 2;
  bytes body_utf8 = 3;
}

message AiContextReceiptV1 {
  bytes context_id = 1;
  AiUseCaseV1 use_case = 2;
  bytes source_evidence_id = 3;
  uint64 source_evidence_revision = 4;
  uint32 contract_major = 5;
  uint32 contract_revision = 6;
  bytes contract_schema_sha256 = 7;
  bytes request_digest = 8;
}

message CommunicationReplySuggestionInferenceRequestV1 {
  bytes run_id = 1;
  AiContextReceiptV1 context = 2;
  AiPrivateSourceReceiptV1 source = 3;
  AiReplyToneV1 tone = 4;
  AiReplyLanguageV1 language = 5;
  AiReplySubjectPolicyV1 subject_policy = 6;
  uint32 maximum_output_bytes = 7;
  uint32 maximum_output_tokens = 8;
  AiEgressPolicyV1 egress_policy = 9;
  uint32 egress_policy_revision = 10;
  string logical_owner_id = 11;
}

message AiInferenceReceiptV1 {
  bytes model_revision_sha256 = 1;
  bytes prompt_policy_sha256 = 2;
  uint64 provider_settings_revision = 3;
  uint32 provider_policy_revision = 4;
}

message CommunicationReplySuggestionInferenceResultV1 {
  bytes run_id = 1;
  bytes request_digest = 2;
  bytes source_sha256 = 3;
  bytes subject_utf8 = 4;
  bytes body_utf8 = 5;
  AiReplyToneV1 resolved_tone = 6;
  AiReplyLanguageV1 resolved_language = 7;
  AiInferenceReceiptV1 inference_receipt = 8;
  AiInferenceCompletenessV1 completeness = 9;
  uint32 confidence_basis_points = 10;
  AiInferenceTerminalStatusV1 terminal_status = 11;
}

message CommunicationSummaryInferenceRequestV1 {
  bytes run_id = 1;
  AiContextReceiptV1 context = 2;
  AiPrivateSourceReceiptV1 source = 3;
  AiSummaryLanguageV1 language = 4;
  AiSummaryLengthV1 length = 5;
  uint32 maximum_output_bytes = 6;
  uint32 maximum_output_tokens = 7;
  AiEgressPolicyV1 egress_policy = 8;
  uint32 egress_policy_revision = 9;
  string logical_owner_id = 10;
}

message CommunicationSummaryInferenceResultV1 {
  bytes run_id = 1;
  bytes request_digest = 2;
  bytes source_sha256 = 3;
  bytes summary_utf8 = 4;
  AiSummaryLanguageV1 resolved_language = 5;
  AiSummaryLengthV1 resolved_length = 6;
  AiInferenceReceiptV1 inference_receipt = 7;
  AiInferenceCompletenessV1 completeness = 8;
  uint32 confidence_basis_points = 9;
  AiInferenceTerminalStatusV1 terminal_status = 10;
}

message CommunicationTranslationInferenceRequestV1 {
  bytes run_id = 1;
  AiContextReceiptV1 context = 2;
  AiPrivateSourceReceiptV1 source = 3;
  AiTranslationLanguageV1 target_language = 4;
  uint32 maximum_output_bytes = 5;
  uint32 maximum_output_tokens = 6;
  AiEgressPolicyV1 egress_policy = 7;
  uint32 egress_policy_revision = 8;
  string logical_owner_id = 9;
}

message CommunicationTranslationInferenceResultV1 {
  bytes run_id = 1;
  bytes request_digest = 2;
  bytes source_sha256 = 3;
  bytes translated_text_utf8 = 4;
  AiDetectedLanguageV1 detected_source_language = 5;
  AiTranslationLanguageV1 target_language = 6;
  AiInferenceReceiptV1 inference_receipt = 7;
  AiInferenceCompletenessV1 completeness = 8;
  uint32 confidence_basis_points = 9;
  AiInferenceTerminalStatusV1 terminal_status = 10;
}

// Distinct use-case request for a bounded text artifact derived from an
// attachment. It deliberately does not reuse the Communication Translation
// request because source custody and evidence identity have different owners.
message AttachmentTranslationInferenceRequestV1 {
  bytes run_id = 1;
  AiContextReceiptV1 context = 2;
  AiPrivateSourceReceiptV1 source = 3;
  AiTranslationLanguageV1 target_language = 4;
  uint32 maximum_output_bytes = 5;
  uint32 maximum_output_tokens = 6;
  AiEgressPolicyV1 egress_policy = 7;
  uint32 egress_policy_revision = 8;
  string logical_owner_id = 9;
}

message AttachmentTranslationInferenceResultV1 {
  bytes run_id = 1;
  bytes request_digest = 2;
  bytes source_sha256 = 3;
  bytes translated_text_utf8 = 4;
  AiDetectedLanguageV1 detected_source_language = 5;
  AiTranslationLanguageV1 target_language = 6;
  AiInferenceReceiptV1 inference_receipt = 7;
  AiInferenceCompletenessV1 completeness = 8;
  uint32 confidence_basis_points = 9;
  AiInferenceTerminalStatusV1 terminal_status = 10;
}

message CommunicationExplanationInferenceRequestV1 {
  bytes run_id = 1;
  AiContextReceiptV1 context = 2;
  AiPrivateSourceReceiptV1 source = 3;
  uint32 maximum_reasons = 4;
  uint32 maximum_reason_text_bytes = 5;
  uint32 maximum_output_tokens = 6;
  AiEgressPolicyV1 egress_policy = 7;
  uint32 egress_policy_revision = 8;
  string logical_owner_id = 9;
}

message AiExplanationReasonV1 {
  AiExplanationReasonKindV1 kind = 1;
  bytes explanation_utf8 = 2;
  AiExplanationSourceBasisV1 source_basis = 3;
  uint32 confidence_basis_points = 4;
}

message CommunicationExplanationInferenceResultV1 {
  bytes run_id = 1;
  bytes request_digest = 2;
  bytes source_sha256 = 3;
  repeated AiExplanationReasonV1 reasons = 4;
  AiInferenceReceiptV1 inference_receipt = 5;
  AiInferenceCompletenessV1 completeness = 6;
  uint32 confidence_basis_points = 7;
  AiInferenceTerminalStatusV1 terminal_status = 8;
}

// Private-content request_rpc from the AI engine to an approved provider.
// Provider/model/endpoint selection is descriptor and effective-settings owned.
message AiProviderReplyGenerationRequestV1 {
  bytes request_id = 1;
  bytes input_utf8 = 2;
  AiReplyToneV1 tone = 3;
  AiReplyLanguageV1 language = 4;
  AiReplySubjectPolicyV1 subject_policy = 5;
  uint32 maximum_output_bytes = 6;
  uint32 maximum_output_tokens = 7;
  AiEgressPolicyV1 egress_policy = 8;
  uint32 egress_policy_revision = 9;
}

message AiProviderReplyGenerationResultV1 {
  bytes request_id = 1;
  bytes subject_utf8 = 2;
  bytes body_utf8 = 3;
  AiReplyToneV1 resolved_tone = 4;
  AiReplyLanguageV1 resolved_language = 5;
  bytes model_revision_sha256 = 6;
  uint32 input_tokens = 7;
  uint32 output_tokens = 8;
  AiInferenceTerminalStatusV1 terminal_status = 9;
  AiInferenceCompletenessV1 completeness = 10;
  uint32 confidence_basis_points = 11;
  uint64 provider_settings_revision = 12;
}

message AiProviderSummaryGenerationRequestV1 {
  bytes request_id = 1;
  bytes input_utf8 = 2;
  AiSummaryLanguageV1 language = 3;
  AiSummaryLengthV1 length = 4;
  uint32 maximum_output_bytes = 5;
  uint32 maximum_output_tokens = 6;
  AiEgressPolicyV1 egress_policy = 7;
  uint32 egress_policy_revision = 8;
}

message AiProviderSummaryGenerationResultV1 {
  bytes request_id = 1;
  bytes summary_utf8 = 2;
  AiSummaryLanguageV1 resolved_language = 3;
  AiSummaryLengthV1 resolved_length = 4;
  bytes model_revision_sha256 = 5;
  uint32 input_tokens = 6;
  uint32 output_tokens = 7;
  AiInferenceTerminalStatusV1 terminal_status = 8;
  AiInferenceCompletenessV1 completeness = 9;
  uint32 confidence_basis_points = 10;
  uint64 provider_settings_revision = 11;
}

message AiProviderTranslationRequestV1 {
  bytes request_id = 1;
  bytes input_utf8 = 2;
  AiTranslationLanguageV1 target_language = 3;
  uint32 maximum_output_bytes = 4;
  uint32 maximum_output_tokens = 5;
  AiEgressPolicyV1 egress_policy = 6;
  uint32 egress_policy_revision = 7;
}

message AiProviderTranslationResultV1 {
  bytes request_id = 1;
  bytes translated_text_utf8 = 2;
  AiDetectedLanguageV1 detected_source_language = 3;
  AiTranslationLanguageV1 target_language = 4;
  bytes model_revision_sha256 = 5;
  uint32 input_tokens = 6;
  uint32 output_tokens = 7;
  AiInferenceTerminalStatusV1 terminal_status = 8;
  AiInferenceCompletenessV1 completeness = 9;
  uint32 confidence_basis_points = 10;
  uint64 provider_settings_revision = 11;
}

message AiProviderExplanationRequestV1 {
  bytes request_id = 1;
  bytes input_utf8 = 2;
  uint32 maximum_reasons = 3;
  uint32 maximum_reason_text_bytes = 4;
  uint32 maximum_output_tokens = 5;
  AiEgressPolicyV1 egress_policy = 6;
  uint32 egress_policy_revision = 7;
}

message AiProviderExplanationResultV1 {
  bytes request_id = 1;
  repeated AiExplanationReasonV1 reasons = 2;
  bytes model_revision_sha256 = 3;
  uint32 input_tokens = 4;
  uint32 output_tokens = 5;
  AiInferenceTerminalStatusV1 terminal_status = 6;
  AiInferenceCompletenessV1 completeness = 7;
  uint32 confidence_basis_points = 8;
  uint64 provider_settings_revision = 9;
}
