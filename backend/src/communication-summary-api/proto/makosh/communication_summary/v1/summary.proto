syntax = "proto3";

package makosh.communication_summary.v1;

message StartCommunicationSummaryRequestV1 {
  uint32 protocol_major = 1;
  bytes operation_id = 2;
  bytes source_message_id = 3;
  uint64 expected_source_revision = 4;
  CommunicationSummaryLanguageV1 language = 5;
  CommunicationSummaryLengthV1 length = 6;
}

message StartCommunicationSummaryResponseV1 {
  bytes run_id = 1;
  CommunicationSummaryStateV1 state = 2;
  CommunicationSummaryErrorCodeV1 error = 15;
}

message GetCommunicationSummaryRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message GetCommunicationSummaryResponseV1 {
  bytes run_id = 1;
  bytes source_message_id = 2;
  uint64 expected_source_revision = 3;
  CommunicationSummaryStateV1 state = 4;
  uint64 state_revision = 5;
  optional CommunicationSummaryCandidateV1 candidate = 6;
  CommunicationSummaryErrorCodeV1 error = 15;
}

message CommunicationSummaryCandidateV1 {
  bytes summary_utf8 = 1;
  CommunicationSummaryLanguageV1 resolved_language = 2;
  CommunicationSummaryLengthV1 resolved_length = 3;
  CommunicationSummaryCompletenessV1 completeness = 4;
  uint32 confidence_basis_points = 5;
}

message CommunicationSummaryStatusChangedV1 {
  bytes run_id = 1;
  CommunicationSummaryStateV1 state = 2;
  uint64 state_revision = 3;
  uint64 occurred_at_unix_millis = 4;
  CommunicationSummaryErrorCodeV1 error = 15;
}

service CommunicationSummaryCommandService {
  rpc Start(StartCommunicationSummaryRequestV1)
      returns (StartCommunicationSummaryResponseV1);
}

service CommunicationSummaryQueryService {
  rpc Get(GetCommunicationSummaryRequestV1)
      returns (GetCommunicationSummaryResponseV1);
}

enum CommunicationSummaryLanguageV1 {
  COMMUNICATION_SUMMARY_LANGUAGE_UNSPECIFIED = 0;
  COMMUNICATION_SUMMARY_LANGUAGE_AUTO = 1;
  COMMUNICATION_SUMMARY_LANGUAGE_ENGLISH = 2;
  COMMUNICATION_SUMMARY_LANGUAGE_RUSSIAN = 3;
  COMMUNICATION_SUMMARY_LANGUAGE_SPANISH = 4;
}

enum CommunicationSummaryLengthV1 {
  COMMUNICATION_SUMMARY_LENGTH_UNSPECIFIED = 0;
  COMMUNICATION_SUMMARY_LENGTH_SHORT = 1;
  COMMUNICATION_SUMMARY_LENGTH_STANDARD = 2;
  COMMUNICATION_SUMMARY_LENGTH_DETAILED = 3;
}

enum CommunicationSummaryStateV1 {
  COMMUNICATION_SUMMARY_STATE_UNSPECIFIED = 0;
  COMMUNICATION_SUMMARY_STATE_ACCEPTED = 1;
  COMMUNICATION_SUMMARY_STATE_PREPARING_SOURCE = 2;
  COMMUNICATION_SUMMARY_STATE_AWAITING_INFERENCE = 3;
  COMMUNICATION_SUMMARY_STATE_READY = 4;
  COMMUNICATION_SUMMARY_STATE_REJECTED = 5;
}

enum CommunicationSummaryCompletenessV1 {
  COMMUNICATION_SUMMARY_COMPLETENESS_UNSPECIFIED = 0;
  COMMUNICATION_SUMMARY_COMPLETENESS_COMPLETE = 1;
  COMMUNICATION_SUMMARY_COMPLETENESS_PARTIAL = 2;
}

enum CommunicationSummaryErrorCodeV1 {
  COMMUNICATION_SUMMARY_ERROR_CODE_UNSPECIFIED = 0;
  COMMUNICATION_SUMMARY_ERROR_CODE_INVALID_REQUEST = 1;
  COMMUNICATION_SUMMARY_ERROR_CODE_NOT_FOUND = 2;
  COMMUNICATION_SUMMARY_ERROR_CODE_SOURCE_REJECTED = 3;
  COMMUNICATION_SUMMARY_ERROR_CODE_INFERENCE_REJECTED = 4;
  COMMUNICATION_SUMMARY_ERROR_CODE_POLICY = 5;
  COMMUNICATION_SUMMARY_ERROR_CODE_UNAVAILABLE = 6;
}
