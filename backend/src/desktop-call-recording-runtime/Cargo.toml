[package]
name = "makosh-desktop-call-recording-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-desktop-call-recording-runtime"
path = "src/main.rs"

[package.metadata.makosh]
role = "integration"
owner = "desktop_call_recording"
surface = "runtime"

[dependencies]
makosh-blob-client = { path = "../platform/blob/client" }
makosh-call-transcription-ingress = { path = "../call-transcription-ingress" }
makosh-desktop-call-recording-api = { path = "../desktop-call-recording-api" }
makosh-desktop-call-recording-core = { path = "../desktop-call-recording-core" }
makosh-desktop-call-recording-persistence = { path = "../desktop-call-recording-persistence" }
makosh-events-jetstream = { path = "../platform/events/jetstream" }
makosh-events-protocol = { path = "../platform/events" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-storage-vault = { path = "../platform/storage/vault" }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
