[package]
name = "makosh-identity-resolution-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
conformance-test-support = []

[package.metadata.makosh]
role = "engine"
owner = "identity_resolution"
surface = "persistence"

[dependencies]
makosh-identity-resolution-core = { path = "../identity-resolution-core" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
