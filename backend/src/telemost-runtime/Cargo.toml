[package]
name = "makosh-telemost-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
[lib]
path = "src/lib.rs"
[[bin]]
name = "makosh-telemost-runtime"
path = "src/main.rs"
[package.metadata.makosh]
role = "integration"
owner = "telemost"
surface = "runtime"
[dependencies]
makosh-telemost-api = { path = "../telemost-api" }
makosh-telemost-core = { path = "../telemost-core" }
makosh-telemost-persistence = { path = "../telemost-persistence" }
makosh-communications-call-evidence-ingress = { path = "../communications-call-evidence-ingress" }
makosh-events-protocol = { path = "../platform/events" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
