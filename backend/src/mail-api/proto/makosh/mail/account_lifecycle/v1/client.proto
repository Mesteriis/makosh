syntax = "proto3";

package makosh.mail.account_lifecycle.v1;

service MailAccountRetireService {
  rpc Retire(MailAccountLifecycleCommandV1)
      returns (MailAccountLifecycleReceiptV1);
}

service MailAccountDeleteService {
  rpc Delete(MailAccountLifecycleCommandV1)
      returns (MailAccountLifecycleReceiptV1);
}

service MailAccountLifecycleRetryService {
  rpc Retry(MailAccountLifecycleRetryV1)
      returns (MailAccountLifecycleReceiptV1);
}

service MailAccountLifecycleStatusService {
  rpc Get(MailAccountLifecycleStatusRequestV1)
      returns (MailAccountLifecycleReceiptV1);
}

enum MailAccountLifecycleActionV1 {
  MAIL_ACCOUNT_LIFECYCLE_ACTION_UNSPECIFIED = 0;
  MAIL_ACCOUNT_LIFECYCLE_ACTION_RETIRE = 1;
  MAIL_ACCOUNT_LIFECYCLE_ACTION_DELETE = 2;
}

enum MailAccountLifecycleStateV1 {
  MAIL_ACCOUNT_LIFECYCLE_STATE_UNSPECIFIED = 0;
  MAIL_ACCOUNT_LIFECYCLE_STATE_PENDING = 1;
  MAIL_ACCOUNT_LIFECYCLE_STATE_COMPLETED = 2;
  MAIL_ACCOUNT_LIFECYCLE_STATE_REJECTED = 3;
  MAIL_ACCOUNT_LIFECYCLE_STATE_OUTCOME_UNKNOWN = 4;
}

enum MailCredentialLifecycleStateV1 {
  MAIL_CREDENTIAL_LIFECYCLE_STATE_UNSPECIFIED = 0;
  MAIL_CREDENTIAL_LIFECYCLE_STATE_PENDING = 1;
  MAIL_CREDENTIAL_LIFECYCLE_STATE_COMPLETED = 2;
  MAIL_CREDENTIAL_LIFECYCLE_STATE_REJECTED = 3;
  MAIL_CREDENTIAL_LIFECYCLE_STATE_OUTCOME_UNKNOWN = 4;
}

enum MailLifecycleCredentialPurposeV1 {
  MAIL_LIFECYCLE_CREDENTIAL_PURPOSE_UNSPECIFIED = 0;
  MAIL_LIFECYCLE_CREDENTIAL_PURPOSE_IMAP_PASSWORD = 1;
  MAIL_LIFECYCLE_CREDENTIAL_PURPOSE_SMTP_PASSWORD = 2;
  MAIL_LIFECYCLE_CREDENTIAL_PURPOSE_GMAIL_ACCESS_TOKEN = 3;
  MAIL_LIFECYCLE_CREDENTIAL_PURPOSE_GMAIL_REFRESH_CREDENTIAL = 4;
  MAIL_LIFECYCLE_CREDENTIAL_PURPOSE_ICLOUD_CARDDAV_PASSWORD = 5;
}

message MailAccountLifecycleCommandV1 {
  string operation_id = 1;
  string connection_id = 2;
  uint64 expected_lifecycle_revision = 3;
}

message MailAccountLifecycleRetryV1 {
  string operation_id = 1;
  string connection_id = 2;
  uint64 expected_lifecycle_revision = 3;
}

message MailAccountLifecycleStatusRequestV1 {
  string operation_id = 1;
  string connection_id = 2;
}

message MailCredentialLifecycleProgressV1 {
  MailLifecycleCredentialPurposeV1 purpose = 1;
  MailCredentialLifecycleStateV1 state = 2;
  optional uint64 binding_revision = 3;
  uint64 credential_revision = 4;
}

message MailAccountLifecycleReceiptV1 {
  string operation_id = 1;
  string connection_id = 2;
  MailAccountLifecycleActionV1 action = 3;
  uint64 lifecycle_revision = 4;
  MailAccountLifecycleStateV1 state = 5;
  repeated MailCredentialLifecycleProgressV1 credential = 6;
}
