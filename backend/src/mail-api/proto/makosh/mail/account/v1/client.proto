syntax = "proto3";

package makosh.mail.account.v1;

service MailAccountCredentialBindingService {
  rpc Bind(MailBindCredentialRequestV1)
      returns (MailCredentialBindingReceiptV1);
}

service MailAccountQueryService {
  rpc Get(MailAccountStatusRequestV1) returns (MailAccountStatusV1);
}

service MailAccountCatalogService {
  rpc List(MailAccountCatalogRequestV1) returns (MailAccountCatalogV1);
}

enum MailCredentialPurposeV1 {
  MAIL_CREDENTIAL_PURPOSE_UNSPECIFIED = 0;
  MAIL_CREDENTIAL_PURPOSE_IMAP_PASSWORD = 1;
  MAIL_CREDENTIAL_PURPOSE_SMTP_PASSWORD = 2;
  MAIL_CREDENTIAL_PURPOSE_GMAIL_ACCESS_TOKEN = 3;
  MAIL_CREDENTIAL_PURPOSE_GMAIL_REFRESH_CREDENTIAL = 4;
  MAIL_CREDENTIAL_PURPOSE_ICLOUD_CARDDAV_PASSWORD = 5;
}

enum MailCredentialBindingStateV1 {
  MAIL_CREDENTIAL_BINDING_STATE_UNSPECIFIED = 0;
  MAIL_CREDENTIAL_BINDING_STATE_UNCONFIGURED = 1;
  MAIL_CREDENTIAL_BINDING_STATE_PENDING_RESTART = 2;
  MAIL_CREDENTIAL_BINDING_STATE_ACTIVE = 3;
  MAIL_CREDENTIAL_BINDING_STATE_RETIRED = 4;
  MAIL_CREDENTIAL_BINDING_STATE_DELETED = 5;
}

enum MailAccountReadinessV1 {
  MAIL_ACCOUNT_READINESS_UNSPECIFIED = 0;
  MAIL_ACCOUNT_READINESS_CONFIGURATION_ONLY = 1;
  MAIL_ACCOUNT_READINESS_PENDING_RESTART = 2;
  MAIL_ACCOUNT_READINESS_READY = 3;
  MAIL_ACCOUNT_READINESS_RETIRED = 4;
  MAIL_ACCOUNT_READINESS_DELETED = 5;
  MAIL_ACCOUNT_READINESS_DEGRADED = 6;
}

enum MailConnectorProfileV1 {
  MAIL_CONNECTOR_PROFILE_UNSPECIFIED = 0;
  MAIL_CONNECTOR_PROFILE_IMAP = 1;
  MAIL_CONNECTOR_PROFILE_IMAP_SMTP = 2;
  MAIL_CONNECTOR_PROFILE_GMAIL = 3;
}

enum MailProviderPathReadinessV1 {
  MAIL_PROVIDER_PATH_READINESS_UNSPECIFIED = 0;
  MAIL_PROVIDER_PATH_READINESS_NOT_CONFIGURED = 1;
  MAIL_PROVIDER_PATH_READINESS_CREDENTIAL_REQUIRED = 2;
  MAIL_PROVIDER_PATH_READINESS_PENDING_RESTART = 3;
  MAIL_PROVIDER_PATH_READINESS_READY = 4;
  MAIL_PROVIDER_PATH_READINESS_RETIRED = 5;
  MAIL_PROVIDER_PATH_READINESS_DELETED = 6;
  MAIL_PROVIDER_PATH_READINESS_DEGRADED = 7;
}

message MailBindCredentialRequestV1 {
  string connection_id = 1;
  MailCredentialPurposeV1 purpose = 2;
  uint64 expected_binding_revision = 3;
  uint64 credential_revision = 4;
}

message MailCredentialBindingReceiptV1 {
  string connection_id = 1;
  MailCredentialPurposeV1 purpose = 2;
  uint64 binding_revision = 3;
  MailCredentialBindingStateV1 state = 4;
}

message MailAccountStatusRequestV1 {
  string connection_id = 1;
}

message MailAccountCatalogRequestV1 {
  uint32 major = 1;
}

message MailCredentialBindingStatusV1 {
  MailCredentialPurposeV1 purpose = 1;
  MailCredentialBindingStateV1 state = 2;
  optional uint64 binding_revision = 3;
  optional uint64 credential_revision = 4;
  optional uint64 applied_runtime_generation = 5;
}

message MailAccountStatusV1 {
  string connection_id = 1;
  uint64 settings_revision = 2;
  uint64 runtime_generation = 3;
  MailAccountReadinessV1 readiness = 4;
  MailConnectorProfileV1 connector_profile = 5;
  MailProviderPathReadinessV1 sync_readiness = 6;
  MailProviderPathReadinessV1 delivery_readiness = 7;
  repeated MailCredentialBindingStatusV1 binding = 8;
  uint64 lifecycle_revision = 9;
  optional string lifecycle_operation_id = 10;
  string configuration_instance_id = 11;
}

message MailAccountCatalogV1 {
  repeated MailAccountStatusV1 accounts = 1;
}
