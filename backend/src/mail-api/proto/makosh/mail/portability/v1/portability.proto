syntax = "proto3";

package makosh.mail.portability.v1;

enum MailExportConnectorProfileV1 {
  MAIL_EXPORT_CONNECTOR_PROFILE_UNSPECIFIED = 0;
  MAIL_EXPORT_CONNECTOR_PROFILE_IMAP = 1;
  MAIL_EXPORT_CONNECTOR_PROFILE_IMAP_SMTP = 2;
  MAIL_EXPORT_CONNECTOR_PROFILE_GMAIL = 3;
}

enum MailExportAccountReadinessV1 {
  MAIL_EXPORT_ACCOUNT_READINESS_UNSPECIFIED = 0;
  MAIL_EXPORT_ACCOUNT_READINESS_CONFIGURATION_ONLY = 1;
  MAIL_EXPORT_ACCOUNT_READINESS_PENDING_RESTART = 2;
  MAIL_EXPORT_ACCOUNT_READINESS_READY = 3;
  MAIL_EXPORT_ACCOUNT_READINESS_RETIRED = 4;
  MAIL_EXPORT_ACCOUNT_READINESS_DELETED = 5;
  MAIL_EXPORT_ACCOUNT_READINESS_DEGRADED = 6;
}

enum MailExportProviderPathReadinessV1 {
  MAIL_EXPORT_PROVIDER_PATH_READINESS_UNSPECIFIED = 0;
  MAIL_EXPORT_PROVIDER_PATH_READINESS_NOT_CONFIGURED = 1;
  MAIL_EXPORT_PROVIDER_PATH_READINESS_CREDENTIAL_REQUIRED = 2;
  MAIL_EXPORT_PROVIDER_PATH_READINESS_PENDING_RESTART = 3;
  MAIL_EXPORT_PROVIDER_PATH_READINESS_READY = 4;
  MAIL_EXPORT_PROVIDER_PATH_READINESS_RETIRED = 5;
  MAIL_EXPORT_PROVIDER_PATH_READINESS_DELETED = 6;
  MAIL_EXPORT_PROVIDER_PATH_READINESS_DEGRADED = 7;
}

message MailTlsEndpointV1 {
  string host = 1;
  uint32 port = 2;
  optional string ca_certificate_pem = 3;
}

message MailHttpEndpointV1 {
  string host = 1;
  uint32 port = 2;
  string path = 3;
  optional string ca_certificate_pem = 4;
}

message MailImapConfigurationV1 {
  string host = 1;
  uint32 port = 2;
  string username = 3;
}

message MailSmtpConfigurationV1 {
  string host = 1;
  uint32 port = 2;
  string username = 3;
  string from_address = 4;
  optional string ca_certificate_pem = 5;
}

message MailGmailConfigurationV1 {
  string user_id = 1;
  string from_address = 2;
  MailTlsEndpointV1 api_endpoint = 3;
  string oauth_client_id = 4;
  string oauth_redirect_uri = 5;
  MailHttpEndpointV1 oauth_authorization_endpoint = 6;
  MailHttpEndpointV1 oauth_token_endpoint = 7;
}

enum MailAddressBookProviderV1 {
  MAIL_ADDRESS_BOOK_PROVIDER_UNSPECIFIED = 0;
  MAIL_ADDRESS_BOOK_PROVIDER_NONE = 1;
  MAIL_ADDRESS_BOOK_PROVIDER_GOOGLE_PEOPLE = 2;
  MAIL_ADDRESS_BOOK_PROVIDER_ICLOUD_CARD_DAV = 3;
}

message MailAccountConfigurationV1 {
  string connection_id = 1;
  uint32 sync_window = 2;
  uint32 sync_windows = 3;
  oneof inbound {
    MailImapConfigurationV1 imap = 4;
    MailGmailConfigurationV1 gmail = 5;
  }
  optional MailSmtpConfigurationV1 smtp = 6;
  MailAddressBookProviderV1 address_book_provider = 7;
  optional string carddav_username = 8;
}

message MailAccountExportV1 {
  uint32 major = 1;
  uint64 exported_at_unix_millis = 2;
  string source_registration_id = 3;
  uint32 settings_schema_major = 4;
  uint32 settings_schema_revision = 5;
  uint64 effective_settings_revision = 6;
  MailExportConnectorProfileV1 connector_profile = 7;
  MailExportAccountReadinessV1 readiness = 8;
  MailExportProviderPathReadinessV1 sync_readiness = 9;
  MailExportProviderPathReadinessV1 delivery_readiness = 10;
  MailAccountConfigurationV1 configuration = 11;
}
