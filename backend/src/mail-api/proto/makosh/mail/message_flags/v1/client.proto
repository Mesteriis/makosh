syntax = "proto3";

package makosh.mail.message_flags.v1;

enum MailMessageFlagKindV1 {
  MAIL_MESSAGE_FLAG_KIND_UNSPECIFIED = 0;
  MAIL_MESSAGE_FLAG_KIND_READ = 1;
  MAIL_MESSAGE_FLAG_KIND_STARRED = 2;
}

message MailMessageFlagCommandV1 {
  string operation_id = 1;
  string connection_id = 2;
  string message_id = 3;
  MailMessageFlagKindV1 kind = 4;
  bool target_value = 5;
}

message MailMessageFlagAcceptedV1 {
  string operation_id = 1;
}

message MailMessageFlagStatusRequestV1 {
  string operation_id = 1;
  string connection_id = 2;
}

enum MailMessageFlagOperationOutcomeV1 {
  MAIL_MESSAGE_FLAG_OPERATION_OUTCOME_UNSPECIFIED = 0;
  MAIL_MESSAGE_FLAG_OPERATION_OUTCOME_PENDING = 1;
  MAIL_MESSAGE_FLAG_OPERATION_OUTCOME_SUCCEEDED = 2;
  MAIL_MESSAGE_FLAG_OPERATION_OUTCOME_REJECTED = 3;
  MAIL_MESSAGE_FLAG_OPERATION_OUTCOME_UNKNOWN = 4;
}

message MailMessageFlagOperationStatusV1 {
  string operation_id = 1;
  string connection_id = 2;
  string message_id = 3;
  MailMessageFlagKindV1 kind = 4;
  bool target_value = 5;
  MailMessageFlagOperationOutcomeV1 outcome = 6;
  int64 requested_at_unix_seconds = 7;
  optional int64 completed_at_unix_seconds = 8;
  optional uint64 projection_revision = 9;
}

message MailMessageFlagStatusResponseV1 {
  optional MailMessageFlagOperationStatusV1 status = 1;
}

service MailMessageFlagCommandService {
  rpc Mutate(MailMessageFlagCommandV1) returns (MailMessageFlagAcceptedV1);
}

service MailMessageFlagQueryService {
  rpc GetOperationStatus(MailMessageFlagStatusRequestV1)
      returns (MailMessageFlagStatusResponseV1);
}
