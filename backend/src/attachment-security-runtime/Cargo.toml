[package]
name = "makosh-attachment-security-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "makosh-attachment-security-runtime"
path = "src/main.rs"

[lib]
name = "makosh_attachment_security_runtime"
path = "src/lib.rs"

[package.metadata.makosh]
role = "engine"
owner = "attachment_security"
surface = "runtime"

[dependencies]
makosh-attachment-archive-inspection-ingress = { path = "../attachment-archive-inspection-ingress" }
makosh-attachment-preview-ingress = { path = "../attachment-preview-ingress" }
makosh-attachment-text-extraction-ingress = { path = "../attachment-text-extraction-ingress" }
makosh-attachment-security-clamav = { path = "../attachment-security-clamav" }
makosh-attachment-security-contract = { path = "../attachment-security-contract" }
makosh-attachment-security-core = { path = "../attachment-security-core" }
makosh-attachment-security-persistence = { path = "../attachment-security-persistence" }
makosh-blob-client = { path = "../platform/blob/client" }
makosh-communications-attachment-contract = { path = "../communications-attachment-contract" }
makosh-events-jetstream = { path = "../platform/events/jetstream" }
makosh-events-protocol = { path = "../platform/events" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-storage-vault = { path = "../platform/storage/vault" }
libc = "=0.2.186"
prost = "=0.14.4"
prost-types = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
