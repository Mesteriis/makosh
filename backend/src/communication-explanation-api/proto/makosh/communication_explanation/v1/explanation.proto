syntax = "proto3";

package makosh.communication_explanation.v1;

message StartCommunicationExplanationRequestV1 {
  uint32 protocol_major = 1;
  bytes operation_id = 2;
  bytes source_message_id = 3;
  uint64 expected_source_revision = 4;
}

message StartCommunicationExplanationResponseV1 {
  bytes run_id = 1;
  CommunicationExplanationStateV1 state = 2;
  CommunicationExplanationErrorCodeV1 error = 15;
}

message GetCommunicationExplanationRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message GetCommunicationExplanationResponseV1 {
  bytes run_id = 1;
  bytes source_message_id = 2;
  uint64 expected_source_revision = 3;
  CommunicationExplanationStateV1 state = 4;
  uint64 state_revision = 5;
  optional CommunicationExplanationCandidateV1 candidate = 6;
  CommunicationExplanationErrorCodeV1 error = 15;
}

message CommunicationExplanationCandidateV1 {
  repeated CommunicationExplanationReasonV1 reasons = 1;
  CommunicationExplanationCompletenessV1 completeness = 2;
  uint32 confidence_basis_points = 3;
}

message CommunicationExplanationReasonV1 {
  CommunicationExplanationReasonKindV1 kind = 1;
  bytes explanation_utf8 = 2;
  CommunicationExplanationSourceBasisV1 source_basis = 3;
  uint32 confidence_basis_points = 4;
}

message CommunicationExplanationStatusChangedV1 {
  bytes run_id = 1;
  CommunicationExplanationStateV1 state = 2;
  uint64 state_revision = 3;
  uint64 occurred_at_unix_millis = 4;
  CommunicationExplanationErrorCodeV1 error = 15;
}

service CommunicationExplanationCommandService {
  rpc Start(StartCommunicationExplanationRequestV1)
      returns (StartCommunicationExplanationResponseV1);
}

service CommunicationExplanationQueryService {
  rpc Get(GetCommunicationExplanationRequestV1)
      returns (GetCommunicationExplanationResponseV1);
}

enum CommunicationExplanationReasonKindV1 {
  COMMUNICATION_EXPLANATION_REASON_KIND_UNSPECIFIED = 0;
  COMMUNICATION_EXPLANATION_REASON_KIND_URGENCY = 1;
  COMMUNICATION_EXPLANATION_REASON_KIND_FINANCIAL_ATTENTION = 2;
  COMMUNICATION_EXPLANATION_REASON_KIND_LEGAL_OR_CONTRACTUAL = 3;
  COMMUNICATION_EXPLANATION_REASON_KIND_REPLY_REQUESTED = 4;
  COMMUNICATION_EXPLANATION_REASON_KIND_DEADLINE = 5;
  COMMUNICATION_EXPLANATION_REASON_KIND_ATTACHMENT_REFERENCE = 6;
  COMMUNICATION_EXPLANATION_REASON_KIND_MARKETING_OR_BULK = 7;
  COMMUNICATION_EXPLANATION_REASON_KIND_OTHER_ATTENTION = 8;
}

enum CommunicationExplanationSourceBasisV1 {
  COMMUNICATION_EXPLANATION_SOURCE_BASIS_UNSPECIFIED = 0;
  COMMUNICATION_EXPLANATION_SOURCE_BASIS_SUBJECT = 1;
  COMMUNICATION_EXPLANATION_SOURCE_BASIS_BODY = 2;
  COMMUNICATION_EXPLANATION_SOURCE_BASIS_CANONICAL_METADATA = 3;
  COMMUNICATION_EXPLANATION_SOURCE_BASIS_COMBINED = 4;
}

enum CommunicationExplanationStateV1 {
  COMMUNICATION_EXPLANATION_STATE_UNSPECIFIED = 0;
  COMMUNICATION_EXPLANATION_STATE_ACCEPTED = 1;
  COMMUNICATION_EXPLANATION_STATE_PREPARING_SOURCE = 2;
  COMMUNICATION_EXPLANATION_STATE_AWAITING_INFERENCE = 3;
  COMMUNICATION_EXPLANATION_STATE_READY = 4;
  COMMUNICATION_EXPLANATION_STATE_REJECTED = 5;
}

enum CommunicationExplanationCompletenessV1 {
  COMMUNICATION_EXPLANATION_COMPLETENESS_UNSPECIFIED = 0;
  COMMUNICATION_EXPLANATION_COMPLETENESS_COMPLETE = 1;
  COMMUNICATION_EXPLANATION_COMPLETENESS_PARTIAL = 2;
}

enum CommunicationExplanationErrorCodeV1 {
  COMMUNICATION_EXPLANATION_ERROR_CODE_UNSPECIFIED = 0;
  COMMUNICATION_EXPLANATION_ERROR_CODE_INVALID_REQUEST = 1;
  COMMUNICATION_EXPLANATION_ERROR_CODE_NOT_FOUND = 2;
  COMMUNICATION_EXPLANATION_ERROR_CODE_SOURCE_REJECTED = 3;
  COMMUNICATION_EXPLANATION_ERROR_CODE_INFERENCE_REJECTED = 4;
  COMMUNICATION_EXPLANATION_ERROR_CODE_POLICY = 5;
  COMMUNICATION_EXPLANATION_ERROR_CODE_UNAVAILABLE = 6;
}
