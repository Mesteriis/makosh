[package]
name = "makosh-scheduler-jetstream"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.makosh]
role = "platform"
owner = "scheduler"
surface = "implementation"

[dependencies]
async-nats = "=0.49.1"
futures-util = "=0.3.32"
getrandom = { version = "=0.4.3", default-features = false }
makosh-events-protocol = { path = "../../events" }
makosh-runtime-protocol = { path = "../../runtime_protocol" }
makosh-scheduler-protocol = { path = "../protocol" }
nats-jwt = "=0.3.0"
prost = "=0.14.4"
tokio = { version = "=1.52.4", default-features = false, features = ["time"] }
