[package]
name = "makosh-telemetry-collector"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "makosh-telemetry-collector"
path = "src/main.rs"

[package.metadata.makosh]
role = "platform"
owner = "telemetry"
surface = "runtime"
components = ["telemetry_collector"]

[dependencies]
makosh-telemetry-protocol = { path = "../protocol" }
makosh-runtime-protocol = { path = "../../runtime_protocol" }
libc = "=0.2.186"
prost = "=0.14.4"
