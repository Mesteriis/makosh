[package]
name = "makosh-runtime-protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.makosh]
role = "platform"
owner = "runtime_protocol"
surface = "contract"

[dependencies]
getrandom = { version = "=0.4.3", default-features = false }
libc = "=0.2.186"
prost = "=0.14.4"
prost-types = "=0.14.4"

[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
