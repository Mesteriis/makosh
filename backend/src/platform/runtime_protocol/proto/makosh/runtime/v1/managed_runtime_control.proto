syntax = "proto3";

package makosh.runtime.v1;

import "makosh/runtime/v1/vault_runtime.proto";
import "makosh/runtime/v1/module_client.proto";
import "makosh/runtime/v1/blob_runtime.proto";
import "makosh/runtime/v1/recovery.proto";

// One-shot inherited private control channel for a Kernel-managed runtime.
message DescribeManagedRuntimeRequestV1 {
  bytes descriptor_bytes = 1;
  bytes settings_schema_bytes = 2;
}
message DescribeManagedRuntimeResponseV1 {
  string registration_id = 1;
  uint64 runtime_generation = 2;
  uint64 grant_epoch = 3;
}
message ManagedRuntimeReadyRequestV1 {
  string registration_id = 1;
  uint64 runtime_generation = 2;
  uint64 grant_epoch = 3;
}
// Sent by a verified managed module after ready. It deliberately carries no
// owner identity or NATS subjects: Kernel derives those from approved topology.
message ManagedRuntimeEventCredentialRequestV1 {
  bytes request_id = 1;
  uint64 credential_revision = 2;
  uint32 ttl_seconds = 3;
  bytes recipient_public_key_x25519 = 4;
}
// Kernel-derived pull-consumer binding for one already approved subscription.
// A managed runtime receives it only with a credential delivery bound to its
// current registration, runtime generation and grant epoch.
message ManagedRuntimeEventConsumerBindingV1 {
  string stream_name = 1;
  string durable_name = 2;
  string filter_subject = 3;
  uint32 ack_wait_millis = 4;
  uint32 max_deliver = 5;
  uint32 max_ack_pending = 6;
  // Exact approved contract behind this broker binding. A runtime must select
  // a delivery by this reference, never by a subject string it constructed.
  ContractReferenceV1 contract = 7;
}
message ManagedRuntimeEventCredentialDeliveryV1 {
  bytes encapped_key = 1;
  bytes ciphertext = 2;
  bytes tag = 3;
  repeated ManagedRuntimeEventConsumerBindingV1 consumer_bindings = 4;
  // Exact publish subjects derived by Kernel from the approved topology.
  repeated string publish_subjects = 5;
}
message ManagedRuntimeProviderCredentialRequestV1 {
  bytes request_id = 1;
  string purpose_id = 2;
  uint64 credential_revision = 3;
  uint32 ttl_seconds = 4;
  uint32 secret_class = 5;
  bytes recipient_public_key_x25519 = 6;
  string configuration_instance_id = 7;
  // Exactly one descriptor-declared Vault action; never an implicit write grant.
  uint32 action = 8;
}
message ManagedRuntimeProviderCredentialDeliveryV1 {
  bytes encapped_key = 1;
  bytes ciphertext = 2;
  bytes tag = 3;
}
// Requests an exact descriptor-declared owner-derived key lease. The request
// carries no configuration instance, action, secret class or key material:
// Kernel derives all of those from the exact approved owner capability.
message ManagedRuntimeOwnerDerivedKeyRequestV1 {
  bytes request_id = 1;
  string purpose_id = 2;
  uint32 key_schema_revision = 3;
  uint32 ttl_seconds = 4;
  bytes recipient_public_key_x25519 = 5;
  string capability_id = 6;
}
message ManagedRuntimeOwnerDerivedKeyDeliveryV1 {
  bytes encapped_key = 1;
  bytes ciphertext = 2;
  bytes tag = 3;
}
// Request for exactly one Blob data session. The runtime supplies a fresh
// channel-binding digest; content never crosses this control channel.
message ManagedRuntimeBlobSessionRequestV1 {
  bytes request_id = 1;
  string capability_id = 2;
  uint32 operation = 3;
  bytes channel_binding_sha256 = 4;
  bytes reference_id = 5;
  uint64 declared_size = 6;
  uint32 backup_class = 7;
  uint32 ttl_seconds = 8;
  // Present only for a typed admitted-body write. Kernel signs it into a
  // durable custody proof; it never receives the plaintext.
  bytes receipt_sha256 = 9;
  // Required only for custody transfer. Kernel verifies this proof and binds
  // the resulting target reference to the exact consumed evidence envelope.
  bytes custody_source_proof = 10;
  bytes evidence_id = 11;
  bytes evidence_envelope_sha256 = 12;
  // Optional only for a write that authorizes a later exact cross-owner
  // custody transfer. All three target fields must be empty or present.
  string custody_target_owner_id = 13;
  string custody_target_module_id = 14;
  string custody_target_capability_id = 15;
}
message ManagedRuntimeBlobSessionDeliveryV1 {
  string data_socket_path = 1;
  BlobDataSessionGrantV1 grant = 2;
  // Empty for ordinary Blob sessions. This proof cannot authorize a read.
  bytes custody_transfer_source_proof = 3;
  BlobCustodyTransferGrantV1 custody_transfer_grant = 4;
}
// Current custody owner asks Blob authority to reserve one idempotent
// grace-period release. Runtime/grant coordinates come from this authenticated
// managed channel and are deliberately absent from the module payload.
message ManagedRuntimeBlobCustodyReleaseRequestV1 {
  bytes operation_id = 1;
  string capability_id = 2;
  bytes reference_id = 3;
  uint64 declared_size = 4;
  bytes receipt_sha256 = 5;
  bytes custody_source_proof = 6;
  BlobCustodyReleaseReasonV1 reason = 7;
}
message ManagedRuntimeBlobCustodyReleaseDeliveryV1 {
  bytes operation_id = 1;
  BlobCustodyReleaseOutcomeV1 outcome = 2;
  uint64 delete_not_before_unix_ms = 3;
}
// Current custodian asks Kernel to mint one exact target-bound proof from
// already accepted custody lineage. Runtime/grant coordinates come only from
// the authenticated managed channel.
message ManagedRuntimeBlobCustodyDelegationRequestV1 {
  bytes request_id = 1;
  string capability_id = 2;
  bytes current_reference_id = 3;
  bytes predecessor_custody_source_proof = 4;
  bytes predecessor_evidence_id = 5;
  bytes predecessor_evidence_envelope_sha256 = 6;
  string target_owner_id = 7;
  string target_module_id = 8;
  string target_capability_id = 9;
  // Provider-neutral alternative to fields 7-9. Kernel resolves the single
  // current request provider using the same dependency, grant and fence rules
  // as RouteModuleRequest. Exact target coordinates and this contract are
  // mutually exclusive.
  ContractReferenceV1 target_request_contract = 10;
}
message ManagedRuntimeBlobCustodyDelegationDeliveryV1 {
  bytes request_id = 1;
  bytes custody_transfer_source_proof = 2;
  string resolved_target_owner_id = 3;
  string resolved_target_module_id = 4;
  string resolved_target_capability_id = 5;
}
// Caller-to-Kernel request for one descriptor-declared query dependency.
// Target process identity and capability are deliberately absent: Kernel
// resolves the single current approved provider of the exact contract.
message ManagedRuntimeModuleQueryRequestV1 {
  bytes request_id = 1;
  ContractReferenceV1 contract = 2;
  bytes request_payload = 3;
  uint32 deadline_millis = 4;
}
// Kernel-to-provider delivery after caller dependency, same-owner and both
// runtime fences have been authorized. The provider never sees caller process
// coordinates or grants.
message ManagedRuntimeModuleQueryDeliveryV1 {
  bytes request_id = 1;
  string logical_owner_id = 2;
  ContractReferenceV1 contract = 3;
  bytes request_payload = 4;
}
message ManagedRuntimeModuleQueryResponseV1 {
  bytes request_id = 1;
  bytes response_payload = 2;
  string error_code = 15;
}
// Caller-to-Kernel request for one descriptor-declared request dependency.
// Kernel never retries this potentially mutating operation.
message ManagedRuntimeModuleRequestRequestV1 {
  bytes request_id = 1;
  ContractReferenceV1 contract = 2;
  bytes request_payload = 3;
  uint32 deadline_millis = 4;
  // Optional capability owned by the authenticated caller. Kernel verifies it
  // is a current granted Blob capability before adding a transport target to
  // the provider delivery. Caller owner/module coordinates are not accepted.
  string response_blob_capability_id = 5;
}
// Kernel-to-provider delivery after exact request-provider authorization.
message ManagedRuntimeModuleRequestDeliveryV1 {
  bytes request_id = 1;
  string logical_owner_id = 2;
  ContractReferenceV1 contract = 3;
  bytes request_payload = 4;
  // Empty together when no Blob result is expected. These fields are derived
  // only from the authenticated caller registration and its current grants.
  string response_blob_target_owner_id = 5;
  string response_blob_target_module_id = 6;
  string response_blob_target_capability_id = 7;
}
message ManagedRuntimeModuleRequestResponseV1 {
  bytes request_id = 1;
  bytes response_payload = 2;
  string error_code = 15;
}
// Client-safe owner event submitted by a current managed runtime. The Kernel
// authorizes the exact descriptor contract and maps these generic fields to
// the Gateway frame; it never decodes the owner payload.
message ManagedRuntimeClientRealtimePublishRequestV1 {
  ContractReferenceV1 contract = 1;
  string logical_owner_id = 2;
  bytes event_id = 3;
  string cursor = 4;
  string event_kind = 5;
  uint64 occurred_at_unix_millis = 6;
  string causation_id = 7;
  string correlation_id = 8;
  string trace_id = 9;
  bytes payload = 10;
}
message ManagedRuntimeClientRealtimePublishResponseV1 {
  string accepted_cursor = 1;
}
message ManagedRuntimeControlRequestV1 {
  oneof operation {
    DescribeManagedRuntimeRequestV1 describe = 1;
    ManagedRuntimeReadyRequestV1 ready = 2;
    ManagedRuntimeEventCredentialRequestV1 issue_event_credential = 3;
    ManagedRuntimeProviderCredentialRequestV1 issue_provider_credential = 4;
    ManagedRuntimeVaultRouteRequestV1 route_vault_ciphertext = 5;
    ManagedRuntimeBlobSessionRequestV1 issue_blob_session = 6;
    ManagedRuntimeOwnerDerivedKeyRequestV1 issue_owner_derived_key = 7;
    ManagedRuntimeClientDeliveryRequestV1 client_delivery = 8;
    ManagedRuntimeModuleQueryRequestV1 route_module_query = 9;
    ManagedRuntimeModuleQueryDeliveryV1 deliver_module_query = 10;
    ManagedRuntimeClientRealtimePublishRequestV1 publish_client_realtime = 11;
    ManagedRuntimeModuleRequestRequestV1 route_module_request = 12;
    ManagedRuntimeModuleRequestDeliveryV1 deliver_module_request = 13;
    ManagedRuntimeBlobCustodyReleaseRequestV1 release_blob_custody = 14;
    ManagedRuntimeBlobCustodyDelegationRequestV1 delegate_blob_custody = 15;
  }
}
message ManagedRuntimeControlAckV1 {}
message ManagedRuntimeControlResponseV1 {
  oneof result {
    DescribeManagedRuntimeResponseV1 describe = 1;
    ManagedRuntimeEventCredentialDeliveryV1 event_credential_delivery = 2;
    ManagedRuntimeProviderCredentialDeliveryV1 provider_credential_delivery = 3;
    ManagedRuntimeVaultRouteResponseV1 vault_route = 4;
    ManagedRuntimeBlobSessionDeliveryV1 blob_session_delivery = 5;
    ManagedRuntimeOwnerDerivedKeyDeliveryV1 owner_derived_key_delivery = 6;
    ManagedRuntimeControlAckV1 ack = 7;
    ManagedRuntimeClientDeliveryResponseV1 client_delivery = 8;
    ManagedRuntimeModuleQueryResponseV1 module_query_route = 9;
    ManagedRuntimeModuleQueryResponseV1 module_query_delivery = 10;
    ManagedRuntimeClientRealtimePublishResponseV1 client_realtime_publish = 11;
    ManagedRuntimeModuleRequestResponseV1 module_request_route = 12;
    ManagedRuntimeModuleRequestResponseV1 module_request_delivery = 13;
    ManagedRuntimeBlobCustodyReleaseDeliveryV1 blob_custody_release = 14;
    ManagedRuntimeBlobCustodyDelegationDeliveryV1 blob_custody_delegation = 16;
  }
  string error_code = 15;
}

// Versioned private transport envelope for a Kernel-managed runtime. The
// requester creates a fresh correlation ID; responses repeat it exactly. The
// nested V1 messages remain the exhaustive typed operation vocabulary, so this
// envelope does not create an untyped business-payload channel.
message ManagedRuntimeControlFrameV2 {
  uint32 transport_major = 1;
  bytes correlation_id = 2;
  oneof frame {
    ManagedRuntimeControlRequestV1 request = 3;
    ManagedRuntimeControlResponseV1 response = 4;
  }
}

// Kernel-to-managed-runtime capability delivery. This is carried only in the
// `client_delivery` control oneof; it never shares an untyped frame with
// runtime-initiated Vault, Event, or Blob operations.
message ManagedRuntimeClientDeliveryRequestV1 {
  ModuleClientRequestV1 request = 10;
}
message ManagedRuntimeClientDeliveryResponseV1 {
  ModuleClientResponseV1 response = 10;
}

// Request initiated by an already verified managed platform process over its
// inherited Kernel control FD. Only the Kernel may authorize and relay it.
message ManagedRuntimeVaultRouteRequestV1 {
  VaultCiphertextRouteV1 route = 1;
}
message ManagedRuntimeVaultRouteResponseV1 {
  VaultCiphertextResponseV1 response = 1;
  string error_code = 15;
}
