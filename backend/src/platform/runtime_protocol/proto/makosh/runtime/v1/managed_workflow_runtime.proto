syntax = "proto3";

package makosh.runtime.v1;

import "makosh/runtime/v1/managed_storage_runtime.proto";
import "makosh/runtime/v1/managed_runtime_artifact.proto";

message ManagedWorkflowConfigurationInstanceV1 {
  string configuration_instance_id = 1;
  bytes settings_snapshot_bytes = 2;
}

// Provider-neutral workflow runtime bootstrap. It intentionally has no
// integration configuration, host bridge, provider state or domain identity.
message ManagedWorkflowRuntimeConfigurationV1 {
  uint32 major = 1;
  // Logical human owner authenticated by Kernel owner control. This is the
  // workflow business/realtime scope, not the module registration or Storage
  // owner namespace.
  string logical_owner_id = 2;
  string registration_id = 3;
  string runtime_instance_id = 4;
  uint64 runtime_generation = 5;
  uint64 grant_epoch = 6;
  ManagedStorageRuntimeConfigurationV1 storage = 7;
  string event_hub_endpoint = 8;
  uint64 event_credential_revision = 9;
  repeated ManagedRuntimeArtifactBindingV1 runtime_artifacts = 10;
  string configuration_instance_id = 11;
  uint64 settings_revision = 12;
  repeated ManagedWorkflowConfigurationInstanceV1 configuration_instances = 13;
}
