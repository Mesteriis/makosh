syntax = "proto3";
package makosh.runtime.v1;

enum DistributionArtifactKindV1 {
  DISTRIBUTION_ARTIFACT_KIND_V1_UNSPECIFIED = 0;
  DISTRIBUTION_ARTIFACT_KIND_V1_MODULE_RUNTIME = 1;
  DISTRIBUTION_ARTIFACT_KIND_V1_INFRASTRUCTURE_EXECUTABLE = 2;
  DISTRIBUTION_ARTIFACT_KIND_V1_STORAGE_BUNDLE = 3;
  // One self-contained, static, same-origin browser bootstrap document. The
  // signed release manifest binds its exact bytes; it is not a remote plugin
  // or a generic filesystem tree served by Gateway.
  DISTRIBUTION_ARTIFACT_KIND_V1_BROWSER_BOOTSTRAP_BUNDLE = 4;
  // A compiled first-party browser asset. Its URL is derived only from the
  // signed release-relative `browser/assets/` path; Gateway never serves a
  // directory or accepts an arbitrary URL from the client.
  DISTRIBUTION_ARTIFACT_KIND_V1_BROWSER_CLIENT_ASSET = 5;
  // A native library required by one exact managed module. It is a separate
  // assembly artifact and never carries a descriptor or settings schema.
  DISTRIBUTION_ARTIFACT_KIND_V1_MODULE_RUNTIME_NATIVE_DEPENDENCY = 6;
  // A native executable required by one exact managed integration, workflow
  // or engine. It is staged privately and cannot be requested by a domain.
  DISTRIBUTION_ARTIFACT_KIND_V1_MODULE_RUNTIME_NATIVE_EXECUTABLE = 7;
  // Immutable non-code runtime data required by one exact managed integration,
  // workflow or engine, for example a pinned local parser model.
  DISTRIBUTION_ARTIFACT_KIND_V1_MODULE_RUNTIME_READ_ONLY_DATA = 8;
}
message DistributionManifestArtifactV1 {
  DistributionArtifactKindV1 artifact_kind = 1;
  string artifact_id = 2;
  string relative_path = 3;
  uint64 size_bytes = 4;
  bytes sha256 = 5;
  bytes descriptor_sha256 = 6;
  bytes settings_schema_sha256 = 7;
  bool required = 8;
  string descriptor_relative_path = 9;
  uint64 descriptor_size_bytes = 10;
  string settings_schema_relative_path = 11;
  uint64 settings_schema_size_bytes = 12;
  string bound_module_id = 13;
}
message DistributionManifestV1 {
  uint32 major = 1;
  uint32 revision = 2;
  string distribution_id = 3;
  string release_version = 4;
  string build_id = 5;
  string target_triple = 6;
  uint64 generation = 7;
  repeated DistributionManifestArtifactV1 artifacts = 8;
}
message SignedDistributionManifestV1 {
  string verification_key_id = 1;
  bytes raw_manifest_bytes = 2;
  bytes signature_raw = 3;
}
message ReleaseTrustRootKeyV1 {
  string key_id = 1;
  bytes public_key_sec1 = 2;
}
message ReleaseTrustRootV1 {
  uint32 major = 1;
  uint32 revision = 2;
  repeated ReleaseTrustRootKeyV1 verification_keys = 3;
}
