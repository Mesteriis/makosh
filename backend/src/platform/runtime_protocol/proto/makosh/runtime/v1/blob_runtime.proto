syntax = "proto3";

package makosh.runtime.v1;

// Short-lived private configuration staged only for a verified Blob child.
// It carries no content, Blob references, or key material.
message BlobRuntimeConfigurationV1 {
  string data_dir = 1;
  uint64 maximum_blob_bytes = 2;
  string vault_instance_id = 3;
  uint64 vault_runtime_generation = 4;
  bytes vault_hpke_public_key_x25519 = 5;
  // Private Unix socket owned by the verified Blob process. Content never
  // travels over the inherited Kernel control channel.
  string data_socket_path = 6;
  string kernel_instance_id = 7;
  bytes kernel_authorization_public_key_sec1 = 8;
  // Kernel-staged retention policy. It is not module-controlled settings.
  uint64 custody_release_grace_period_ms = 9;
}

// A short-lived, one-use authorization for exactly one Blob data operation.
// The signature covers the complete message with this field cleared.
message BlobDataSessionGrantV1 {
  uint32 major = 1;
  string kernel_instance_id = 2;
  bytes session_id = 3;
  bytes channel_binding_sha256 = 4;
  string owner_id = 5;
  string registration_id = 6;
  string capability_id = 7;
  string runtime_instance_id = 8;
  uint64 runtime_generation = 9;
  uint64 grant_epoch = 10;
  uint64 key_revision = 11;
  uint64 quota_max_bytes = 12;
  bytes reference_id = 13;
  uint64 declared_size = 14;
  uint64 reference_expires_at_unix_ms = 15;
  BlobBackupClassV1 backup_class = 16;
  BlobDataOperationV1 operation = 17;
  uint64 expires_at_unix_ms = 18;
  bytes kernel_authorization_signature_raw = 19;
  uint64 blob_runtime_generation = 20;
  // Optional exact plaintext binding. When present, full writes and reads are
  // rejected unless their plaintext SHA-256 matches these signed bytes.
  bytes expected_plaintext_sha256 = 21;
  // Stable at-rest custody selected from the exact descriptor request. It is
  // signed by Kernel and never accepted from the direct data request.
  string custody_scope_id = 22;
}

// Durable, non-readable proof that an exact producer-owned Blob reference was
// admitted for a typed evidence receipt. It is not a Blob data grant: only the
// custody-transfer platform operation may consume it.
enum BlobCustodySourceProofKindV1 {
  BLOB_CUSTODY_SOURCE_PROOF_KIND_UNSPECIFIED_V1 = 0;
  BLOB_CUSTODY_SOURCE_PROOF_KIND_ORIGINAL_WRITE_V1 = 1;
  BLOB_CUSTODY_SOURCE_PROOF_KIND_CURRENT_CUSTODIAN_REDELEGATION_V1 = 2;
}

message BlobCustodySourceProofV1 {
  uint32 major = 1;
  string kernel_instance_id = 2;
  string owner_id = 3;
  string registration_id = 4;
  string capability_id = 5;
  string runtime_instance_id = 6;
  uint64 runtime_generation = 7;
  uint64 grant_epoch = 8;
  uint64 key_revision = 9;
  bytes reference_id = 10;
  uint64 declared_size = 11;
  bytes receipt_sha256 = 12;
  uint64 issued_at_unix_ms = 13;
  uint64 expires_at_unix_ms = 14;
  bytes kernel_authorization_signature_raw = 15;
  BlobBackupClassV1 backup_class = 16;
  uint64 reference_expires_at_unix_ms = 17;
  // Empty together for the legacy same-owner fence, or exact together for
  // source-authorized cross-owner custody delegation.
  string target_owner_id = 18;
  string target_module_id = 19;
  string target_capability_id = 20;
  // Stable source at-rest custody. The target scope is resolved from the
  // current target descriptor rather than accepted from this source proof.
  string custody_scope_id = 21;
  // Missing on pre-ADR-0360 proofs and interpreted only as ORIGINAL_WRITE.
  BlobCustodySourceProofKindV1 proof_kind = 22;
  // Present only for CURRENT_CUSTODIAN_REDELEGATION. It keeps the next target
  // reference deterministic across safe issuance retries.
  bytes delegation_id = 23;
  // SHA-256 of the exact predecessor proof used to establish custody lineage.
  bytes predecessor_proof_sha256 = 24;
}

// One-use Kernel authorization for an internal Blob rewrap from the source
// proof fence to exactly one receiver-owned target fence. Neither runtime can
// use this grant to receive plaintext over its control channel.
message BlobCustodyTransferGrantV1 {
  uint32 major = 1;
  string kernel_instance_id = 2;
  bytes session_id = 3;
  bytes channel_binding_sha256 = 4;
  bytes evidence_id = 5;
  bytes evidence_envelope_sha256 = 6;
  BlobCustodySourceProofV1 source = 7;
  string target_owner_id = 8;
  string target_registration_id = 9;
  string target_capability_id = 10;
  string target_runtime_instance_id = 11;
  uint64 target_runtime_generation = 12;
  uint64 target_grant_epoch = 13;
  uint64 target_key_revision = 14;
  uint64 target_quota_max_bytes = 15;
  bytes target_reference_id = 16;
  uint64 expires_at_unix_ms = 17;
  uint64 blob_runtime_generation = 18;
  bytes kernel_authorization_signature_raw = 19;
  string target_custody_scope_id = 20;
}

// Kernel-signed authority for the current custody owner to request one
// idempotent grace-period release. It is a control-plane mutation grant and
// cannot authorize Blob plaintext access.
message BlobCustodyReleaseGrantV1 {
  uint32 major = 1;
  string kernel_instance_id = 2;
  bytes operation_id = 3;
  string owner_id = 4;
  string registration_id = 5;
  string capability_id = 6;
  string runtime_instance_id = 7;
  uint64 runtime_generation = 8;
  uint64 grant_epoch = 9;
  bytes reference_id = 10;
  uint64 declared_size = 11;
  bytes receipt_sha256 = 12;
  bytes custody_source_proof_sha256 = 13;
  string custody_scope_id = 14;
  BlobCustodyReleaseReasonV1 reason = 15;
  uint64 issued_at_unix_ms = 16;
  uint64 expires_at_unix_ms = 17;
  uint64 blob_runtime_generation = 18;
  bytes kernel_authorization_signature_raw = 19;
  BlobBackupClassV1 backup_class = 20;
  // Zero preserves an unbounded BlobRefV1; non-zero is the exact reference expiry.
  uint64 reference_expires_at_unix_ms = 21;
}

enum BlobCustodyReleaseReasonV1 {
  BLOB_CUSTODY_RELEASE_REASON_UNSPECIFIED_V1 = 0;
  BLOB_CUSTODY_RELEASE_REASON_TERMINAL_ACCEPTED_V1 = 1;
  BLOB_CUSTODY_RELEASE_REASON_TERMINAL_REJECTED_V1 = 2;
  BLOB_CUSTODY_RELEASE_REASON_TERMINAL_CANCELLED_V1 = 3;
}

enum BlobCustodyReleaseOutcomeV1 {
  BLOB_CUSTODY_RELEASE_OUTCOME_UNSPECIFIED_V1 = 0;
  BLOB_CUSTODY_RELEASE_OUTCOME_ACCEPTED_V1 = 1;
  BLOB_CUSTODY_RELEASE_OUTCOME_EXISTING_V1 = 2;
  BLOB_CUSTODY_RELEASE_OUTCOME_ALREADY_RELEASED_V1 = 3;
}

message BlobCustodyReleaseRequestV1 {
  BlobCustodyReleaseGrantV1 grant = 1;
}

message BlobCustodyReleaseResponseV1 {
  bytes operation_id = 1;
  BlobCustodyReleaseOutcomeV1 outcome = 2;
  uint64 delete_not_before_unix_ms = 3;
  string error_code = 15;
}

enum BlobBackupClassV1 {
  BLOB_BACKUP_CLASS_UNSPECIFIED_V1 = 0;
  BLOB_BACKUP_CLASS_REQUIRED_V1 = 1;
  BLOB_BACKUP_CLASS_REBUILDABLE_V1 = 2;
  BLOB_BACKUP_CLASS_EXCLUDED_V1 = 3;
}

enum BlobDataOperationV1 {
  BLOB_DATA_OPERATION_UNSPECIFIED_V1 = 0;
  BLOB_DATA_OPERATION_WRITE_V1 = 1;
  BLOB_DATA_OPERATION_READ_RANGE_V1 = 2;
  BLOB_DATA_OPERATION_CUSTODY_TRANSFER_V1 = 3;
}

message BlobDataRequestV1 {
  BlobDataSessionGrantV1 grant = 1;
  bytes channel_binding = 2;
  oneof operation {
    BlobDataWriteRequestV1 write = 3;
    BlobDataReadRangeRequestV1 read_range = 4;
    BlobDataCustodyTransferRequestV1 custody_transfer = 5;
    BlobDataWriteChunkRequestV1 write_chunk = 6;
  }
}

message BlobDataWriteRequestV1 { bytes plaintext = 1; }

// One bounded, sequential part of a receipt-bound Blob write. Each chunk uses
// a fresh one-use WRITE session grant; `complete` is valid only for the exact
// final chunk of the declared BlobRef size. `abort` is an idempotent cleanup
// request and therefore carries no offset, plaintext or completion flag.
message BlobDataWriteChunkRequestV1 {
  uint64 offset = 1;
  bytes plaintext = 2;
  bool complete = 3;
  bool abort = 4;
}

message BlobDataReadRangeRequestV1 {
  uint64 start = 1;
  uint64 end_exclusive = 2;
}

message BlobDataCustodyTransferRequestV1 {
  BlobCustodyTransferGrantV1 grant = 1;
  bytes channel_binding = 2;
}

message BlobDataResponseV1 {
  bytes plaintext = 1;
  // Distinguishes a successful empty write response from an invalid frame.
  bool accepted = 2;
  string error_code = 15;
}

enum BlobRuntimeStateV1 {
  BLOB_RUNTIME_STATE_V1_UNSPECIFIED = 0;
  BLOB_RUNTIME_STATE_V1_READY = 1;
  BLOB_RUNTIME_STATE_V1_BLOCKED = 2;
  BLOB_RUNTIME_STATE_V1_STOPPED = 3;
}

message GetBlobRuntimeStatusRequestV1 {}

// Sanitized process attestation; it never carries a Blob reference or content.
message BlobRuntimeStatusV1 {
  BlobRuntimeStateV1 state = 1;
  uint64 runtime_generation = 2;
  uint64 vault_runtime_generation = 3;
  uint64 maximum_blob_bytes = 4;
  string blocker_code = 5;
}

message BlobRuntimeControlRequestV1 {
  oneof operation {
    GetBlobRuntimeStatusRequestV1 get_status = 1;
    BlobCustodyReleaseRequestV1 release_custody = 2;
  }
}

message BlobRuntimeControlResponseV1 {
  oneof result {
    BlobRuntimeStatusV1 status = 1;
    BlobCustodyReleaseResponseV1 custody_release = 2;
  }
  string error_code = 15;
}
