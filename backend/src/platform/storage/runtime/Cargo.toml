[package]
name = "makosh-storage-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
[[bin]]
name = "makosh-storage-runtime"
path = "src/main.rs"
[package.metadata.makosh]
role = "platform"
owner = "storage"
surface = "runtime"
components = ["storage_control"]
[dependencies]
makosh-storage-protocol = { path = "../protocol" }
makosh-storage-control = { path = "../control" }
makosh-storage-postgres = { path = "../postgres" }
makosh-storage-pgbouncer = { path = "../pgbouncer" }
makosh-storage-migrations = { path = "../migrations" }
makosh-runtime-protocol = { path = "../../runtime_protocol" }
makosh-storage-vault = { path = "../vault" }
makosh-vault-protocol = { path = "../../vault/protocol" }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["net", "rt", "time"] }
zeroize = "=1.9.0"
