[package]
name = "makosh-mail-gmail"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
conformance-test-support = ["makosh-mail-api/conformance-test-support"]

[package.metadata.makosh]
role = "integration"
owner = "mail"
surface = "implementation"

[dependencies]
async-native-tls = "=0.6.0"
async-std = "=1.13.2"
base64 = "=0.22.1"
futures-util = "=0.3.32"
makosh-mail-api = { path = "../mail-api" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
zeroize = "=1.9.0"
