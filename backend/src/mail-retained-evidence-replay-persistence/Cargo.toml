[package]
name = "makosh-mail-retained-evidence-replay-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.makosh]
role = "integration"
owner = "mail"
surface = "persistence"

[dependencies]
makosh-attachment-security-contract = { path = "../attachment-security-contract" }
makosh-events-protocol = { path = "../platform/events" }
makosh-mail-retained-evidence-replay-contract = { path = "../mail-retained-evidence-replay-contract" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }

[dev-dependencies]
prost = "=0.14.4"
prost-types = "=0.14.4"
