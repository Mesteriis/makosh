[package]
name = "makosh-communication-cross-channel-forward-assembly"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-communication-cross-channel-forward-assembly"
path = "src/main.rs"

[package.metadata.makosh]
role = "workflow"
owner = "communication_cross_channel_forward"
surface = "assembly"

[dependencies]
makosh-communication-cross-channel-forward-persistence = { path = "../communication-cross-channel-forward-persistence" }
makosh-communication-cross-channel-forward-runtime = { path = "../communication-cross-channel-forward-runtime" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
prost = "=0.14.4"
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.150"
