[package]
name = "makosh-telegram-calls-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
conformance-test-support = []

[package.metadata.makosh]
role = "integration"
owner = "telegram"
surface = "persistence"

[dependencies]
makosh-communications-call-evidence-ingress = { path = "../communications-call-evidence-ingress" }
makosh-events-protocol = { path = "../platform/events" }
makosh-scheduler-protocol = { path = "../platform/scheduler/protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-telegram-calls-core = { path = "../telegram-calls-core" }
prost = "=0.14.4"
prost-types = "=0.14.4"
sha2 = { version = "=0.10.9", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
