syntax = "proto3";

package makosh.mail.address_book.v1;

import "google/protobuf/timestamp.proto";

// Mail-owned request for one bounded provider page. The continuation cursor is
// provider-opaque and cannot be interpreted by the workflow.
message FetchMailAddressBookPageCommandV1 {
  bytes command_id = 1;
  bytes run_id = 2;
  string logical_owner_id = 3;
  string account_id = 4;
  uint64 page_sequence = 5;
  optional bytes continuation_cursor = 6;
  uint32 page_size = 7;
}

message MailAddressBookEntryObservedV1 {
  bytes observation_id = 1;
  bytes run_id = 2;
  string logical_owner_id = 3;
  string account_id = 4;
  MailAddressBookProviderKindV1 provider_kind = 5;
  string provider_entry_id = 6;
  optional string provider_etag = 7;
  string display_name = 8;
  repeated string email_addresses = 9;
  repeated string phone_numbers = 10;
  google.protobuf.Timestamp observed_at = 11;
  uint64 source_revision = 12;
  bytes entry_digest = 13;
  uint64 page_sequence = 14;
}

message MailAddressBookPageCompletedV1 {
  bytes command_id = 1;
  bytes run_id = 2;
  uint64 page_sequence = 3;
  uint32 observed_entries = 4;
  optional bytes next_continuation_cursor = 5;
}

message MailAddressBookPageRejectedV1 {
  bytes command_id = 1;
  bytes run_id = 2;
  MailAddressBookRejectCodeV1 code = 3;
  bool retryable = 4;
}

message UpsertMailAddressBookEntryCommandV1 {
  bytes command_id = 1;
  bytes run_id = 2;
  string logical_owner_id = 3;
  string account_id = 4;
  reserved 5;
  bytes contact_snapshot_reference_id = 6;
  bytes contact_snapshot_sha256 = 7;
  uint64 expected_contact_revision = 8;
  reserved 9, 10;
  uint64 contact_snapshot_declared_bytes = 11;
  bytes contact_snapshot_custody_source_proof = 12;
}

message MailAddressBookEntryUpsertedV1 {
  bytes command_id = 1;
  bytes run_id = 2;
  string provider_entry_id = 3;
  string provider_etag = 4;
  uint64 applied_contact_revision = 5;
  MailAddressBookProviderKindV1 provider_kind = 6;
}

message MailAddressBookEntryUpsertRejectedV1 {
  bytes command_id = 1;
  bytes run_id = 2;
  MailAddressBookRejectCodeV1 code = 3;
  bool outcome_unknown = 4;
}

enum MailAddressBookProviderKindV1 {
  MAIL_ADDRESS_BOOK_PROVIDER_KIND_UNSPECIFIED = 0;
  MAIL_ADDRESS_BOOK_PROVIDER_KIND_GOOGLE_PEOPLE = 1;
  MAIL_ADDRESS_BOOK_PROVIDER_KIND_ICLOUD_CARDDAV = 2;
}

enum MailAddressBookRejectCodeV1 {
  MAIL_ADDRESS_BOOK_REJECT_CODE_UNSPECIFIED = 0;
  MAIL_ADDRESS_BOOK_REJECT_CODE_INVALID_REQUEST = 1;
  MAIL_ADDRESS_BOOK_REJECT_CODE_ACCOUNT_UNAVAILABLE = 2;
  MAIL_ADDRESS_BOOK_REJECT_CODE_CREDENTIAL_UNAVAILABLE = 3;
  MAIL_ADDRESS_BOOK_REJECT_CODE_WRITE_SCOPE_REQUIRED = 4;
  MAIL_ADDRESS_BOOK_REJECT_CODE_READ_ONLY_PROVIDER = 5;
  MAIL_ADDRESS_BOOK_REJECT_CODE_ETAG_CONFLICT = 6;
  MAIL_ADDRESS_BOOK_REJECT_CODE_PROVIDER_UNAVAILABLE = 7;
  MAIL_ADDRESS_BOOK_REJECT_CODE_OUTCOME_UNKNOWN = 8;
  MAIL_ADDRESS_BOOK_REJECT_CODE_POLICY = 9;
}
