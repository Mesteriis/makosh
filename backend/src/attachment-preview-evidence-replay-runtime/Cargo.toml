[package]
name = "makosh-attachment-preview-evidence-replay-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-attachment-preview-evidence-replay-runtime"
path = "src/main.rs"

[package.metadata.makosh]
role = "workflow"
owner = "attachment_preview_evidence_replay"
surface = "runtime"

[dependencies]
makosh-attachment-preview-evidence-replay-api = { path = "../attachment-preview-evidence-replay-api" }
makosh-attachment-preview-evidence-replay-core = { path = "../attachment-preview-evidence-replay-core" }
makosh-attachment-preview-evidence-replay-persistence = { path = "../attachment-preview-evidence-replay-persistence" }
makosh-communications-retained-evidence-replay-contract = { path = "../communications-retained-evidence-replay-contract" }
makosh-events-jetstream = { path = "../platform/events/jetstream" }
makosh-mail-retained-evidence-replay-contract = { path = "../mail-retained-evidence-replay-contract" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-storage-vault = { path = "../platform/storage/vault" }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
