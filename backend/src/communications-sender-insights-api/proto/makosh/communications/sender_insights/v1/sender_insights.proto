syntax = "proto3";

package makosh.communications.sender_insights.v1;

// Provider-neutral rebuildable Communications projection. Provider locators,
// message content and Review-owned importance are absent.
message ListSenderInsightsRequestV1 {
  uint32 protocol_major = 1;
  optional bytes account_id = 2;
  uint32 limit = 3;
  bytes cursor = 4;
}

message ListSenderInsightsResponseV1 {
  repeated SenderInsightV1 items = 1;
  bytes next_cursor = 2;
  SenderInsightsErrorCodeV1 error = 15;
}

service CommunicationsSenderInsightsService {
  rpc List(ListSenderInsightsRequestV1)
      returns (ListSenderInsightsResponseV1);
}

enum SenderInsightsErrorCodeV1 {
  SENDER_INSIGHTS_ERROR_CODE_UNSPECIFIED = 0;
  SENDER_INSIGHTS_ERROR_CODE_INVALID_REQUEST = 1;
  SENDER_INSIGHTS_ERROR_CODE_NOT_FOUND = 2;
  SENDER_INSIGHTS_ERROR_CODE_UNAVAILABLE = 3;
}

message SenderInsightV1 {
  bytes sender_id = 1;
  optional string display_label = 2;
  uint64 message_count = 3;
  uint64 conversation_count = 4;
  int64 first_observed_at_unix_seconds = 5;
  int64 last_observed_at_unix_seconds = 6;
}
