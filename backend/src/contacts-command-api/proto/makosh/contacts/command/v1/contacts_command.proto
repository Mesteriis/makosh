syntax = "proto3";

package makosh.contacts.command.v1;

import "google/protobuf/timestamp.proto";

// Exact Contacts-owned command produced by the mail_contacts_sync workflow.
// Provider authentication material, raw provider payloads and arbitrary metadata are
// deliberately absent.
message UpsertContactFromMailAddressBookEntryCommandV1 {
  bytes command_id = 1;
  string logical_owner_id = 2;
  string source_account_id = 3;
  MailAddressBookProviderKindV1 provider_kind = 4;
  string provider_entry_id = 5;
  optional string provider_etag = 6;
  string display_name = 7;
  repeated string email_addresses = 8;
  repeated string phone_numbers = 9;
  google.protobuf.Timestamp observed_at = 10;
  uint64 source_revision = 11;
  bytes entry_digest = 12;
}

message ContactUpsertedFromMailAddressBookEntryV1 {
  bytes command_id = 1;
  bytes contact_id = 2;
  uint64 contact_revision = 3;
  ContactUpsertOutcomeV1 outcome = 4;
  string logical_owner_id = 5;
}

message ContactUpsertFromMailAddressBookEntryRejectedV1 {
  bytes command_id = 1;
  ContactUpsertRejectCodeV1 code = 2;
  string logical_owner_id = 3;
}

// Exact Contacts-owned reconciliation after a successful Mail provider write.
// Presentation fields and provider authentication material are deliberately absent.
message BindMailAddressBookProviderLinkCommandV1 {
  bytes command_id = 1;
  string logical_owner_id = 2;
  bytes contact_id = 3;
  uint64 expected_contact_revision = 4;
  string source_account_id = 5;
  MailAddressBookProviderKindV1 provider_kind = 6;
  string provider_entry_id = 7;
  optional string provider_etag = 8;
}

message MailAddressBookProviderLinkBoundV1 {
  bytes command_id = 1;
  bytes contact_id = 2;
  uint64 contact_revision = 3;
  string logical_owner_id = 4;
}

message BindMailAddressBookProviderLinkRejectedV1 {
  bytes command_id = 1;
  BindProviderLinkRejectCodeV1 code = 2;
  string logical_owner_id = 3;
}

enum MailAddressBookProviderKindV1 {
  MAIL_ADDRESS_BOOK_PROVIDER_KIND_UNSPECIFIED = 0;
  MAIL_ADDRESS_BOOK_PROVIDER_KIND_GMAIL = 1;
  MAIL_ADDRESS_BOOK_PROVIDER_KIND_ICLOUD = 2;
}

enum ContactUpsertOutcomeV1 {
  CONTACT_UPSERT_OUTCOME_UNSPECIFIED = 0;
  CONTACT_UPSERT_OUTCOME_CREATED = 1;
  CONTACT_UPSERT_OUTCOME_UPDATED = 2;
  CONTACT_UPSERT_OUTCOME_UNCHANGED = 3;
}

enum ContactUpsertRejectCodeV1 {
  CONTACT_UPSERT_REJECT_CODE_UNSPECIFIED = 0;
  CONTACT_UPSERT_REJECT_CODE_INVALID_REQUEST = 1;
  CONTACT_UPSERT_REJECT_CODE_IDENTITY_AMBIGUOUS = 2;
  CONTACT_UPSERT_REJECT_CODE_PROVIDER_LINK_CONFLICT = 3;
  CONTACT_UPSERT_REJECT_CODE_STALE_SOURCE = 4;
  CONTACT_UPSERT_REJECT_CODE_POLICY = 5;
}

enum BindProviderLinkRejectCodeV1 {
  BIND_PROVIDER_LINK_REJECT_CODE_UNSPECIFIED = 0;
  BIND_PROVIDER_LINK_REJECT_CODE_INVALID_REQUEST = 1;
  BIND_PROVIDER_LINK_REJECT_CODE_CONTACT_MISSING = 2;
  BIND_PROVIDER_LINK_REJECT_CODE_STALE_CONTACT_REVISION = 3;
  BIND_PROVIDER_LINK_REJECT_CODE_PROVIDER_LINK_CONFLICT = 4;
  BIND_PROVIDER_LINK_REJECT_CODE_POLICY = 5;
}
