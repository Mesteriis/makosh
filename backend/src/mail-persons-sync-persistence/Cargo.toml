[package]
name = "makosh-mail-persons-sync-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.makosh]
role = "workflow"
owner = "mail_persons_sync"
surface = "persistence"

[features]
default = []
conformance-test-support = []

[dependencies]
makosh-events-protocol = { path = "../platform/events" }
makosh-mail-persons-sync-api = { path = "../mail-persons-sync-api" }
makosh-mail-persons-sync-core = { path = "../mail-persons-sync-core" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
