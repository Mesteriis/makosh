syntax = "proto3";

package makosh.communication_task_candidate.v1;

message StartCommunicationTaskCandidateRequestV1 {
  uint32 protocol_major = 1;
  bytes operation_id = 2;
  bytes source_message_id = 3;
  uint64 expected_source_revision = 4;
}

message StartCommunicationTaskCandidateResponseV1 {
  bytes run_id = 1;
  CommunicationTaskCandidateStateV1 state = 2;
  CommunicationTaskCandidateErrorCodeV1 error = 15;
}

message GetCommunicationTaskCandidateRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message GetCommunicationTaskCandidateResponseV1 {
  bytes run_id = 1;
  bytes source_message_id = 2;
  uint64 expected_source_revision = 3;
  CommunicationTaskCandidateStateV1 state = 4;
  uint64 state_revision = 5;
  repeated CommunicationTaskCandidateV1 candidates = 6;
  CommunicationTaskCandidateCompletenessV1 completeness = 7;
  CommunicationTaskCandidateErrorCodeV1 error = 15;
}

message CommunicationTaskCandidateV1 {
  bytes candidate_id = 1;
  bytes candidate_digest = 2;
  string title = 3;
  optional string due_text_hint = 4;
  optional string assignee_label_hint = 5;
  CommunicationTaskSourceBasisV1 source_basis = 6;
  CommunicationTaskSignalKindV1 signal_kind = 7;
  uint32 confidence_basis_points = 8;
  bytes source_evidence_id = 9;
  uint64 source_evidence_revision = 10;
}

message CommunicationTaskCandidateStatusChangedV1 {
  bytes run_id = 1;
  CommunicationTaskCandidateStateV1 state = 2;
  uint64 state_revision = 3;
  uint64 occurred_at_unix_millis = 4;
  CommunicationTaskCandidateErrorCodeV1 error = 15;
}

service CommunicationTaskCandidateCommandService {
  rpc Start(StartCommunicationTaskCandidateRequestV1)
      returns (StartCommunicationTaskCandidateResponseV1);
}

service CommunicationTaskCandidateQueryService {
  rpc Get(GetCommunicationTaskCandidateRequestV1)
      returns (GetCommunicationTaskCandidateResponseV1);
}

enum CommunicationTaskSourceBasisV1 {
  COMMUNICATION_TASK_SOURCE_BASIS_UNSPECIFIED = 0;
  COMMUNICATION_TASK_SOURCE_BASIS_SUBJECT = 1;
  COMMUNICATION_TASK_SOURCE_BASIS_BODY = 2;
  COMMUNICATION_TASK_SOURCE_BASIS_COMBINED = 3;
}

enum CommunicationTaskSignalKindV1 {
  COMMUNICATION_TASK_SIGNAL_KIND_UNSPECIFIED = 0;
  COMMUNICATION_TASK_SIGNAL_KIND_EXPLICIT_ACTION = 1;
  COMMUNICATION_TASK_SIGNAL_KIND_DIRECT_REQUEST = 2;
  COMMUNICATION_TASK_SIGNAL_KIND_FOLLOW_UP = 3;
}

enum CommunicationTaskCandidateCompletenessV1 {
  COMMUNICATION_TASK_CANDIDATE_COMPLETENESS_UNSPECIFIED = 0;
  COMMUNICATION_TASK_CANDIDATE_COMPLETENESS_COMPLETE = 1;
}

enum CommunicationTaskCandidateStateV1 {
  COMMUNICATION_TASK_CANDIDATE_STATE_UNSPECIFIED = 0;
  COMMUNICATION_TASK_CANDIDATE_STATE_ACCEPTED = 1;
  COMMUNICATION_TASK_CANDIDATE_STATE_PREPARING_SOURCE = 2;
  COMMUNICATION_TASK_CANDIDATE_STATE_EXTRACTING = 3;
  COMMUNICATION_TASK_CANDIDATE_STATE_READY = 4;
  COMMUNICATION_TASK_CANDIDATE_STATE_REJECTED = 5;
}

enum CommunicationTaskCandidateErrorCodeV1 {
  COMMUNICATION_TASK_CANDIDATE_ERROR_CODE_UNSPECIFIED = 0;
  COMMUNICATION_TASK_CANDIDATE_ERROR_CODE_INVALID_REQUEST = 1;
  COMMUNICATION_TASK_CANDIDATE_ERROR_CODE_NOT_FOUND = 2;
  COMMUNICATION_TASK_CANDIDATE_ERROR_CODE_SOURCE_REJECTED = 3;
  COMMUNICATION_TASK_CANDIDATE_ERROR_CODE_EXTRACTION_REJECTED = 4;
  COMMUNICATION_TASK_CANDIDATE_ERROR_CODE_POLICY = 5;
  COMMUNICATION_TASK_CANDIDATE_ERROR_CODE_UNAVAILABLE = 6;
}
