syntax = "proto3";

package makosh.attachment_preview.v1;

message StartAttachmentPreviewRequestV1 {
  uint32 protocol_major = 1;
  bytes operation_id = 2;
  bytes attachment_anchor_id = 3;
}

message StartAttachmentPreviewResponseV1 {
  bytes run_id = 1;
  AttachmentPreviewStateV1 state = 2;
  AttachmentPreviewErrorCodeV1 error = 15;
}

message GetAttachmentPreviewRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message GetAttachmentPreviewResponseV1 {
  bytes run_id = 1;
  bytes attachment_anchor_id = 2;
  AttachmentPreviewStateV1 state = 3;
  uint64 state_revision = 4;
  AttachmentPreviewKindV1 preview_kind = 5;
  AttachmentPreviewContentTypeV1 content_type = 6;
  uint64 preview_size_bytes = 7;
  bool truncated = 8;
  AttachmentPreviewErrorCodeV1 error = 15;
}

message IssueAttachmentPreviewReadRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message IssueAttachmentPreviewReadResponseV1 {
  bytes run_id = 1;
  bytes opaque_read_ticket = 2;
  uint64 expires_at_unix_seconds = 3;
  AttachmentPreviewContentTypeV1 content_type = 4;
  uint64 preview_size_bytes = 5;
  AttachmentPreviewErrorCodeV1 error = 15;
}

message AttachmentPreviewStatusChangedV1 {
  bytes run_id = 1;
  AttachmentPreviewStateV1 state = 2;
  uint64 state_revision = 3;
  AttachmentPreviewKindV1 preview_kind = 4;
  AttachmentPreviewContentTypeV1 content_type = 5;
  uint64 preview_size_bytes = 6;
  bool truncated = 7;
  uint64 occurred_at_unix_millis = 8;
  AttachmentPreviewErrorCodeV1 error = 15;
}

service AttachmentPreviewCommandService {
  rpc Start(StartAttachmentPreviewRequestV1)
      returns (StartAttachmentPreviewResponseV1);
}

service AttachmentPreviewQueryService {
  rpc Get(GetAttachmentPreviewRequestV1)
      returns (GetAttachmentPreviewResponseV1);
}

service AttachmentPreviewTicketService {
  rpc IssueRead(IssueAttachmentPreviewReadRequestV1)
      returns (IssueAttachmentPreviewReadResponseV1);
}

enum AttachmentPreviewStateV1 {
  ATTACHMENT_PREVIEW_STATE_V1_UNSPECIFIED = 0;
  ATTACHMENT_PREVIEW_STATE_V1_ACCEPTED = 1;
  ATTACHMENT_PREVIEW_STATE_V1_AWAITING_EVIDENCE = 2;
  ATTACHMENT_PREVIEW_STATE_V1_RENDERING = 3;
  ATTACHMENT_PREVIEW_STATE_V1_READY = 4;
  ATTACHMENT_PREVIEW_STATE_V1_UNSUPPORTED = 5;
  ATTACHMENT_PREVIEW_STATE_V1_REJECTED = 6;
}

enum AttachmentPreviewKindV1 {
  ATTACHMENT_PREVIEW_KIND_V1_UNSPECIFIED = 0;
  ATTACHMENT_PREVIEW_KIND_V1_TEXT = 1;
  ATTACHMENT_PREVIEW_KIND_V1_IMAGE = 2;
  ATTACHMENT_PREVIEW_KIND_V1_DOCUMENT = 3;
  ATTACHMENT_PREVIEW_KIND_V1_AUDIO = 4;
  ATTACHMENT_PREVIEW_KIND_V1_VIDEO = 5;
}

enum AttachmentPreviewContentTypeV1 {
  ATTACHMENT_PREVIEW_CONTENT_TYPE_V1_UNSPECIFIED = 0;
  ATTACHMENT_PREVIEW_CONTENT_TYPE_V1_TEXT_UTF8 = 1;
  ATTACHMENT_PREVIEW_CONTENT_TYPE_V1_PNG = 2;
  ATTACHMENT_PREVIEW_CONTENT_TYPE_V1_MPEG_AUDIO = 3;
  ATTACHMENT_PREVIEW_CONTENT_TYPE_V1_MP4_VIDEO = 4;
}

enum AttachmentPreviewErrorCodeV1 {
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_UNSPECIFIED = 0;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_INVALID_REQUEST = 1;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_NOT_FOUND = 2;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_NOT_SAFE = 3;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_UNSUPPORTED = 4;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_SOURCE_TOO_LARGE = 5;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_INVALID_CONTENT = 6;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_RENDERER_UNAVAILABLE = 7;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_RENDERER_FAILED = 8;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_CUSTODY_REJECTED = 9;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_TICKET_EXPIRED = 10;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_TICKET_USED = 11;
  ATTACHMENT_PREVIEW_ERROR_CODE_V1_UNAVAILABLE = 12;
}
