syntax = "proto3";

package makosh.review.note_candidate.v1;

message DecideReviewNoteCandidateRequestV1 {
  uint32 protocol_major = 1;
  bytes operation_id = 2;
  bytes review_id = 3;
  uint64 expected_review_revision = 4;
  ReviewNoteCandidateDecisionV1 decision = 5;
}

message DecideReviewNoteCandidateResponseV1 {
  ReviewNoteCandidateSummaryV1 review = 1;
  bool replayed = 2;
  ReviewNoteCandidateErrorCodeV1 error = 15;
}

message GetReviewNoteCandidateRequestV1 {
  uint32 protocol_major = 1;
  bytes review_id = 2;
}

message GetReviewNoteCandidateResponseV1 {
  ReviewNoteCandidateSummaryV1 review = 1;
  ReviewNoteCandidateErrorCodeV1 error = 15;
}

message ReviewNoteCandidateSummaryV1 {
  bytes review_id = 1;
  bytes candidate_id = 2;
  bytes candidate_digest = 3;
  bytes source_evidence_id = 4;
  uint64 source_evidence_revision = 5;
  string title = 6;
  string excerpt = 7;
  repeated ReviewNoteTopicHintV1 topic_hints = 8;
  ReviewNoteSourceBasisV1 source_basis = 9;
  uint32 confidence_basis_points = 10;
  ReviewNoteCandidateStateV1 state = 11;
  ReviewNoteCandidatePromotionStatusV1 promotion_status = 12;
  uint64 review_revision = 13;
  optional bytes decided_by_owner_device_id = 14;
  optional uint64 decided_at_unix_millis = 15;
}

message ReviewNoteCandidateStatusChangedV1 {
  bytes review_id = 1;
  bytes candidate_id = 2;
  ReviewNoteCandidateStateV1 state = 3;
  ReviewNoteCandidatePromotionStatusV1 promotion_status = 4;
  uint64 review_revision = 5;
  uint64 occurred_at_unix_millis = 6;
  ReviewNoteCandidateErrorCodeV1 error = 15;
}

service ReviewNoteCandidateCommandService {
  rpc Decide(DecideReviewNoteCandidateRequestV1)
      returns (DecideReviewNoteCandidateResponseV1);
}

service ReviewNoteCandidateQueryService {
  rpc Get(GetReviewNoteCandidateRequestV1)
      returns (GetReviewNoteCandidateResponseV1);
}

// Exact workflow-to-Review durable command. Candidate presentation bytes are
// held only by the Review-target-bound Blob referenced here.
message SubmitNoteCandidateForReviewCommandV1 {
  bytes submission_id = 1;
  bytes candidate_id = 2;
  bytes candidate_digest = 3;
  bytes source_evidence_id = 4;
  uint64 source_evidence_revision = 5;
  ReviewTargetBoundCandidateReceiptV1 candidate_content = 6;
  string logical_owner_id = 7;
}

message NoteCandidateReviewSubmittedV1 {
  bytes submission_id = 1;
  bytes review_id = 2;
  bytes candidate_id = 3;
  bytes candidate_digest = 4;
  uint64 review_revision = 5;
  string logical_owner_id = 6;
}

message NoteCandidateReviewSubmissionRejectedV1 {
  bytes submission_id = 1;
  bytes candidate_id = 2;
  ReviewNoteCandidateSubmissionRejectCodeV1 code = 3;
  string logical_owner_id = 4;
}

// Exact Review-to-promotion-workflow durable event. Presentation bytes are
// transferred to a new workflow-target-bound Blob before this event is persisted.
message NoteCandidateApprovedForPromotionV1 {
  bytes review_id = 1;
  bytes candidate_id = 2;
  bytes candidate_digest = 3;
  bytes source_evidence_id = 4;
  uint64 source_evidence_revision = 5;
  uint64 decision_revision = 6;
  bytes decided_by_owner_device_id = 7;
  ReviewTargetBoundCandidateReceiptV1 candidate_content = 8;
  string logical_owner_id = 9;
}

message ReviewTargetBoundCandidateReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

// Plaintext schema inside a target-bound Blob. It is never embedded in a
// durable command, result, event or realtime frame.
message ReviewNoteCandidateContentV1 {
  string title = 1;
  string excerpt = 2;
  repeated ReviewNoteTopicHintV1 topic_hints = 3;
  ReviewNoteSourceBasisV1 source_basis = 4;
  uint32 confidence_basis_points = 5;
}

enum ReviewNoteSourceBasisV1 {
  REVIEW_NOTE_SOURCE_BASIS_UNSPECIFIED = 0;
  REVIEW_NOTE_SOURCE_BASIS_SUBJECT = 1;
  REVIEW_NOTE_SOURCE_BASIS_BODY = 2;
  REVIEW_NOTE_SOURCE_BASIS_COMBINED = 3;
}

enum ReviewNoteTopicHintV1 {
  REVIEW_NOTE_TOPIC_HINT_UNSPECIFIED = 0;
  REVIEW_NOTE_TOPIC_HINT_FINANCIAL = 1;
  REVIEW_NOTE_TOPIC_HINT_LEGAL = 2;
  REVIEW_NOTE_TOPIC_HINT_DECISION_STATEMENT = 3;
  REVIEW_NOTE_TOPIC_HINT_DEADLINE_STATEMENT = 4;
}

enum ReviewNoteCandidateDecisionV1 {
  REVIEW_NOTE_CANDIDATE_DECISION_UNSPECIFIED = 0;
  REVIEW_NOTE_CANDIDATE_DECISION_APPROVE = 1;
  REVIEW_NOTE_CANDIDATE_DECISION_REJECT = 2;
}

enum ReviewNoteCandidateStateV1 {
  REVIEW_NOTE_CANDIDATE_STATE_UNSPECIFIED = 0;
  REVIEW_NOTE_CANDIDATE_STATE_PENDING = 1;
  REVIEW_NOTE_CANDIDATE_STATE_APPROVED = 2;
  REVIEW_NOTE_CANDIDATE_STATE_REJECTED = 3;
}

enum ReviewNoteCandidatePromotionStatusV1 {
  REVIEW_NOTE_CANDIDATE_PROMOTION_STATUS_UNSPECIFIED = 0;
  REVIEW_NOTE_CANDIDATE_PROMOTION_STATUS_NOT_REQUESTED = 1;
  REVIEW_NOTE_CANDIDATE_PROMOTION_STATUS_PENDING = 2;
  REVIEW_NOTE_CANDIDATE_PROMOTION_STATUS_SUCCEEDED = 3;
  REVIEW_NOTE_CANDIDATE_PROMOTION_STATUS_FAILED = 4;
}

enum ReviewNoteCandidateSubmissionRejectCodeV1 {
  REVIEW_NOTE_CANDIDATE_SUBMISSION_REJECT_CODE_UNSPECIFIED = 0;
  REVIEW_NOTE_CANDIDATE_SUBMISSION_REJECT_CODE_INVALID_REQUEST = 1;
  REVIEW_NOTE_CANDIDATE_SUBMISSION_REJECT_CODE_BLOB_UNAVAILABLE = 2;
  REVIEW_NOTE_CANDIDATE_SUBMISSION_REJECT_CODE_BLOB_MISMATCH = 3;
  REVIEW_NOTE_CANDIDATE_SUBMISSION_REJECT_CODE_CONFLICT = 4;
  REVIEW_NOTE_CANDIDATE_SUBMISSION_REJECT_CODE_POLICY = 5;
}

enum ReviewNoteCandidateErrorCodeV1 {
  REVIEW_NOTE_CANDIDATE_ERROR_CODE_UNSPECIFIED = 0;
  REVIEW_NOTE_CANDIDATE_ERROR_CODE_INVALID_REQUEST = 1;
  REVIEW_NOTE_CANDIDATE_ERROR_CODE_NOT_FOUND = 2;
  REVIEW_NOTE_CANDIDATE_ERROR_CODE_REVISION_CONFLICT = 3;
  REVIEW_NOTE_CANDIDATE_ERROR_CODE_TERMINAL_DECISION = 4;
  REVIEW_NOTE_CANDIDATE_ERROR_CODE_OPERATION_CONFLICT = 5;
  REVIEW_NOTE_CANDIDATE_ERROR_CODE_POLICY = 6;
  REVIEW_NOTE_CANDIDATE_ERROR_CODE_UNAVAILABLE = 7;
}
