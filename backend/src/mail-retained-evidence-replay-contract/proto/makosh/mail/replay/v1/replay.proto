syntax = "proto3";

package makosh.mail.replay.v1;

message ReplayMailEvidenceCommandV1 {
  bytes operation_id = 1;
  string logical_owner_id = 2;
  bytes owner_device_actor_sha256 = 3;
  reserved 4 to 7;
  bytes attachment_anchor_id = 8;
}

message ReplayMailEvidenceResultV1 {
  bytes operation_id = 1;
  ReplayMailEvidenceOutcomeV1 outcome = 2;
  repeated bytes original_message_ids = 3;
  ReplayMailEvidenceFailureV1 failure = 4;
}

enum ReplayMailEvidenceOutcomeV1 {
  REPLAY_MAIL_EVIDENCE_OUTCOME_V1_UNSPECIFIED = 0;
  REPLAY_MAIL_EVIDENCE_OUTCOME_V1_PUBLISHED = 1;
  REPLAY_MAIL_EVIDENCE_OUTCOME_V1_ALREADY_PUBLISHED = 2;
  REPLAY_MAIL_EVIDENCE_OUTCOME_V1_REJECTED = 3;
  REPLAY_MAIL_EVIDENCE_OUTCOME_V1_UNAVAILABLE = 4;
}

enum ReplayMailEvidenceFailureV1 {
  REPLAY_MAIL_EVIDENCE_FAILURE_V1_UNSPECIFIED = 0;
  REPLAY_MAIL_EVIDENCE_FAILURE_V1_NOT_FOUND = 1;
  REPLAY_MAIL_EVIDENCE_FAILURE_V1_HASH_MISMATCH = 2;
  REPLAY_MAIL_EVIDENCE_FAILURE_V1_WRONG_CONTRACT = 3;
  REPLAY_MAIL_EVIDENCE_FAILURE_V1_STALE_RUNTIME_FENCE = 4;
  REPLAY_MAIL_EVIDENCE_FAILURE_V1_STALE_GRANT_FENCE = 5;
  REPLAY_MAIL_EVIDENCE_FAILURE_V1_OWNER_MISMATCH = 6;
  REPLAY_MAIL_EVIDENCE_FAILURE_V1_PUBLISH_UNAVAILABLE = 7;
}
