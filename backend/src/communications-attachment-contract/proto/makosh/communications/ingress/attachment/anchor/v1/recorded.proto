syntax = "proto3";

package makosh.communications.ingress.attachment.anchor.v1;

// Public Communications handoff to the integration that emitted the source
// observation. It has no provider locator, attachment bytes, or descriptor.
message AttachmentAnchorRecordedV1 {
  bytes attachment_anchor_id = 1;
  bytes source_observation_id = 2;
  bytes media_cursor_sha256 = 3;
  AttachmentAnchorInitialStateV1 initial_state = 4;
  int64 observed_at_unix_seconds = 5;
}

enum AttachmentAnchorInitialStateV1 {
  ATTACHMENT_ANCHOR_INITIAL_STATE_V1_UNSPECIFIED = 0;
  ATTACHMENT_ANCHOR_INITIAL_STATE_V1_DESCRIPTOR_ONLY = 1;
}
