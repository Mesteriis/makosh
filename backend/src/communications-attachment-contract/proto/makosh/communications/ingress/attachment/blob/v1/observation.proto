syntax = "proto3";

package makosh.communications.ingress.attachment.blob.v1;

// External Blob-admission fact. It contains no Blob bytes, provider locator,
// provider session, or Blob platform command.
message AttachmentBlobAdmissionObservationV1 {
  bytes attachment_anchor_id = 1;
  AttachmentBlobExpectedStateV1 expected_state = 2;
  AttachmentBlobAdmissionTransitionV1 transition = 3;
  bytes evidence_id = 4;
  int64 observed_at_unix_seconds = 5;
  // Present only for BLOB_ADMITTED; opaque integrity binding, never a Blob URL.
  bytes blob_reference_binding_sha256 = 6;
}

enum AttachmentBlobExpectedStateV1 {
  ATTACHMENT_BLOB_EXPECTED_STATE_V1_UNSPECIFIED = 0;
  ATTACHMENT_BLOB_EXPECTED_STATE_V1_DESCRIPTOR_ONLY = 1;
  ATTACHMENT_BLOB_EXPECTED_STATE_V1_BLOB_PENDING = 2;
  ATTACHMENT_BLOB_EXPECTED_STATE_V1_BLOB_ADMITTED = 3;
}

enum AttachmentBlobAdmissionTransitionV1 {
  ATTACHMENT_BLOB_ADMISSION_TRANSITION_V1_UNSPECIFIED = 0;
  ATTACHMENT_BLOB_ADMISSION_TRANSITION_V1_REQUESTED = 1;
  ATTACHMENT_BLOB_ADMISSION_TRANSITION_V1_ADMITTED = 2;
  ATTACHMENT_BLOB_ADMISSION_TRANSITION_V1_REJECTED = 3;
}
