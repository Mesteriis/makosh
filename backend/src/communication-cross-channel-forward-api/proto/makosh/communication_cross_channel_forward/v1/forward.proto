syntax = "proto3";

package makosh.communication_cross_channel_forward.v1;

message StartCrossChannelForwardRequestV1 {
  uint32 protocol_major = 1;
  bytes forward_operation_id = 2;
  bytes source_message_id = 3;
  bytes target_conversation_id = 4;
  optional bytes target_reply_to_message_id = 5;
}

message StartCrossChannelForwardResponseV1 {
  bytes forward_id = 1;
  CrossChannelForwardStateV1 state = 2;
  CrossChannelForwardErrorCodeV1 error = 15;
}

message GetCrossChannelForwardStatusRequestV1 {
  uint32 protocol_major = 1;
  bytes forward_id = 2;
}

message GetCrossChannelForwardStatusResponseV1 {
  bytes forward_id = 1;
  bytes source_message_id = 2;
  bytes target_conversation_id = 3;
  optional bytes target_reply_to_message_id = 4;
  CrossChannelForwardStateV1 state = 5;
  uint64 state_revision = 6;
  optional bytes delivery_intent_id = 7;
  CrossChannelForwardErrorCodeV1 error = 15;
}

message CrossChannelForwardStatusChangedV1 {
  bytes forward_id = 1;
  CrossChannelForwardStateV1 state = 2;
  uint64 state_revision = 3;
  uint64 occurred_at_unix_millis = 4;
  CrossChannelForwardErrorCodeV1 error = 15;
}

service CommunicationCrossChannelForwardCommandService {
  rpc Start(StartCrossChannelForwardRequestV1)
      returns (StartCrossChannelForwardResponseV1);
}

service CommunicationCrossChannelForwardQueryService {
  rpc GetStatus(GetCrossChannelForwardStatusRequestV1)
      returns (GetCrossChannelForwardStatusResponseV1);
}

enum CrossChannelForwardStateV1 {
  CROSS_CHANNEL_FORWARD_STATE_UNSPECIFIED = 0;
  CROSS_CHANNEL_FORWARD_STATE_ACCEPTED = 1;
  CROSS_CHANNEL_FORWARD_STATE_PREPARING_SOURCE = 2;
  CROSS_CHANNEL_FORWARD_STATE_DISPATCHING = 3;
  CROSS_CHANNEL_FORWARD_STATE_DELIVERY_ACCEPTED = 4;
  CROSS_CHANNEL_FORWARD_STATE_REJECTED = 5;
}

enum CrossChannelForwardErrorCodeV1 {
  CROSS_CHANNEL_FORWARD_ERROR_CODE_UNSPECIFIED = 0;
  CROSS_CHANNEL_FORWARD_ERROR_CODE_INVALID_REQUEST = 1;
  CROSS_CHANNEL_FORWARD_ERROR_CODE_NOT_FOUND = 2;
  CROSS_CHANNEL_FORWARD_ERROR_CODE_SOURCE_INACTIVE = 3;
  CROSS_CHANNEL_FORWARD_ERROR_CODE_SAME_CHANNEL_TARGET = 4;
  CROSS_CHANNEL_FORWARD_ERROR_CODE_SOURCE_CONTENT_UNAVAILABLE = 5;
  CROSS_CHANNEL_FORWARD_ERROR_CODE_DELIVERY_REJECTED = 6;
  CROSS_CHANNEL_FORWARD_ERROR_CODE_UNAVAILABLE = 7;
}
