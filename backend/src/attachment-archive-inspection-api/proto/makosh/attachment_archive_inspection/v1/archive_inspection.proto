syntax = "proto3";

package makosh.attachment_archive_inspection.v1;

message StartArchiveInspectionRequestV1 {
  uint32 protocol_major = 1;
  bytes operation_id = 2;
  bytes attachment_anchor_id = 3;
}

message StartArchiveInspectionResponseV1 {
  bytes run_id = 1;
  ArchiveInspectionStateV1 state = 2;
  ArchiveInspectionErrorCodeV1 error = 15;
}

message GetArchiveInspectionRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message GetArchiveInspectionResponseV1 {
  bytes run_id = 1;
  bytes attachment_anchor_id = 2;
  ArchiveInspectionStateV1 state = 3;
  uint64 state_revision = 4;
  optional ArchiveInspectionReportV1 report = 5;
  ArchiveInspectionErrorCodeV1 error = 15;
}

message ArchiveInspectionReportV1 {
  ArchiveKindV1 archive_kind = 1;
  uint32 entry_count = 2;
  uint64 total_uncompressed_bytes = 3;
  repeated ArchiveEntryV1 entries = 4;
}

message ArchiveEntryV1 {
  bytes normalized_path_utf8 = 1;
  uint64 compressed_size = 2;
  uint64 uncompressed_size = 3;
  ArchiveEntryKindV1 entry_kind = 4;
}

message ArchiveInspectionStatusChangedV1 {
  bytes run_id = 1;
  ArchiveInspectionStateV1 state = 2;
  uint64 state_revision = 3;
  uint64 occurred_at_unix_millis = 4;
  ArchiveInspectionErrorCodeV1 error = 15;
}

service AttachmentArchiveInspectionCommandService {
  rpc Start(StartArchiveInspectionRequestV1)
      returns (StartArchiveInspectionResponseV1);
}

service AttachmentArchiveInspectionQueryService {
  rpc Get(GetArchiveInspectionRequestV1)
      returns (GetArchiveInspectionResponseV1);
}

enum ArchiveInspectionStateV1 {
  ARCHIVE_INSPECTION_STATE_V1_UNSPECIFIED = 0;
  ARCHIVE_INSPECTION_STATE_V1_ACCEPTED = 1;
  ARCHIVE_INSPECTION_STATE_V1_AWAITING_EVIDENCE = 2;
  ARCHIVE_INSPECTION_STATE_V1_INSPECTING = 3;
  ARCHIVE_INSPECTION_STATE_V1_READY = 4;
  ARCHIVE_INSPECTION_STATE_V1_REJECTED = 5;
}

enum ArchiveInspectionErrorCodeV1 {
  ARCHIVE_INSPECTION_ERROR_CODE_V1_UNSPECIFIED = 0;
  ARCHIVE_INSPECTION_ERROR_CODE_V1_INVALID_REQUEST = 1;
  ARCHIVE_INSPECTION_ERROR_CODE_V1_NOT_FOUND = 2;
  ARCHIVE_INSPECTION_ERROR_CODE_V1_NOT_SAFE = 3;
  ARCHIVE_INSPECTION_ERROR_CODE_V1_NOT_ZIP = 4;
  ARCHIVE_INSPECTION_ERROR_CODE_V1_POLICY_REJECTED = 5;
  ARCHIVE_INSPECTION_ERROR_CODE_V1_CORRUPT_ARCHIVE = 6;
  ARCHIVE_INSPECTION_ERROR_CODE_V1_UNAVAILABLE = 7;
}

enum ArchiveKindV1 {
  ARCHIVE_KIND_V1_UNSPECIFIED = 0;
  ARCHIVE_KIND_V1_ZIP = 1;
}

enum ArchiveEntryKindV1 {
  ARCHIVE_ENTRY_KIND_V1_UNSPECIFIED = 0;
  ARCHIVE_ENTRY_KIND_V1_FILE = 1;
  ARCHIVE_ENTRY_KIND_V1_DIRECTORY = 2;
}

