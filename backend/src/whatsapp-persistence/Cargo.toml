[package]
name = "makosh-whatsapp-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.makosh]
role = "integration"
owner = "whatsapp"
surface = "persistence"

[dependencies]
makosh-communications-ingress = { path = "../communications-ingress" }
makosh-events-protocol = { path = "../platform/events" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-whatsapp-api = { path = "../whatsapp-api" }
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
