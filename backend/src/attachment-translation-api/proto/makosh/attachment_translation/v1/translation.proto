syntax = "proto3";

package makosh.attachment_translation.v1;

message StartAttachmentTranslationRequestV1 {
  uint32 protocol_major = 1;
  bytes operation_id = 2;
  bytes source_extraction_run_id = 3;
  uint64 expected_source_revision = 4;
  AttachmentTranslationLanguageV1 target_language = 5;
}

message StartAttachmentTranslationResponseV1 {
  bytes run_id = 1;
  AttachmentTranslationStateV1 state = 2;
  AttachmentTranslationErrorCodeV1 error = 15;
}

message GetAttachmentTranslationRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message GetAttachmentTranslationResponseV1 {
  bytes run_id = 1;
  bytes source_extraction_run_id = 2;
  uint64 expected_source_revision = 3;
  AttachmentTranslationStateV1 state = 4;
  uint64 state_revision = 5;
  optional AttachmentTranslationArtifactV1 artifact = 6;
  AttachmentTranslationErrorCodeV1 error = 15;
}

message IssueAttachmentTranslationReadRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message IssueAttachmentTranslationReadResponseV1 {
  bytes run_id = 1;
  bytes opaque_read_ticket = 2;
  uint64 expires_at_unix_seconds = 3;
  uint64 translated_size_bytes = 4;
  AttachmentTranslationErrorCodeV1 error = 15;
}

message AttachmentTranslationArtifactV1 {
  bytes translated_sha256 = 1;
  uint64 translated_size_bytes = 2;
  AttachmentTranslationDetectedLanguageV1 detected_source_language = 3;
  AttachmentTranslationLanguageV1 target_language = 4;
  AttachmentTranslationCompletenessV1 completeness = 5;
  uint32 confidence_basis_points = 6;
}

message AttachmentTranslationStatusChangedV1 {
  bytes run_id = 1;
  AttachmentTranslationStateV1 state = 2;
  uint64 state_revision = 3;
  optional AttachmentTranslationArtifactV1 artifact = 4;
  uint64 occurred_at_unix_millis = 5;
  AttachmentTranslationErrorCodeV1 error = 15;
}

service AttachmentTranslationCommandService {
  rpc Start(StartAttachmentTranslationRequestV1)
      returns (StartAttachmentTranslationResponseV1);
}

service AttachmentTranslationQueryService {
  rpc Get(GetAttachmentTranslationRequestV1)
      returns (GetAttachmentTranslationResponseV1);
}

service AttachmentTranslationTicketService {
  rpc IssueRead(IssueAttachmentTranslationReadRequestV1)
      returns (IssueAttachmentTranslationReadResponseV1);
}

enum AttachmentTranslationLanguageV1 {
  ATTACHMENT_TRANSLATION_LANGUAGE_UNSPECIFIED = 0;
  ATTACHMENT_TRANSLATION_LANGUAGE_ENGLISH = 1;
  ATTACHMENT_TRANSLATION_LANGUAGE_RUSSIAN = 2;
  ATTACHMENT_TRANSLATION_LANGUAGE_SPANISH = 3;
}

enum AttachmentTranslationDetectedLanguageV1 {
  ATTACHMENT_TRANSLATION_DETECTED_LANGUAGE_UNSPECIFIED = 0;
  ATTACHMENT_TRANSLATION_DETECTED_LANGUAGE_UNKNOWN = 1;
  ATTACHMENT_TRANSLATION_DETECTED_LANGUAGE_ENGLISH = 2;
  ATTACHMENT_TRANSLATION_DETECTED_LANGUAGE_RUSSIAN = 3;
  ATTACHMENT_TRANSLATION_DETECTED_LANGUAGE_SPANISH = 4;
}

enum AttachmentTranslationStateV1 {
  ATTACHMENT_TRANSLATION_STATE_UNSPECIFIED = 0;
  ATTACHMENT_TRANSLATION_STATE_ACCEPTED = 1;
  ATTACHMENT_TRANSLATION_STATE_AWAITING_SOURCE = 2;
  ATTACHMENT_TRANSLATION_STATE_AWAITING_INFERENCE = 3;
  ATTACHMENT_TRANSLATION_STATE_MATERIALIZING_RESULT = 4;
  ATTACHMENT_TRANSLATION_STATE_READY = 5;
  ATTACHMENT_TRANSLATION_STATE_REJECTED = 6;
}

enum AttachmentTranslationCompletenessV1 {
  ATTACHMENT_TRANSLATION_COMPLETENESS_UNSPECIFIED = 0;
  ATTACHMENT_TRANSLATION_COMPLETENESS_COMPLETE = 1;
  ATTACHMENT_TRANSLATION_COMPLETENESS_PARTIAL = 2;
}

enum AttachmentTranslationErrorCodeV1 {
  ATTACHMENT_TRANSLATION_ERROR_CODE_UNSPECIFIED = 0;
  ATTACHMENT_TRANSLATION_ERROR_CODE_INVALID_REQUEST = 1;
  ATTACHMENT_TRANSLATION_ERROR_CODE_NOT_FOUND = 2;
  ATTACHMENT_TRANSLATION_ERROR_CODE_SOURCE_REJECTED = 3;
  ATTACHMENT_TRANSLATION_ERROR_CODE_INFERENCE_REJECTED = 4;
  ATTACHMENT_TRANSLATION_ERROR_CODE_RESULT_REJECTED = 5;
  ATTACHMENT_TRANSLATION_ERROR_CODE_POLICY = 6;
  ATTACHMENT_TRANSLATION_ERROR_CODE_TICKET_EXPIRED = 7;
  ATTACHMENT_TRANSLATION_ERROR_CODE_TICKET_USED = 8;
  ATTACHMENT_TRANSLATION_ERROR_CODE_UNAVAILABLE = 9;
}
