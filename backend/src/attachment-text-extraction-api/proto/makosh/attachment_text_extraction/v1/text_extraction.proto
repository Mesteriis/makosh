syntax = "proto3";

package makosh.attachment_text_extraction.v1;

message StartAttachmentTextExtractionRequestV1 {
  uint32 protocol_major = 1;
  bytes operation_id = 2;
  bytes attachment_anchor_id = 3;
}

message StartAttachmentTextExtractionResponseV1 {
  bytes run_id = 1;
  AttachmentTextExtractionStateV1 state = 2;
  AttachmentTextExtractionErrorCodeV1 error = 15;
}

message GetAttachmentTextExtractionRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message GetAttachmentTextExtractionResponseV1 {
  bytes run_id = 1;
  bytes attachment_anchor_id = 2;
  AttachmentTextExtractionStateV1 state = 3;
  uint64 state_revision = 4;
  AttachmentTextFormatV1 format = 5;
  uint64 extracted_size_bytes = 6;
  bool extraction_truncated = 7;
  AttachmentTextExtractionErrorCodeV1 error = 15;
}

message ReadAttachmentTextRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message ReadAttachmentTextResponseV1 {
  bytes run_id = 1;
  bytes text_utf8 = 2;
  uint64 extracted_size_bytes = 3;
  bool visible_truncated = 4;
  AttachmentTextExtractionErrorCodeV1 error = 15;
}

message AttachmentTextExtractionStatusChangedV1 {
  bytes run_id = 1;
  AttachmentTextExtractionStateV1 state = 2;
  uint64 state_revision = 3;
  AttachmentTextFormatV1 format = 4;
  uint64 extracted_size_bytes = 5;
  bool extraction_truncated = 6;
  uint64 occurred_at_unix_millis = 7;
  AttachmentTextExtractionErrorCodeV1 error = 15;
}

service AttachmentTextExtractionCommandService {
  rpc Start(StartAttachmentTextExtractionRequestV1)
      returns (StartAttachmentTextExtractionResponseV1);
}

service AttachmentTextExtractionQueryService {
  rpc Get(GetAttachmentTextExtractionRequestV1)
      returns (GetAttachmentTextExtractionResponseV1);
}

service AttachmentTextExtractionContentService {
  rpc ReadText(ReadAttachmentTextRequestV1)
      returns (ReadAttachmentTextResponseV1);
}

enum AttachmentTextExtractionStateV1 {
  ATTACHMENT_TEXT_EXTRACTION_STATE_V1_UNSPECIFIED = 0;
  ATTACHMENT_TEXT_EXTRACTION_STATE_V1_ACCEPTED = 1;
  ATTACHMENT_TEXT_EXTRACTION_STATE_V1_AWAITING_EVIDENCE = 2;
  ATTACHMENT_TEXT_EXTRACTION_STATE_V1_EXTRACTING = 3;
  ATTACHMENT_TEXT_EXTRACTION_STATE_V1_READY = 4;
  ATTACHMENT_TEXT_EXTRACTION_STATE_V1_UNSUPPORTED = 5;
  ATTACHMENT_TEXT_EXTRACTION_STATE_V1_REJECTED = 6;
}

enum AttachmentTextFormatV1 {
  ATTACHMENT_TEXT_FORMAT_V1_UNSPECIFIED = 0;
  ATTACHMENT_TEXT_FORMAT_V1_PLAIN_UTF8 = 1;
  ATTACHMENT_TEXT_FORMAT_V1_PDF = 2;
  ATTACHMENT_TEXT_FORMAT_V1_DOCX = 3;
  ATTACHMENT_TEXT_FORMAT_V1_OCR = 4;
}

enum AttachmentTextExtractionErrorCodeV1 {
  ATTACHMENT_TEXT_EXTRACTION_ERROR_CODE_V1_UNSPECIFIED = 0;
  ATTACHMENT_TEXT_EXTRACTION_ERROR_CODE_V1_INVALID_REQUEST = 1;
  ATTACHMENT_TEXT_EXTRACTION_ERROR_CODE_V1_NOT_FOUND = 2;
  ATTACHMENT_TEXT_EXTRACTION_ERROR_CODE_V1_NOT_SAFE = 3;
  ATTACHMENT_TEXT_EXTRACTION_ERROR_CODE_V1_UNSUPPORTED = 4;
  ATTACHMENT_TEXT_EXTRACTION_ERROR_CODE_V1_SOURCE_TOO_LARGE = 5;
  ATTACHMENT_TEXT_EXTRACTION_ERROR_CODE_V1_INVALID_CONTENT = 6;
  ATTACHMENT_TEXT_EXTRACTION_ERROR_CODE_V1_PARSER_UNAVAILABLE = 7;
  ATTACHMENT_TEXT_EXTRACTION_ERROR_CODE_V1_PARSER_FAILED = 8;
  ATTACHMENT_TEXT_EXTRACTION_ERROR_CODE_V1_CUSTODY_REJECTED = 9;
  ATTACHMENT_TEXT_EXTRACTION_ERROR_CODE_V1_UNAVAILABLE = 10;
}
