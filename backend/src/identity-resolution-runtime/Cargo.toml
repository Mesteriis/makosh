[package]
name = "makosh-identity-resolution-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-identity-resolution-runtime"
path = "src/main.rs"

[package.metadata.makosh]
role = "engine"
owner = "identity_resolution"
surface = "runtime"

[dependencies]
makosh-events-jetstream = { path = "../platform/events/jetstream" }
makosh-events-protocol = { path = "../platform/events" }
makosh-identity-resolution-api = { path = "../identity-resolution-api" }
makosh-identity-resolution-core = { path = "../identity-resolution-core" }
makosh-identity-resolution-persistence = { path = "../identity-resolution-persistence" }
makosh-persons-api = { path = "../persons-api" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-storage-vault = { path = "../platform/storage/vault" }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"

[dev-dependencies]
makosh-persons-runtime = { path = "../persons-runtime" }
