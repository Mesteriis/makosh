syntax = "proto3";

package makosh.mail_contacts_sync.v1;

message StartMailContactsSyncRequestV1 {
  uint32 protocol_major = 1;
  bytes operation_id = 2;
  string account_id = 3;
  MailContactsSyncDirectionV1 direction = 4;
}

message StartMailContactsSyncResponseV1 {
  bytes run_id = 1;
  MailContactsSyncStateV1 state = 2;
  MailContactsSyncErrorCodeV1 error = 15;
}

message GetMailContactsSyncRequestV1 {
  uint32 protocol_major = 1;
  bytes run_id = 2;
}

message GetMailContactsSyncResponseV1 {
  bytes run_id = 1;
  string account_id = 2;
  MailContactsSyncDirectionV1 direction = 3;
  MailContactsSyncTriggerV1 trigger = 4;
  MailContactsSyncStateV1 state = 5;
  uint64 state_revision = 6;
  uint64 provider_entries_seen = 7;
  uint64 contacts_created = 8;
  uint64 contacts_updated = 9;
  uint64 contacts_unchanged = 10;
  uint64 provider_entries_written = 11;
  uint64 rejected_entries = 12;
  MailContactsSyncErrorCodeV1 error = 15;
}

message MailContactsSyncStatusChangedV1 {
  bytes run_id = 1;
  MailContactsSyncStateV1 state = 2;
  uint64 state_revision = 3;
  uint64 occurred_at_unix_millis = 4;
  MailContactsSyncErrorCodeV1 error = 15;
}

service MailContactsSyncCommandService {
  rpc Start(StartMailContactsSyncRequestV1) returns (StartMailContactsSyncResponseV1);
}

service MailContactsSyncQueryService {
  rpc Get(GetMailContactsSyncRequestV1) returns (GetMailContactsSyncResponseV1);
}

enum MailContactsSyncDirectionV1 {
  MAIL_CONTACTS_SYNC_DIRECTION_UNSPECIFIED = 0;
  MAIL_CONTACTS_SYNC_DIRECTION_PROVIDER_TO_CONTACTS = 1;
  MAIL_CONTACTS_SYNC_DIRECTION_BIDIRECTIONAL = 2;
}

enum MailContactsSyncTriggerV1 {
  MAIL_CONTACTS_SYNC_TRIGGER_UNSPECIFIED = 0;
  MAIL_CONTACTS_SYNC_TRIGGER_MANUAL = 1;
  MAIL_CONTACTS_SYNC_TRIGGER_SCHEDULED = 2;
}

enum MailContactsSyncStateV1 {
  MAIL_CONTACTS_SYNC_STATE_UNSPECIFIED = 0;
  MAIL_CONTACTS_SYNC_STATE_ACCEPTED = 1;
  MAIL_CONTACTS_SYNC_STATE_FETCHING_PROVIDER_PAGE = 2;
  MAIL_CONTACTS_SYNC_STATE_APPLYING_CONTACTS = 3;
  MAIL_CONTACTS_SYNC_STATE_WRITING_PROVIDER = 4;
  MAIL_CONTACTS_SYNC_STATE_RECONCILING_OUTCOME = 5;
  MAIL_CONTACTS_SYNC_STATE_COMPLETED = 6;
  MAIL_CONTACTS_SYNC_STATE_REJECTED = 7;
}

enum MailContactsSyncErrorCodeV1 {
  MAIL_CONTACTS_SYNC_ERROR_CODE_UNSPECIFIED = 0;
  MAIL_CONTACTS_SYNC_ERROR_CODE_INVALID_REQUEST = 1;
  MAIL_CONTACTS_SYNC_ERROR_CODE_NOT_FOUND = 2;
  MAIL_CONTACTS_SYNC_ERROR_CODE_ACCOUNT_UNAVAILABLE = 3;
  MAIL_CONTACTS_SYNC_ERROR_CODE_PROVIDER_UNAVAILABLE = 4;
  MAIL_CONTACTS_SYNC_ERROR_CODE_CONTACTS_REJECTED = 5;
  MAIL_CONTACTS_SYNC_ERROR_CODE_REMOTE_WRITE_BLOCKED = 6;
  MAIL_CONTACTS_SYNC_ERROR_CODE_ETAG_CONFLICT = 7;
  MAIL_CONTACTS_SYNC_ERROR_CODE_OUTCOME_UNKNOWN = 8;
  MAIL_CONTACTS_SYNC_ERROR_CODE_POLICY = 9;
  MAIL_CONTACTS_SYNC_ERROR_CODE_UNAVAILABLE = 10;
}
