[package]
name = "makosh-ollama-ai-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.makosh]
role = "integration"
owner = "ollama"
surface = "persistence"

[dependencies]
makosh-ai-contracts = { path = "../ai-contracts" }
makosh-ollama-ai-core = { path = "../ollama-ai-core" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
