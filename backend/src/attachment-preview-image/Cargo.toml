[package]
name = "makosh-attachment-preview-image"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.makosh]
role = "workflow"
owner = "attachment_preview"
surface = "implementation"

[dependencies]
makosh-attachment-preview-api = { path = "../attachment-preview-api" }
makosh-attachment-preview-renderer-contract = { path = "../attachment-preview-renderer-contract" }
image = { version = "=0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
