syntax = "proto3";

package makosh.attachment_security.v1;

// Provider-neutral request to scan one already-admitted Blob. Provider
// locators, names, media types, paths, scanner settings and content are absent.
message AttachmentSecurityScanCandidateObservedV1 {
  bytes attachment_anchor_id = 1;
  bytes blob_reference_id = 2;
  uint64 declared_size = 3;
  bytes blob_receipt_sha256 = 4;
  int64 observed_at_unix_seconds = 5;
  bytes custody_transfer_source_proof = 6;
}
