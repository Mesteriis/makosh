syntax = "proto3";

package makosh.speech_to_text.v1;

// Private engine request routed only through the Core capability router.
// Audio bytes, filesystem paths and provider selection are deliberately absent.
message SpeechToTextRequestV1 {
  uint32 protocol_major = 1;
  bytes request_id = 2;
  string logical_owner_id = 3;
  SpeechAudioSourceReceiptV1 source = 4;
  SpeechAudioFormatV1 audio_format = 5;
  uint64 duration_millis = 6;
  SpeechLanguageV1 requested_language = 7;
  bytes consent_receipt_id = 8;
  uint32 consent_policy_revision = 9;
  uint32 maximum_transcript_bytes = 10;
  uint32 maximum_segments = 11;
  bytes request_digest = 12;
}

// Target-bound Blob authority. The proof is never persisted in events, client
// query responses, SSE, logs or health output.
message SpeechAudioSourceReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

message SpeechToTextResultV1 {
  bytes request_id = 1;
  bytes request_digest = 2;
  bytes source_sha256 = 3;
  SpeechToTextTerminalStatusV1 terminal_status = 4;
  SpeechTranscriptArtifactReceiptV1 transcript = 5;
  SpeechLanguageV1 detected_language = 6;
  uint32 segment_count = 7;
  SpeechTranscriptCompletenessV1 completeness = 8;
  uint32 confidence_basis_points = 9;
  SpeechToTextExecutionReceiptV1 execution_receipt = 10;
  SpeechToTextRejectCodeV1 reject_code = 11;
}

// Transcript bytes and segment text live only in this target-bound Blob.
message SpeechTranscriptArtifactReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

message SpeechToTextExecutionReceiptV1 {
  bytes provider_contract_schema_sha256 = 1;
  bytes model_revision_sha256 = 2;
  uint64 provider_settings_revision = 3;
  uint32 provider_policy_revision = 4;
}

enum SpeechAudioFormatV1 {
  SPEECH_AUDIO_FORMAT_V1_UNSPECIFIED = 0;
  SPEECH_AUDIO_FORMAT_V1_WAV_PCM_S16LE_MONO_16000_HZ = 1;
}

enum SpeechLanguageV1 {
  SPEECH_LANGUAGE_V1_UNSPECIFIED = 0;
  SPEECH_LANGUAGE_V1_AUTO = 1;
  SPEECH_LANGUAGE_V1_ENGLISH = 2;
  SPEECH_LANGUAGE_V1_RUSSIAN = 3;
  SPEECH_LANGUAGE_V1_SPANISH = 4;
}

enum SpeechToTextTerminalStatusV1 {
  SPEECH_TO_TEXT_TERMINAL_STATUS_V1_UNSPECIFIED = 0;
  SPEECH_TO_TEXT_TERMINAL_STATUS_V1_READY = 1;
  SPEECH_TO_TEXT_TERMINAL_STATUS_V1_REJECTED = 2;
}

enum SpeechTranscriptCompletenessV1 {
  SPEECH_TRANSCRIPT_COMPLETENESS_V1_UNSPECIFIED = 0;
  SPEECH_TRANSCRIPT_COMPLETENESS_V1_COMPLETE = 1;
  SPEECH_TRANSCRIPT_COMPLETENESS_V1_PARTIAL = 2;
}

enum SpeechToTextRejectCodeV1 {
  SPEECH_TO_TEXT_REJECT_CODE_V1_UNSPECIFIED = 0;
  SPEECH_TO_TEXT_REJECT_CODE_V1_INVALID_REQUEST = 1;
  SPEECH_TO_TEXT_REJECT_CODE_V1_CONSENT_REJECTED = 2;
  SPEECH_TO_TEXT_REJECT_CODE_V1_UNSUPPORTED_AUDIO = 3;
  SPEECH_TO_TEXT_REJECT_CODE_V1_PROVIDER_UNAVAILABLE = 4;
  SPEECH_TO_TEXT_REJECT_CODE_V1_PROVIDER_REJECTED = 5;
  SPEECH_TO_TEXT_REJECT_CODE_V1_POLICY = 6;
}
