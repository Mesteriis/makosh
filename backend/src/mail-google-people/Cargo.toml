[package]
name = "makosh-mail-google-people"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
conformance-test-support = []

[package.metadata.makosh]
role = "integration"
owner = "mail"
surface = "implementation"

[dependencies]
async-native-tls = "=0.6.0"
async-std = "=1.13.2"
futures-util = "=0.3.32"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
