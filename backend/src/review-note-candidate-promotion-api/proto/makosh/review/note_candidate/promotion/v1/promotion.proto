syntax = "proto3";

package makosh.review.note_candidate.promotion.v1;

message ReviewNoteCandidatePromotionResultV1 {
  bytes result_id = 1;
  bytes review_id = 2;
  bytes candidate_id = 3;
  uint64 expected_review_revision = 4;
  ReviewNoteCandidatePromotionOutcomeV1 outcome = 5;
  optional bytes note_id = 6;
  ReviewNoteCandidatePromotionFailureCodeV1 failure_code = 7;
  string logical_owner_id = 8;
}

enum ReviewNoteCandidatePromotionOutcomeV1 {
  REVIEW_NOTE_CANDIDATE_PROMOTION_OUTCOME_UNSPECIFIED = 0;
  REVIEW_NOTE_CANDIDATE_PROMOTION_OUTCOME_SUCCEEDED = 1;
  REVIEW_NOTE_CANDIDATE_PROMOTION_OUTCOME_FAILED = 2;
}

enum ReviewNoteCandidatePromotionFailureCodeV1 {
  REVIEW_NOTE_CANDIDATE_PROMOTION_FAILURE_CODE_UNSPECIFIED = 0;
  REVIEW_NOTE_CANDIDATE_PROMOTION_FAILURE_CODE_INVALID_REQUEST = 1;
  REVIEW_NOTE_CANDIDATE_PROMOTION_FAILURE_CODE_BLOB_UNAVAILABLE = 2;
  REVIEW_NOTE_CANDIDATE_PROMOTION_FAILURE_CODE_BLOB_MISMATCH = 3;
  REVIEW_NOTE_CANDIDATE_PROMOTION_FAILURE_CODE_CONFLICT = 4;
  REVIEW_NOTE_CANDIDATE_PROMOTION_FAILURE_CODE_POLICY = 5;
}
