syntax = "proto3";

package makosh.desktop_call_recording.v1;

enum DesktopRecordingStateV1 {
  DESKTOP_RECORDING_STATE_UNSPECIFIED_V1 = 0;
  DESKTOP_RECORDING_STATE_AWAITING_CONSENT_V1 = 1;
  DESKTOP_RECORDING_STATE_CAPTURING_V1 = 2;
  DESKTOP_RECORDING_STATE_MATERIALIZING_V1 = 3;
  DESKTOP_RECORDING_STATE_READY_V1 = 4;
  DESKTOP_RECORDING_STATE_REJECTED_V1 = 5;
}

message StartDesktopCallRecordingRequestV1 {
  bytes operation_id = 1;
  bytes call_evidence_id = 2;
  uint64 expected_call_revision = 3;
  uint64 maximum_duration_millis = 4;
  uint32 consent_policy_revision = 5;
}

message StartDesktopCallRecordingResponseV1 {
  bytes recording_evidence_id = 1;
  uint64 recording_revision = 2;
  DesktopRecordingStateV1 state = 3;
}

message StopDesktopCallRecordingRequestV1 { bytes recording_evidence_id = 1; }
message StopDesktopCallRecordingResponseV1 { uint64 recording_revision = 1; DesktopRecordingStateV1 state = 2; }
message GetDesktopCallRecordingRequestV1 { bytes recording_evidence_id = 1; }
message GetDesktopCallRecordingResponseV1 {
  bytes recording_evidence_id = 1;
  uint64 recording_revision = 2;
  DesktopRecordingStateV1 state = 3;
  uint64 duration_millis = 4;
  string public_error_code = 5;
  optional RecordingTranscriptionAuthorityV1 transcription_authority = 6;
}

message RecordingTranscriptionAuthorityV1 {
  bytes operation_id = 1;
  bytes call_evidence_id = 2;
  uint64 call_evidence_revision = 3;
  bytes recording_evidence_id = 4;
  uint64 recording_revision = 5;
  bytes consent_receipt_id = 6;
  uint32 consent_policy_revision = 7;
}

message DesktopCallRecordingStatusChangedV1 {
  bytes recording_evidence_id = 1;
  uint64 recording_revision = 2;
  DesktopRecordingStateV1 state = 3;
  uint64 duration_millis = 4;
  int64 occurred_at_unix_ms = 5;
  string public_error_code = 6;
}

message DesktopRecordingHostHandshakeV1 {
  uint32 protocol_major = 1;
  uint32 protocol_revision = 2;
  bytes route_binding_sha256 = 3;
}
message DesktopRecordingHostHandshakeAcceptedV1 {
  uint32 protocol_major = 1;
  uint32 protocol_revision = 2;
}

message DesktopRecordingHostCommandClaimV1 {
  bytes host_claim_id = 1;
  uint32 lease_seconds = 2;
  uint32 limit = 3;
}

message BeginDesktopCaptureCommandV1 {
  bytes challenge_id = 1;
  bytes recording_evidence_id = 2;
  bytes device_actor_sha256 = 3;
  int64 expires_at_unix_ms = 4;
  uint64 maximum_duration_millis = 5;
  uint32 consent_policy_revision = 6;
  string consent_purpose = 7;
  string canonical_audio_format = 8;
  bytes call_evidence_id = 9;
  uint64 call_evidence_revision = 10;
}

message StopDesktopCaptureCommandV1 { bytes recording_evidence_id = 1; }

message DesktopRecordingHostCommandV1 {
  bytes command_id = 3;
  oneof command {
    BeginDesktopCaptureCommandV1 begin_capture = 1;
    StopDesktopCaptureCommandV1 stop_capture = 2;
  }
}

message DesktopCaptureStartedV1 {
  bytes command_id = 5;
  bytes host_claim_id = 6;
  bytes challenge_id = 1;
  bytes recording_evidence_id = 2;
  int64 started_at_unix_ms = 3;
  uint32 os_permission_revision = 4;
}

message DesktopCaptureCompletedV1 {
  bytes command_id = 7;
  bytes host_claim_id = 8;
  bytes challenge_id = 1;
  bytes recording_evidence_id = 2;
  int64 started_at_unix_ms = 3;
  int64 ended_at_unix_ms = 4;
  bytes canonical_wav_bytes = 5;
  bytes audio_sha256 = 6;
}

message DesktopCaptureRejectedV1 {
  bytes command_id = 4;
  bytes host_claim_id = 5;
  bytes challenge_id = 1;
  bytes recording_evidence_id = 2;
  string rejection_code = 3;
}

message DesktopRecordingHostObservationV1 {
  oneof observation {
    DesktopCaptureStartedV1 capture_started = 1;
    DesktopCaptureCompletedV1 capture_completed = 2;
    DesktopCaptureRejectedV1 capture_rejected = 3;
  }
}

message DesktopRecordingHostOperationV1 {
  oneof operation {
    DesktopRecordingHostCommandClaimV1 claim_commands = 1;
    DesktopRecordingHostObservationV1 observation = 2;
  }
}

message DesktopRecordingHostCommandLeaseV1 {
  repeated DesktopRecordingHostCommandV1 commands = 1;
}

message DesktopRecordingHostObservationAcceptedV1 {
  bytes recording_evidence_id = 1;
  uint64 recording_revision = 2;
}
