[package]
name = "makosh-omniroute-assembly"
version = "0.1.0"
edition = "2024"
license = "MIT"
[lib]
path = "src/lib.rs"
[[bin]]
name = "makosh-omniroute-assembly"
path = "src/main.rs"
[package.metadata.makosh]
role = "integration"
owner = "omniroute"
surface = "assembly"
[dependencies]
makosh-omniroute-api = { path = "../omniroute-api" }
makosh-omniroute-persistence = { path = "../omniroute-persistence" }
makosh-omniroute-runtime = { path = "../omniroute-runtime" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
prost = "=0.14.4"
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.150"
