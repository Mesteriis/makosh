[package]
name = "makosh-documents-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-documents-runtime"
path = "src/main.rs"

[package.metadata.makosh]
role = "domain"
owner = "documents"
surface = "runtime"

[dependencies]
makosh-blob-client = { path = "../platform/blob/client" }
makosh-documents-api = { path = "../documents-api" }
makosh-documents-core = { path = "../documents-core" }
makosh-documents-persistence = { path = "../documents-persistence" }
makosh-events-jetstream = { path = "../platform/events/jetstream" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-storage-vault = { path = "../platform/storage/vault" }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
