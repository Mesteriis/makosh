[package]
name = "makosh-ollama-ai-assembly"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-ollama-ai-assembly"
path = "src/main.rs"

[package.metadata.makosh]
role = "integration"
owner = "ollama"
surface = "assembly"

[dependencies]
makosh-ollama-ai-api = { path = "../ollama-ai-api" }
makosh-ollama-ai-persistence = { path = "../ollama-ai-persistence" }
makosh-ollama-ai-runtime = { path = "../ollama-ai-runtime" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
prost = "=0.14.4"
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.150"
