[package]
name = "makosh-review-task-candidate-assembly"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-review-task-candidate-assembly"
path = "src/main.rs"

[package.metadata.makosh]
role = "domain"
owner = "review"
surface = "assembly"

[dependencies]
makosh-review-task-candidate-persistence = { path = "../review-task-candidate-persistence" }
makosh-review-task-candidate-runtime = { path = "../review-task-candidate-runtime" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
prost = "=0.14.4"
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.150"
