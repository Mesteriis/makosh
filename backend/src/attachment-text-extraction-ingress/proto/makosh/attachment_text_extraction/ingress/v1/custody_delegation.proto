syntax = "proto3";

package makosh.attachment_text_extraction.ingress.v1;

// Target-owned durable command. Blob authority and target selection are
// intentionally absent; Attachment Security resolves current custody from its
// own completed scan state.
message RequestAttachmentTextCustodyDelegationV1 {
  bytes request_id = 1;
  bytes extraction_run_id = 2;
  bytes attachment_anchor_id = 3;
  bytes candidate_message_id = 4;
  bytes candidate_envelope_sha256 = 5;
  bytes safety_message_id = 6;
  bytes safety_evidence_id = 7;
  string logical_owner_id = 8;
}

// Internal durable result consumed only by the Attachment Text Extraction runtime.
// This proof remains outside public client/query/realtime surfaces.
message AttachmentTextCustodyDelegatedV1 {
  bytes request_id = 1;
  bytes extraction_run_id = 2;
  bytes attachment_anchor_id = 3;
  bytes candidate_message_id = 4;
  bytes safety_message_id = 5;
  bytes source_reference_id = 6;
  uint64 declared_size = 7;
  bytes receipt_sha256 = 8;
  bytes custody_transfer_source_proof = 9;
  string logical_owner_id = 10;
}

message AttachmentTextCustodyDelegationRejectedV1 {
  bytes request_id = 1;
  bytes extraction_run_id = 2;
  bytes attachment_anchor_id = 3;
  AttachmentTextCustodyDelegationRejectCodeV1 code = 4;
  string logical_owner_id = 5;
}

enum AttachmentTextCustodyDelegationRejectCodeV1 {
  ATTACHMENT_TEXT_EXTRACTION_CUSTODY_DELEGATION_REJECT_CODE_V1_UNSPECIFIED = 0;
  ATTACHMENT_TEXT_EXTRACTION_CUSTODY_DELEGATION_REJECT_CODE_V1_INVALID_REQUEST = 1;
  ATTACHMENT_TEXT_EXTRACTION_CUSTODY_DELEGATION_REJECT_CODE_V1_NOT_SAFE = 2;
  ATTACHMENT_TEXT_EXTRACTION_CUSTODY_DELEGATION_REJECT_CODE_V1_CUSTODY_UNAVAILABLE = 3;
  ATTACHMENT_TEXT_EXTRACTION_CUSTODY_DELEGATION_REJECT_CODE_V1_POLICY = 4;
}
