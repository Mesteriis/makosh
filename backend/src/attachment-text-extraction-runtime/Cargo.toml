[package]
name = "makosh-attachment-text-extraction-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-attachment-text-extraction-runtime"
path = "src/main.rs"

[package.metadata.makosh]
role = "workflow"
owner = "attachment_text_extraction"
surface = "runtime"

[dependencies]
makosh-attachment-security-contract = { path = "../attachment-security-contract" }
makosh-attachment-translation-ingress = { path = "../attachment-translation-ingress" }
makosh-attachment-text-extraction-api = { path = "../attachment-text-extraction-api" }
makosh-attachment-text-extraction-core = { path = "../attachment-text-extraction-core" }
makosh-attachment-text-extraction-docx = { path = "../attachment-text-extraction-docx" }
makosh-attachment-text-extraction-ingress = { path = "../attachment-text-extraction-ingress" }
makosh-attachment-text-extraction-ocr = { path = "../attachment-text-extraction-ocr" }
makosh-attachment-text-extraction-parser-contract = { path = "../attachment-text-extraction-parser-contract" }
makosh-attachment-text-extraction-pdf = { path = "../attachment-text-extraction-pdf" }
makosh-attachment-text-extraction-persistence = { path = "../attachment-text-extraction-persistence" }
makosh-attachment-text-extraction-plain = { path = "../attachment-text-extraction-plain" }
makosh-communications-attachment-contract = { path = "../communications-attachment-contract" }
makosh-blob-client = { path = "../platform/blob/client" }
makosh-events-jetstream = { path = "../platform/events/jetstream" }
makosh-events-protocol = { path = "../platform/events" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-storage-vault = { path = "../platform/storage/vault" }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
