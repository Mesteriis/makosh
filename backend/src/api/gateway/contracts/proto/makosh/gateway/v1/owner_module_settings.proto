syntax = "proto3";

package makosh.gateway.v1;

service OwnerModuleSettingsService {
  rpc Prepare(PrepareOwnerModuleSettingsRequestV1)
      returns (PrepareOwnerModuleSettingsResponseV1);
  rpc Commit(CommitOwnerModuleSettingsRequestV1)
      returns (CommitOwnerModuleSettingsResponseV1);
}

message OwnerSettingValueV1 {
  oneof value {
    bool boolean_value = 1;
    sint64 signed_integer_value = 2;
    uint64 unsigned_integer_value = 3;
    string decimal_value = 4;
    string string_value = 5;
    uint64 duration_millis = 6;
    int64 timestamp_unix_millis = 7;
    string enum_value = 8;
    string resource_reference = 9;
  }
}

message OwnerSettingEntryV1 {
  string setting_id = 1;
  OwnerSettingValueV1 value = 2;
}

message UpdateOwnerModuleSettingsV1 {
  string registration_id = 1;
  uint64 expected_desired_revision = 2;
  repeated OwnerSettingEntryV1 values = 3;
  string configuration_instance_id = 4;
}

message CreateOwnerModuleSettingsTargetV1 {
  string registration_id = 1;
}

message ApplyOwnerManagedIntegrationSettingsV1 {
  string registration_id = 1;
  string storage_capability_id = 2;
  string configuration_instance_id = 3;
  uint64 expected_desired_revision = 4;
  bool request_host_bridge = 5;
}

message ApplyOwnerManagedWorkflowSettingsV1 {
  string registration_id = 1;
  string storage_capability_id = 2;
  string configuration_instance_id = 3;
  uint64 expected_desired_revision = 4;
}

message ExportEffectiveOwnerModuleSettingsV1 {
  string registration_id = 1;
  uint64 expected_effective_revision = 2;
  string configuration_instance_id = 3;
}

message PrepareOwnerModuleSettingsRequestV1 {
  bytes operation_id = 1;
  oneof operation {
    UpdateOwnerModuleSettingsV1 update_desired = 2;
    ApplyOwnerManagedIntegrationSettingsV1 apply_managed_integration = 3;
    ExportEffectiveOwnerModuleSettingsV1 export_effective = 4;
    CreateOwnerModuleSettingsTargetV1 create_configuration_target = 5;
    ApplyOwnerManagedWorkflowSettingsV1 apply_managed_workflow = 6;
  }
}

message PrepareOwnerModuleSettingsResponseV1 {
  uint32 major = 1;
  string challenge_id = 2;
  bytes challenge_bytes = 3;
  uint64 expires_at_unix_millis = 4;
}

message CommitOwnerModuleSettingsRequestV1 {
  string challenge_id = 1;
  bytes device_signature_raw = 2;
}

message UpdateOwnerModuleSettingsReceiptV1 {
  string registration_id = 1;
  uint64 desired_revision = 2;
  string apply_state = 3;
  string configuration_instance_id = 4;
}

message CreateOwnerModuleSettingsTargetReceiptV1 {
  string registration_id = 1;
  string configuration_instance_id = 2;
  uint64 desired_revision = 3;
  string apply_state = 4;
}

message ApplyOwnerManagedIntegrationSettingsReceiptV1 {
  string registration_id = 1;
  uint64 effective_revision = 2;
  uint64 runtime_generation = 3;
  string apply_state = 4;
  optional string host_bridge_socket_path = 5;
  string configuration_instance_id = 6;
}

message ApplyOwnerManagedWorkflowSettingsReceiptV1 {
  string registration_id = 1;
  string configuration_instance_id = 2;
  uint64 effective_revision = 3;
  uint64 runtime_generation = 4;
  string apply_state = 5;
}

message ExportEffectiveOwnerModuleSettingsReceiptV1 {
  string registration_id = 1;
  uint32 schema_major = 2;
  uint32 schema_revision = 3;
  uint64 effective_revision = 4;
  repeated OwnerSettingEntryV1 values = 5;
  string configuration_instance_id = 6;
}

message CommitOwnerModuleSettingsResponseV1 {
  uint32 major = 1;
  bytes operation_id = 2;
  oneof result {
    UpdateOwnerModuleSettingsReceiptV1 updated = 3;
    ApplyOwnerManagedIntegrationSettingsReceiptV1 applied = 4;
    ExportEffectiveOwnerModuleSettingsReceiptV1 exported = 5;
    CreateOwnerModuleSettingsTargetReceiptV1 created = 6;
    ApplyOwnerManagedWorkflowSettingsReceiptV1 workflow_applied = 7;
  }
}
