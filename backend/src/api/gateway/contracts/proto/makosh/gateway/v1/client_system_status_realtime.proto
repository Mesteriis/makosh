syntax = "proto3";

package makosh.gateway.v1;

import "makosh/gateway/v1/client_bootstrap.proto";

// Full client-safe replacement snapshot for Kernel/platform system status.
// This is a platform projection, not a domain or provider operational event.
message ClientSystemStatusChangedV1 {
  uint64 revision = 1;
  repeated ClientSystemComponentStatusV1 statuses = 2;
}
