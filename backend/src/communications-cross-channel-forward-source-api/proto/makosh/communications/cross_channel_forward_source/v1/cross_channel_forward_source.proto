syntax = "proto3";

package makosh.communications.cross_channel_forward_source.v1;

// Exact workflow command into the Communications public source port.
// It contains canonical IDs only and never provider locators or content.
message PrepareCrossChannelForwardSourceCommandV1 {
  bytes forward_id = 1;
  bytes source_message_id = 2;
  bytes target_conversation_id = 3;
  string logical_owner_id = 4;
}

message CrossChannelForwardSourcePreparedV1 {
  bytes forward_id = 1;
  bytes source_message_id = 2;
  bytes target_conversation_id = 3;
  bytes source_evidence_id = 4;
  uint64 source_evidence_revision = 5;
  CrossChannelForwardBodySourceReceiptV1 body_source = 6;
  string logical_owner_id = 7;
}

message CrossChannelForwardSourceRejectedV1 {
  bytes forward_id = 1;
  CrossChannelForwardSourceRejectCodeV1 code = 2;
  string logical_owner_id = 3;
}

// Target-bound source receipt for communication_cross_channel_forward.
// Plaintext, provider identity and an arbitrary target are deliberately absent.
message CrossChannelForwardBodySourceReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

enum CrossChannelForwardSourceRejectCodeV1 {
  CROSS_CHANNEL_FORWARD_SOURCE_REJECT_CODE_UNSPECIFIED = 0;
  CROSS_CHANNEL_FORWARD_SOURCE_REJECT_CODE_INVALID_REQUEST = 1;
  CROSS_CHANNEL_FORWARD_SOURCE_REJECT_CODE_SOURCE_MISSING_OR_INACTIVE = 2;
  CROSS_CHANNEL_FORWARD_SOURCE_REJECT_CODE_TARGET_MISSING = 3;
  CROSS_CHANNEL_FORWARD_SOURCE_REJECT_CODE_SAME_CHANNEL = 4;
  CROSS_CHANNEL_FORWARD_SOURCE_REJECT_CODE_CONTENT_UNAVAILABLE = 5;
  CROSS_CHANNEL_FORWARD_SOURCE_REJECT_CODE_CONTENT_LIMIT = 6;
  CROSS_CHANNEL_FORWARD_SOURCE_REJECT_CODE_POLICY = 7;
}
