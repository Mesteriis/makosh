[package]
name = "makosh-communication-cross-channel-forward-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.makosh]
role = "workflow"
owner = "communication_cross_channel_forward"
surface = "persistence"

[features]
default = []
conformance-test-support = []

[dependencies]
makosh-communication-cross-channel-forward-core = { path = "../communication-cross-channel-forward-core" }
makosh-events-protocol = { path = "../platform/events" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
