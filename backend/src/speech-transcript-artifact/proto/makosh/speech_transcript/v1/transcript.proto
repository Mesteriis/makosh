syntax = "proto3";

package makosh.speech_transcript.v1;

// Private Blob document. This message is never a request RPC, event, query or
// realtime payload.
message SpeechTranscriptDocumentV1 {
  uint32 protocol_major = 1;
  bytes request_id = 2;
  SpeechTranscriptLanguageV1 detected_language = 3;
  uint64 duration_millis = 4;
  repeated SpeechTranscriptSegmentV1 segments = 5;
  SpeechTranscriptCompletenessV1 completeness = 6;
  uint32 confidence_basis_points = 7;
}

message SpeechTranscriptSegmentV1 {
  uint32 index = 1;
  uint64 start_millis = 2;
  uint64 end_millis = 3;
  bytes content_utf8 = 4;
}

enum SpeechTranscriptLanguageV1 {
  SPEECH_TRANSCRIPT_LANGUAGE_V1_UNSPECIFIED = 0;
  SPEECH_TRANSCRIPT_LANGUAGE_V1_AUTO = 1;
  SPEECH_TRANSCRIPT_LANGUAGE_V1_ENGLISH = 2;
  SPEECH_TRANSCRIPT_LANGUAGE_V1_RUSSIAN = 3;
  SPEECH_TRANSCRIPT_LANGUAGE_V1_SPANISH = 4;
}

enum SpeechTranscriptCompletenessV1 {
  SPEECH_TRANSCRIPT_COMPLETENESS_V1_UNSPECIFIED = 0;
  SPEECH_TRANSCRIPT_COMPLETENESS_V1_COMPLETE = 1;
  SPEECH_TRANSCRIPT_COMPLETENESS_V1_PARTIAL = 2;
}
