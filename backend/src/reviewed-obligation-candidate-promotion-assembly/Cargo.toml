[package]
name = "makosh-reviewed-obligation-candidate-promotion-assembly"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-reviewed-obligation-candidate-promotion-assembly"
path = "src/main.rs"

[package.metadata.makosh]
role = "workflow"
owner = "reviewed_obligation_candidate_promotion"
surface = "assembly"

[dependencies]
makosh-reviewed-obligation-candidate-promotion-persistence = { path = "../reviewed-obligation-candidate-promotion-persistence" }
makosh-reviewed-obligation-candidate-promotion-runtime = { path = "../reviewed-obligation-candidate-promotion-runtime" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
prost = "=0.14.4"
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.150"
