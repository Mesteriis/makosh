[package]
name = "makosh-whisper-stt-assembly"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-whisper-stt-assembly"
path = "src/main.rs"

[package.metadata.makosh]
role = "integration"
owner = "whisper_stt"
surface = "assembly"

[dependencies]
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-whisper-stt-persistence = { path = "../whisper-stt-persistence" }
makosh-whisper-stt-runtime = { path = "../whisper-stt-runtime" }
prost = "=0.14.4"
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.150"
