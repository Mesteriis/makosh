syntax = "proto3";

package makosh.whatsapp.operational.realtime.v1;

import "makosh/whatsapp/v1/client.proto";

message WhatsAppOperationalReplayRequestV1 {
  string account_id = 1;
  uint64 after_sequence = 2;
  uint32 limit = 3;
}

message WhatsAppOperationalReplayFrameV1 {
  uint64 sequence = 1;
  makosh.whatsapp.v1.WhatsAppProviderEventV1 event = 2;
}

message WhatsAppOperationalReplayResponseV1 {
  optional uint64 earliest_available_sequence = 1;
  optional uint64 latest_available_sequence = 2;
  repeated WhatsAppOperationalReplayFrameV1 frame = 3;
  uint64 next_sequence = 4;
  bool reset_required = 5;
  string account_id = 6;
}

service WhatsAppOperationalRealtimeService {
  rpc Replay(WhatsAppOperationalReplayRequestV1) returns (WhatsAppOperationalReplayResponseV1);
}
