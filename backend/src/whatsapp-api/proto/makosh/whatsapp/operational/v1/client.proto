syntax = "proto3";

package makosh.whatsapp.operational.v1;

import "makosh/whatsapp/v1/client.proto";

message WhatsAppOperationalQueryV1 {
  oneof query {
    ListMessagesQuery list_messages = 1;
    SearchMessagesQuery search_messages = 2;
    ListDialogsQuery list_dialogs = 3;
    ListParticipantsQuery list_participants = 4;
    ListEventsQuery list_events = 5;
    GetRuntimeStatusQuery get_runtime_status = 6;
  }
}

message ListMessagesQuery {
  string account_id = 1;
  optional string provider_chat_id = 2;
  optional string cursor = 3;
  uint32 limit = 4;
}

message SearchMessagesQuery {
  string account_id = 1;
  optional string provider_chat_id = 2;
  string query = 3;
  optional string cursor = 4;
  uint32 limit = 5;
}

message ListDialogsQuery {
  string account_id = 1;
  optional string cursor = 2;
  uint32 limit = 3;
}

message ListParticipantsQuery {
  string account_id = 1;
  string provider_chat_id = 2;
  optional string cursor = 3;
  uint32 limit = 4;
}

message ListEventsQuery {
  string account_id = 1;
  optional makosh.whatsapp.v1.ProviderEventKind kind = 2;
  optional string provider_chat_id = 3;
  optional string cursor = 4;
  uint32 limit = 5;
}

message GetRuntimeStatusQuery {
  string account_id = 1;
}

message WhatsAppOperationalQueryResponseV1 {
  oneof response {
    WhatsAppMessagePageV1 messages = 1;
    WhatsAppDialogPageV1 dialogs = 2;
    WhatsAppParticipantPageV1 participants = 3;
    WhatsAppEventPageV1 events = 4;
    WhatsAppOperationalRuntimeStatusV1 runtime_status = 5;
  }
}

message WhatsAppMessagePageV1 {
  repeated makosh.whatsapp.v1.WhatsAppMessage item = 1;
  optional string next_cursor = 2;
}

message WhatsAppDialogPageV1 {
  repeated makosh.whatsapp.v1.WhatsAppDialog item = 1;
  optional string next_cursor = 2;
}

message WhatsAppParticipantPageV1 {
  repeated makosh.whatsapp.v1.WhatsAppParticipant item = 1;
  optional string next_cursor = 2;
}

message WhatsAppEventPageV1 {
  repeated makosh.whatsapp.v1.WhatsAppProviderEventV1 item = 1;
  optional string next_cursor = 2;
}

message WhatsAppOperationalRuntimeStatusV1 {
  string account_id = 1;
  optional string runtime_state = 2;
  bool projection_ready = 3;
  uint64 latest_event_sequence = 4;
}

service WhatsAppOperationalQueryService {
  rpc Query(WhatsAppOperationalQueryV1) returns (WhatsAppOperationalQueryResponseV1);
}
