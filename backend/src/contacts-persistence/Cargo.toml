[package]
name = "makosh-contacts-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.makosh]
role = "domain"
owner = "contacts"
surface = "persistence"

[features]
default = []
conformance-test-support = []

[dependencies]
makosh-contacts-core = { path = "../contacts-core" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
