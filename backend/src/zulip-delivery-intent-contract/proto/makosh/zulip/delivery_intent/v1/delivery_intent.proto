syntax = "proto3";

package makosh.zulip.delivery_intent.v1;

message ExecuteZulipDeliveryIntentCommandV1 {
  bytes intent_id = 1;
  string logical_owner_id = 2;
  bytes account_source_cursor = 3;
  bytes conversation_source_cursor = 4;
  optional bytes reply_to_source_cursor = 5;
  ZulipDeliveryIntentBodySourceReceiptV1 body_source = 6;
}

message ZulipDeliveryIntentBodySourceReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

message ZulipDeliveryIntentSucceededV1 {
  bytes intent_id = 1;
  string logical_owner_id = 2;
  bytes provider_operation_id = 3;
}

message ZulipDeliveryIntentRejectedV1 {
  bytes intent_id = 1;
  string logical_owner_id = 2;
  ZulipDeliveryIntentRejectCodeV1 code = 3;
}

enum ZulipDeliveryIntentRejectCodeV1 {
  ZULIP_DELIVERY_INTENT_REJECT_CODE_UNSPECIFIED = 0;
  ZULIP_DELIVERY_INTENT_REJECT_CODE_INVALID_REQUEST = 1;
  ZULIP_DELIVERY_INTENT_REJECT_CODE_ROUTE_NOT_FOUND = 2;
  ZULIP_DELIVERY_INTENT_REJECT_CODE_CUSTODY_REJECTED = 3;
  ZULIP_DELIVERY_INTENT_REJECT_CODE_PROVIDER_REJECTED = 4;
  ZULIP_DELIVERY_INTENT_REJECT_CODE_PROVIDER_AMBIGUOUS = 5;
  ZULIP_DELIVERY_INTENT_REJECT_CODE_UNAVAILABLE = 6;
}
