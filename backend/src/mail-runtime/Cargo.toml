[package]
name = "makosh-mail-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "makosh-mail-runtime"
path = "src/main.rs"

[lib]
name = "makosh_mail_runtime"
path = "src/lib.rs"

[features]
default = []
conformance-test-support = [
    "makosh-mail-api/conformance-test-support",
    "makosh-mail-carddav/conformance-test-support",
    "makosh-mail-gmail/conformance-test-support",
    "makosh-mail-google-people/conformance-test-support",
    "makosh-mail-imap/conformance-test-support",
]

[package.metadata.makosh]
role = "integration"
owner = "mail"
surface = "runtime"

[dependencies]
makosh-mail-api = { path = "../mail-api" }
makosh-mail-core = { path = "../mail-core" }
makosh-mail-imap = { path = "../mail-imap" }
makosh-mail-gmail = { path = "../mail-gmail" }
makosh-mail-smtp = { path = "../mail-smtp" }
makosh-mail-persistence = { path = "../mail-persistence" }
makosh-mail-address-book-contract = { path = "../mail-address-book-contract" }
makosh-mail-address-book-persistence = { path = "../mail-address-book-persistence" }
makosh-mail-google-people = { path = "../mail-google-people" }
makosh-mail-carddav = { path = "../mail-carddav" }
makosh-mail-delivery-intent-contract = { path = "../mail-delivery-intent-contract" }
makosh-attachment-security-contract = { path = "../attachment-security-contract" }
makosh-communications-attachment-contract = { path = "../communications-attachment-contract" }
makosh-communications-ingress = { path = "../communications-ingress" }
makosh-blob-client = { path = "../platform/blob/client" }
makosh-events-protocol = { path = "../platform/events" }
makosh-events-jetstream = { path = "../platform/events/jetstream" }
makosh-managed-vault-client = { path = "../platform/vault/managed_client" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-storage-vault = { path = "../platform/storage/vault" }
makosh-vault-protocol = { path = "../platform/vault/protocol" }
makosh-mail-retained-evidence-replay-persistence = { path = "../mail-retained-evidence-replay-persistence" }
makosh-mail-retained-evidence-replay-contract = { path = "../mail-retained-evidence-replay-contract" }
libc = "=0.2.186"
getrandom = { version = "=0.4.3", default-features = false }
prost = "=0.14.4"
prost-types = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
