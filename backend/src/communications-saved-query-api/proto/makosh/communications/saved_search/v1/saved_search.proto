syntax = "proto3";

package makosh.communications.saved_search.v1;

// Owner-local saved exact-token searches. Query plaintext is accepted only by
// create/replace and is never returned.
message CommunicationsSavedSearchRequestV1 {
  uint32 protocol_major = 1;
  oneof operation {
    ListSavedSearchesRequestV1 list = 2;
    CreateSavedSearchRequestV1 create = 3;
    ReplaceSavedSearchRequestV1 replace = 4;
    DeleteSavedSearchRequestV1 delete = 5;
    ExecuteSavedSearchRequestV1 execute = 6;
  }
}

message CommunicationsSavedSearchResponseV1 {
  oneof result {
    ListSavedSearchesResponseV1 list = 1;
    SavedSearchMutationResponseV1 mutation = 2;
    DeleteSavedSearchResponseV1 delete = 3;
    ExecuteSavedSearchResponseV1 execute = 4;
  }
  SavedSearchErrorCodeV1 error = 15;
}

service CommunicationsSavedSearchService {
  rpc Manage(CommunicationsSavedSearchRequestV1)
      returns (CommunicationsSavedSearchResponseV1);
}

enum SavedSearchErrorCodeV1 {
  SAVED_SEARCH_ERROR_CODE_UNSPECIFIED = 0;
  SAVED_SEARCH_ERROR_CODE_INVALID_REQUEST = 1;
  SAVED_SEARCH_ERROR_CODE_NOT_FOUND = 2;
  SAVED_SEARCH_ERROR_CODE_REVISION_CONFLICT = 3;
  SAVED_SEARCH_ERROR_CODE_UNAVAILABLE = 4;
  SAVED_SEARCH_ERROR_CODE_KEY_REVISION_STALE = 5;
}

message ListSavedSearchesRequestV1 {
  uint32 limit = 1;
  bytes cursor = 2;
}

message CreateSavedSearchRequestV1 {
  bytes saved_search_id = 1;
  string name = 2;
  optional string description = 3;
  optional bytes account_id = 4;
  string query = 5;
}

message ReplaceSavedSearchRequestV1 {
  bytes saved_search_id = 1;
  uint64 expected_revision = 2;
  string name = 3;
  optional string description = 4;
  optional bytes account_id = 5;
  string query = 6;
}

message DeleteSavedSearchRequestV1 {
  bytes saved_search_id = 1;
  uint64 expected_revision = 2;
}

message ExecuteSavedSearchRequestV1 {
  bytes saved_search_id = 1;
  uint32 limit = 2;
  bytes cursor = 3;
}

message SavedSearchSummaryV1 {
  bytes saved_search_id = 1;
  string name = 2;
  optional string description = 3;
  optional bytes account_id = 4;
  uint32 token_count = 5;
  uint64 revision = 6;
  int64 created_at_unix_seconds = 7;
  int64 updated_at_unix_seconds = 8;
}

message ListSavedSearchesResponseV1 {
  repeated SavedSearchSummaryV1 items = 1;
  bytes next_cursor = 2;
}

message SavedSearchMutationResponseV1 {
  SavedSearchSummaryV1 item = 1;
}

message DeleteSavedSearchResponseV1 {
  bytes saved_search_id = 1;
  uint64 revision = 2;
}

message ExecuteSavedSearchResponseV1 {
  repeated SavedSearchHitV1 hits = 1;
  bytes next_cursor = 2;
  uint64 definition_revision = 3;
}

message SavedSearchHitV1 {
  bytes evidence_id = 1;
  bytes message_id = 2;
  bytes conversation_id = 3;
  int64 observed_at_unix_seconds = 4;
  uint32 matched_token_count = 5;
}
