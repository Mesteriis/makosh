[package]
name = "makosh-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "makosh-kernel"
path = "src/main.rs"

[package.metadata.makosh]
role = "core"
owner = "kernel"
surface = "runtime"
components = ["supervisor", "module_registry", "capability_router", "core_gateway", "settings_registry"]

[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "=4.6.2", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
directories = "=6.0.0"
getrandom = { version = "=0.4.3", default-features = false }
makosh-blob-client = { path = "../platform/blob/client" }
makosh-gateway-protocol = { path = "../api/gateway/contracts" }
makosh-gateway-runtime = { path = "../api/gateway/runtime" }
makosh-gateway-session = { path = "../api/gateway/session" }
makosh-gateway-session-contract = { path = "../api/gateway/session_contract" }
makosh-kernel-control-store = { path = "control_store/contract" }
makosh-kernel-control-store-sqlite = { path = "control_store/sqlite" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-scheduler-protocol = { path = "../platform/scheduler/protocol" }
makosh-secure-file = { path = "../platform/secure_file" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-vault-protocol = { path = "../platform/vault/protocol" }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
prost = "=0.14.4"
quinn = "=0.11.7"
rcgen = "=0.13.2"
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std"] }
sha2 = { version = "=0.11.0", default-features = false }
signal-hook = "=0.3.18"
libc = "=0.2.186"
tokio = { version = "=1.52.4", default-features = false, features = ["net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "=0.26.4"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.20"
zeroize = "=1.9.0"
