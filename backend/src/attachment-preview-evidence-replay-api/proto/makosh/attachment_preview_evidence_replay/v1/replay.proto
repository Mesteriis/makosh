syntax = "proto3";

package makosh.attachment_preview_evidence_replay.v1;

message StartAttachmentPreviewEvidenceReplayRequestV1 {
  uint32 protocol_major = 1;
  bytes operation_id = 2;
  bytes attachment_anchor_id = 3;
  reserved 4, 5;
}

message StartAttachmentPreviewEvidenceReplayResponseV1 {
  bytes operation_id = 1;
  AttachmentPreviewEvidenceReplayStateV1 state = 2;
  AttachmentPreviewEvidenceReplayErrorV1 error = 15;
}

service AttachmentPreviewEvidenceReplayCommandService {
  rpc Start(StartAttachmentPreviewEvidenceReplayRequestV1)
      returns (StartAttachmentPreviewEvidenceReplayResponseV1);
}

enum AttachmentPreviewEvidenceReplayStateV1 {
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_STATE_V1_UNSPECIFIED = 0;
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_STATE_V1_ACCEPTED = 1;
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_STATE_V1_AWAITING_PRODUCERS = 2;
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_STATE_V1_COMPLETED = 3;
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_STATE_V1_UNAVAILABLE = 4;
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_STATE_V1_REJECTED = 5;
}

enum AttachmentPreviewEvidenceReplayErrorV1 {
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_ERROR_V1_UNSPECIFIED = 0;
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_ERROR_V1_INVALID_REQUEST = 1;
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_ERROR_V1_CONFLICT = 2;
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_ERROR_V1_PRODUCER_UNAVAILABLE = 3;
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_ERROR_V1_STALE_PRODUCER_FENCE = 4;
  ATTACHMENT_PREVIEW_EVIDENCE_REPLAY_ERROR_V1_UNAVAILABLE = 5;
}
