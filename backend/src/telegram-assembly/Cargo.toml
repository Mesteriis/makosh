[package]
name = "makosh-telegram-assembly"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-telegram-assembly"
path = "src/main.rs"

[package.metadata.makosh]
role = "integration"
owner = "telegram"
surface = "assembly"

[dependencies]
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-telegram-automation-persistence = { path = "../telegram-automation-persistence" }
makosh-telegram-calls-persistence = { path = "../telegram-calls-persistence" }
makosh-telegram-persistence = { path = "../telegram-persistence" }
makosh-telegram-runtime = { path = "../telegram-runtime" }
prost = "=0.14.4"
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.150"
