[package]
name = "makosh-telegram-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
conformance-test-support = []

[package.metadata.makosh]
role = "integration"
owner = "telegram"
surface = "persistence"

[dependencies]
makosh-communications-ingress = { path = "../communications-ingress" }
makosh-events-protocol = { path = "../platform/events" }
makosh-telegram-api = { path = "../telegram-api" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
serde = { version = "=1.0.228", default-features = false, features = ["std"] }
serde_json = "=1.0.150"
sha2 = { version = "=0.10.9", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["json", "postgres", "runtime-tokio", "tls-rustls-ring"] }
