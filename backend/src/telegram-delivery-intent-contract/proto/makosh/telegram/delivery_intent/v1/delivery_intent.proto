syntax = "proto3";

package makosh.telegram.delivery_intent.v1;

message ExecuteTelegramDeliveryIntentCommandV1 {
  bytes intent_id = 1;
  string logical_owner_id = 2;
  bytes account_source_cursor = 3;
  bytes conversation_source_cursor = 4;
  optional bytes reply_to_source_cursor = 5;
  TelegramDeliveryIntentBodySourceReceiptV1 body_source = 6;
}

message TelegramDeliveryIntentBodySourceReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

message TelegramDeliveryIntentSucceededV1 {
  bytes intent_id = 1;
  string logical_owner_id = 2;
  bytes provider_operation_id = 3;
}

message TelegramDeliveryIntentRejectedV1 {
  bytes intent_id = 1;
  string logical_owner_id = 2;
  TelegramDeliveryIntentRejectCodeV1 code = 3;
}

enum TelegramDeliveryIntentRejectCodeV1 {
  TELEGRAM_DELIVERY_INTENT_REJECT_CODE_UNSPECIFIED = 0;
  TELEGRAM_DELIVERY_INTENT_REJECT_CODE_INVALID_REQUEST = 1;
  TELEGRAM_DELIVERY_INTENT_REJECT_CODE_ROUTE_NOT_FOUND = 2;
  TELEGRAM_DELIVERY_INTENT_REJECT_CODE_CUSTODY_REJECTED = 3;
  TELEGRAM_DELIVERY_INTENT_REJECT_CODE_PROVIDER_REJECTED = 4;
  TELEGRAM_DELIVERY_INTENT_REJECT_CODE_PROVIDER_AMBIGUOUS = 5;
  TELEGRAM_DELIVERY_INTENT_REJECT_CODE_UNAVAILABLE = 6;
}
