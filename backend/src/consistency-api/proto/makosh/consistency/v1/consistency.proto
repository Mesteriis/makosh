syntax="proto3";
package makosh.consistency.v1;
message ConsistencyNodeRefV1 { string node_owner=1; string node_kind=2; bytes node_id=3; }
message ConsistencyEdgeV1 { bytes edge_id=1; ConsistencyNodeRefV1 source=2; ConsistencyNodeRefV1 target=3; string edge_kind=4; uint64 source_revision=5; int64 occurred_at_unix_millis=6; }
message ConsistencyContradictionV1 { ConsistencyEdgeV1 first_claim=1; ConsistencyEdgeV1 second_claim=2; }
message ListConsistencyContradictionsRequestV1 { string logical_owner_id=1; bytes after_first_claim_id=2; uint32 limit=3; }
message ListConsistencyContradictionsResultV1 { repeated ConsistencyContradictionV1 contradictions=1; bytes next_after_first_claim_id=2; uint64 projection_generation=3; }
message ConsistencyStatusRequestV1 { string logical_owner_id=1; }
message ConsistencyStatusV1 { uint64 active_generation=1; uint64 nodes=2; uint64 edges=3; uint64 source_events=4; int64 rebuilt_at_unix_millis=5; }
service ConsistencyQueryService { rpc ListContradictions(ListConsistencyContradictionsRequestV1) returns(ListConsistencyContradictionsResultV1); rpc GetStatus(ConsistencyStatusRequestV1) returns(ConsistencyStatusV1); }
