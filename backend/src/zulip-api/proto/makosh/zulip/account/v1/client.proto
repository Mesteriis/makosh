syntax = "proto3";

package makosh.zulip.account.v1;

service ZulipAccountLifecycleService {
  rpc Apply(ZulipAccountLifecycleCommandV1)
      returns (ZulipAccountLifecycleReceiptV1);
}

message ZulipBindCredentialV1 {
  string account_id = 1;
  uint64 expected_binding_revision = 2;
  uint64 credential_revision = 3;
}

message ZulipRetireAccountV1 {
  string account_id = 1;
  uint64 expected_binding_revision = 2;
}

message ZulipAccountLifecycleCommandV1 {
  oneof command {
    ZulipBindCredentialV1 bind_credential = 1;
    ZulipRetireAccountV1 retire_account = 2;
  }
}

enum ZulipCredentialBindingStateV1 {
  ZULIP_CREDENTIAL_BINDING_STATE_UNSPECIFIED = 0;
  ZULIP_CREDENTIAL_BINDING_STATE_UNCONFIGURED = 1;
  ZULIP_CREDENTIAL_BINDING_STATE_PENDING_RESTART = 2;
  ZULIP_CREDENTIAL_BINDING_STATE_ACTIVE = 3;
  ZULIP_CREDENTIAL_BINDING_STATE_RETIRED = 4;
}

message ZulipAccountLifecycleReceiptV1 {
  string account_id = 1;
  uint64 binding_revision = 2;
  ZulipCredentialBindingStateV1 state = 3;
}
