syntax = "proto3";

package makosh.zulip.operational.realtime.v1;

import "makosh/zulip/operational/v1/client.proto";

message ZulipOperationalReplayRequestV1 {
  string account_id = 1;
  uint64 after_sequence = 2;
  uint32 limit = 3;
}

message ZulipOperationalReplayFrameV1 {
  uint64 sequence = 1;
  makosh.zulip.operational.v1.ZulipOperationalEventV1 event = 2;
}

message ZulipOperationalReplayResponseV1 {
  optional uint64 earliest_available_sequence = 1;
  optional uint64 latest_available_sequence = 2;
  repeated ZulipOperationalReplayFrameV1 frame = 3;
  uint64 next_sequence = 4;
  bool reset_required = 5;
  string account_id = 6;
}

service ZulipOperationalRealtimeService {
  rpc Replay(ZulipOperationalReplayRequestV1) returns (ZulipOperationalReplayResponseV1);
}
