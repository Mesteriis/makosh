syntax = "proto3";

package makosh.zulip.operational.v1;

import "makosh/zulip/account/v1/client.proto";

message ZulipOperationalQueryV1 {
  oneof query {
    ListMessagesQuery list_messages = 1;
    SearchMessagesQuery search_messages = 2;
    ListConversationsQuery list_conversations = 3;
    ListEventsQuery list_events = 4;
    GetAccountStatusQuery get_account_status = 5;
  }
}

message ListMessagesQuery {
  string account_id = 1;
  optional string provider_conversation_id = 2;
  optional string cursor = 3;
  uint32 limit = 4;
}

message SearchMessagesQuery {
  string account_id = 1;
  optional string provider_conversation_id = 2;
  string query = 3;
  optional string cursor = 4;
  uint32 limit = 5;
}

message ListConversationsQuery {
  string account_id = 1;
  optional string cursor = 2;
  uint32 limit = 3;
}

message ListEventsQuery {
  string account_id = 1;
  optional ZulipOperationalEventKindV1 kind = 2;
  optional string provider_conversation_id = 3;
  optional string cursor = 4;
  uint32 limit = 5;
}

message GetAccountStatusQuery {
  string account_id = 1;
}

message ZulipOperationalQueryResponseV1 {
  oneof response {
    ZulipMessagePageV1 messages = 1;
    ZulipConversationPageV1 conversations = 2;
    ZulipEventPageV1 events = 3;
    ZulipAccountStatusV1 account_status = 4;
  }
}

message ZulipMessagePageV1 {
  repeated ZulipMessageV1 item = 1;
  optional string next_cursor = 2;
}

message ZulipConversationPageV1 {
  repeated ZulipConversationV1 item = 1;
  optional string next_cursor = 2;
}

message ZulipEventPageV1 {
  repeated ZulipOperationalEventV1 item = 1;
  optional string next_cursor = 2;
}

enum ZulipConversationKindV1 {
  ZULIP_CONVERSATION_KIND_UNSPECIFIED = 0;
  ZULIP_CONVERSATION_KIND_STREAM_TOPIC = 1;
  ZULIP_CONVERSATION_KIND_DIRECT = 2;
}

message ZulipConversationV1 {
  string account_id = 1;
  string provider_conversation_id = 2;
  ZulipConversationKindV1 kind = 3;
  optional string stream_id = 4;
  optional string stream_name = 5;
  optional string topic = 6;
  optional string direct_recipient_id = 7;
  optional string latest_provider_message_id = 8;
  uint64 latest_event_sequence = 9;
}

message ZulipAttachmentV1 {
  string provider_attachment_id = 1;
  optional string filename = 2;
}

message ZulipReactionStateV1 {
  string actor_id = 1;
  string emoji_name = 2;
  optional string emoji_code = 3;
  optional string reaction_type = 4;
}

message ZulipMessageV1 {
  string account_id = 1;
  string provider_message_id = 2;
  string provider_conversation_id = 3;
  string sender_id = 4;
  bool is_outgoing = 5;
  optional string content = 6;
  optional int64 sent_at_unix_seconds = 7;
  optional int64 edited_at_unix_seconds = 8;
  bool deleted = 9;
  repeated ZulipAttachmentV1 attachment = 10;
  repeated ZulipReactionStateV1 reaction = 11;
  uint64 last_event_sequence = 12;
}

enum ZulipOperationalEventKindV1 {
  ZULIP_OPERATIONAL_EVENT_KIND_UNSPECIFIED = 0;
  ZULIP_OPERATIONAL_EVENT_KIND_MESSAGE_UPSERTED = 1;
  ZULIP_OPERATIONAL_EVENT_KIND_MESSAGE_UPDATED = 2;
  ZULIP_OPERATIONAL_EVENT_KIND_MESSAGE_DELETED = 3;
  ZULIP_OPERATIONAL_EVENT_KIND_REACTION_ADDED = 4;
  ZULIP_OPERATIONAL_EVENT_KIND_REACTION_REMOVED = 5;
}

message ZulipOperationalEventV1 {
  string account_id = 1;
  int64 provider_event_id = 2;
  string provider_message_id = 3;
  optional string provider_conversation_id = 4;
  optional string actor_id = 5;
  ZulipOperationalEventKindV1 kind = 6;
  optional string content = 7;
  optional string topic = 8;
  optional ZulipReactionStateV1 reaction = 9;
  int64 observed_at_unix_seconds = 10;
}

enum ZulipHistoryStateV1 {
  ZULIP_HISTORY_STATE_UNSPECIFIED = 0;
  ZULIP_HISTORY_STATE_NOT_STARTED = 1;
  ZULIP_HISTORY_STATE_SYNCING = 2;
  ZULIP_HISTORY_STATE_READY = 3;
  ZULIP_HISTORY_STATE_DEGRADED = 4;
}

message ZulipAccountStatusV1 {
  string account_id = 1;
  bool projection_ready = 2;
  ZulipHistoryStateV1 history_state = 3;
  optional string oldest_provider_message_id = 4;
  optional int64 last_provider_event_id = 5;
  uint64 latest_event_sequence = 6;
  makosh.zulip.account.v1.ZulipCredentialBindingStateV1 credential_state = 7;
  optional uint64 credential_revision = 8;
  uint64 binding_revision = 9;
  optional uint64 applied_runtime_generation = 10;
}

service ZulipOperationalQueryService {
  rpc Query(ZulipOperationalQueryV1) returns (ZulipOperationalQueryResponseV1);
}
