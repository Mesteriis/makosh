[package]
name = "makosh-whatsapp-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "makosh_whatsapp_runtime"
path = "src/lib.rs"

[[bin]]
name = "makosh-whatsapp-runtime"
path = "src/main.rs"

[package.metadata.makosh]
role = "integration"
owner = "whatsapp"
surface = "runtime"

[dependencies]
makosh-blob-client-contract = { path = "../platform/blob/client-contract" }
makosh-blob-client = { path = "../platform/blob/client" }
makosh-communications-ingress = { path = "../communications-ingress" }
makosh-events-jetstream = { path = "../platform/events/jetstream" }
makosh-events-protocol = { path = "../platform/events" }
makosh-runtime-protocol = { path = "../platform/runtime_protocol" }
makosh-storage-protocol = { path = "../platform/storage/protocol" }
makosh-storage-vault = { path = "../platform/storage/vault" }
makosh-vault-protocol = { path = "../platform/vault/protocol" }
makosh-whatsapp-api = { path = "../whatsapp-api" }
makosh-whatsapp-core = { path = "../whatsapp-core" }
makosh-whatsapp-delivery-intent-contract = { path = "../whatsapp-delivery-intent-contract" }
makosh-whatsapp-persistence = { path = "../whatsapp-persistence" }
libc = "=0.2.186"
prost = "=0.14.4"
prost-types = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread"] }
