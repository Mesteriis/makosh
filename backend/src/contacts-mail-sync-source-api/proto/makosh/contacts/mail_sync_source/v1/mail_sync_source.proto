syntax = "proto3";

package makosh.contacts.mail_sync_source.v1;

// Bounded Contacts-owned signal. Private contact and provider fields are absent.
message ContactChangedForMailSyncV1 {
  bytes contact_id = 1;
  uint64 contact_revision = 2;
  string logical_owner_id = 3;
}
// Exact workflow request into the Contacts public source port. The target
// account is opaque routing identity, not provider selection authority.
message PrepareContactMailSyncSourceCommandV1 {
  bytes operation_id = 1;
  bytes contact_id = 2;
  uint64 expected_contact_revision = 3;
  string target_mail_account_id = 4;
  string logical_owner_id = 5;
}

message ContactMailSyncSourcePreparedV1 {
  bytes operation_id = 1;
  bytes contact_id = 2;
  uint64 contact_revision = 3;
  ContactMailSyncSourceContentReceiptV1 source_content = 4;
  string logical_owner_id = 5;
}

message ContactMailSyncSourceRejectedV1 {
  bytes operation_id = 1;
  ContactMailSyncSourceRejectCodeV1 code = 2;
  string logical_owner_id = 3;
}

message ContactMailSyncSourceContentReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

// Exact plaintext schema inside the target-bound Blob. These private bytes
// never enter a durable envelope, subject, health response or sanitized error.
message ContactMailSyncSourceContentV1 {
  string display_name = 1;
  repeated string email_addresses = 2;
  repeated string phone_numbers = 3;
  optional MailAddressBookLinkV1 target_account_link = 4;
}

message MailAddressBookLinkV1 {
  string provider_entry_id = 1;
  optional string provider_etag = 2;
}

enum ContactMailSyncSourceRejectCodeV1 {
  CONTACT_MAIL_SYNC_SOURCE_REJECT_CODE_UNSPECIFIED = 0;
  CONTACT_MAIL_SYNC_SOURCE_REJECT_CODE_INVALID_REQUEST = 1;
  CONTACT_MAIL_SYNC_SOURCE_REJECT_CODE_CONTACT_MISSING = 2;
  CONTACT_MAIL_SYNC_SOURCE_REJECT_CODE_STALE_CONTACT_REVISION = 3;
  CONTACT_MAIL_SYNC_SOURCE_REJECT_CODE_CONTENT_LIMIT = 4;
  CONTACT_MAIL_SYNC_SOURCE_REJECT_CODE_POLICY = 5;
}
