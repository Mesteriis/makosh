name: hermes-storage-authenticated-development

# Authenticated development infrastructure contour. The make dev lifecycle
# leaves these services running across frontend/Kernel restarts so owner data is
# not silently discarded and scan jobs can resume. Passwords remain Docker
# secret files; never add secret values to this directory or environment
# variables.
services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/hermes-development.conf"]
    volumes:
      - ./nats-server.conf:/etc/nats/hermes-development.conf:ro
      - hermes-authenticated-development-nats:/var/lib/hermes
    ports:
      - 127.0.0.1:${HERMES_STORAGE_AUTHENTICATED_NATS_PORT:-43225}:4222
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hermes_storage_authenticated
      POSTGRES_USER: hermes_postgres_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/storage_postgres_admin_password
    ports:
      - 127.0.0.1:${HERMES_STORAGE_AUTHENTICATED_POSTGRES_PORT:-35532}:5432
    secrets:
      - storage_postgres_admin_password
    volumes:
      - hermes-authenticated-development-postgres:/var/lib/postgresql/data
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes_storage_admin -d hermes_storage_authenticated"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    user: "${HERMES_STORAGE_PGBOUNCER_RUNTIME_UID:?PgBouncer runtime UID is required}"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/hermes/boot.sh"]
    command: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    ports:
      - 127.0.0.1:${HERMES_STORAGE_AUTHENTICATED_PGBOUNCER_PORT:-36532}:6432
    secrets:
      - storage_pgbouncer_admin_password
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./boot.sh:/etc/hermes/boot.sh:ro
      - ${HERMES_STORAGE_PGBOUNCER_DATABASES_DIRECTORY:?PgBouncer databases directory is required}:/etc/hermes/runtime:ro
      - ${HERMES_STORAGE_PGBOUNCER_AUTH_DIRECTORY:?PgBouncer auth directory is required}:/etc/hermes/auth
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "pgbouncer -V"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim
    ports:
      - 127.0.0.1:${HERMES_ATTACHMENT_SECURITY_CLAMAV_PORT:-3310}:3310
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  platform: {}

volumes:
  hermes-authenticated-development-nats:
  hermes-authenticated-development-postgres:

secrets:
  storage_postgres_admin_password:
    file: ${HERMES_STORAGE_POSTGRES_SECRET_FILE:?PostgreSQL authenticated secret file is required}
  storage_pgbouncer_admin_password:
    file: ${HERMES_STORAGE_PGBOUNCER_SECRET_FILE:?PgBouncer authenticated secret file is required}
