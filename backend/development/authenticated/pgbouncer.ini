%include /etc/makosh/runtime/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/makosh/auth/users.txt
admin_users = makosh_pgbouncer_admin
pool_mode = transaction
# SQLx uses the extended query protocol even when its local statement cache is
# disabled. PgBouncer must remap those statements while transaction pooling is
# active, otherwise backend reuse can surface SQLSTATE 08P01 across runtimes.
max_prepared_statements = 200
max_client_conn = 256
default_pool_size = 8
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
