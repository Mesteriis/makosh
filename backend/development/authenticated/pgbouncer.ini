%include /etc/makosh/runtime/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/makosh/auth/users.txt
admin_users = makosh_pgbouncer_admin
pool_mode = transaction
max_client_conn = 256
default_pool_size = 8
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
