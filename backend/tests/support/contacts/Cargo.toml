[package]
name = "makosh-contacts-testkit"
version = "0.1.0"
edition = "2024"
license = "MIT"

[package.metadata.makosh]
role = "test"
owner = "test"
surface = "test_support"

[dev-dependencies]
makosh-contacts-core = { path = "../../../src/contacts-core" }
makosh-contacts-persistence = { path = "../../../src/contacts-persistence", features = ["conformance-test-support"] }
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["macros", "rt-multi-thread"] }
