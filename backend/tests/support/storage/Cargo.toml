[package]
name = "makosh-storage-testkit"
version = "0.1.0"
edition = "2024"
license = "MIT"

[package.metadata.makosh]
role = "test"
owner = "test"
surface = "test_support"

[dev-dependencies]
makosh-attachment-security-persistence = { path = "../../../src/attachment-security-persistence" }
makosh-communications-persistence = { path = "../../../src/communications-persistence" }
makosh-storage-control = { path = "../../../src/platform/storage/control" }
makosh-storage-migrations = { path = "../../../src/platform/storage/migrations" }
makosh-storage-pgbouncer = { path = "../../../src/platform/storage/pgbouncer" }
makosh-storage-postgres = { path = "../../../src/platform/storage/postgres" }
makosh-storage-protocol = { path = "../../../src/platform/storage/protocol" }
makosh-storage-vault = { path = "../../../src/platform/storage/vault" }
makosh-telegram-assembly = { path = "../../../src/telegram-assembly" }
makosh-telegram-persistence = { path = "../../../src/telegram-persistence" }
makosh-runtime-protocol = { path = "../../../src/platform/runtime_protocol" }
makosh-vault-protocol = { path = "../../../src/platform/vault/protocol" }
getrandom = { version = "=0.4.3", default-features = false }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread"] }
tempfile = "=3.27.0"
tracing = "=0.1.44"
zeroize = "=1.9.0"
