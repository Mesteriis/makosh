[package]
name = "makosh-owner-vault-provisioning-host"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "makosh-owner-vault-development-host"
path = "src/bin/development_host.rs"
required-features = ["development-server"]

[package.metadata.makosh]
role = "app"
owner = "first_party_client"
surface = "host_adapter"

[features]
default = []
development-server = [
    "dep:makosh-legacy-provider-recovery",
    "dep:makosh-owner-device-proof-host",
    "dep:serde",
    "dep:serde_json",
    "dep:tiny_http",
]

[dependencies]
makosh-legacy-provider-recovery = { path = "../legacy-provider-recovery", optional = true }
makosh-owner-device-proof-host = { path = "../owner-device-proof-host", optional = true }
makosh-vault-protocol = { path = "../../../backend/src/platform/vault/protocol" }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.150", optional = true }
sha2 = { version = "=0.11.0", default-features = false }
tiny_http = { version = "=0.12.0", optional = true }
zeroize = "=1.9.0"
