name: makosh-dev

services:
  backend:
    profiles:
      - app
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    restart: unless-stopped
    working_dir: /workspace
    command:
      - bash
      - -c
      - cargo run --manifest-path backend/Cargo.toml --bin makosh-backend
    environment:
      DATABASE_URL: postgres://${MAKOSH_POSTGRES_USER:?Set MAKOSH_POSTGRES_USER in docker/.env}:${MAKOSH_POSTGRES_PASSWORD:?Set MAKOSH_POSTGRES_PASSWORD in docker/.env}@postgres:5432/${MAKOSH_POSTGRES_DB:?Set MAKOSH_POSTGRES_DB in docker/.env}
      MAKOSH_HTTP_ADDR: 0.0.0.0:8080
      MAKOSH_LOCAL_API_SECRET: ${MAKOSH_LOCAL_API_SECRET:?Set MAKOSH_LOCAL_API_SECRET in docker/.env}
      MAKOSH_DEV_MODE: ${MAKOSH_DEV_MODE:-true}
      MAKOSH_VAULT_HOME: /makosh-vault
      MAKOSH_DEV_KEY_PATH: /makosh-vault/dev/master.key
      MAKOSH_SECRET_VAULT_KEY: ${MAKOSH_SECRET_VAULT_KEY:?Set MAKOSH_SECRET_VAULT_KEY in docker/.env}
      MAKOSH_NATS_SERVER_URL: nats://nats:4222
      MAKOSH_CLAMAV_ADDR: clamav:3310
      MAKOSH_CLAMAV_TIMEOUT_SECONDS: ${MAKOSH_CLAMAV_TIMEOUT_SECONDS:-30}
      MAKOSH_ATTACHMENT_EXTRACTOR_ENABLED: ${MAKOSH_ATTACHMENT_EXTRACTOR_ENABLED:-true}
      MAKOSH_ATTACHMENT_EXTRACTOR_ADDR: attachment-extractor-gateway:8788
      MAKOSH_OLLAMA_BASE_URL: ${MAKOSH_OLLAMA_BASE_URL:-http://192.168.1.2:11434}
      MAKOSH_OLLAMA_CHAT_MODEL: ${MAKOSH_OLLAMA_CHAT_MODEL:-qwen3:4b}
      MAKOSH_OLLAMA_EMBED_MODEL: ${MAKOSH_OLLAMA_EMBED_MODEL:-qwen3-embedding:4b}
      MAKOSH_OLLAMA_TIMEOUT_SECONDS: ${MAKOSH_OLLAMA_TIMEOUT_SECONDS:-120}
      MAKOSH_LOG_FORMAT: ${MAKOSH_LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${MAKOSH_BACKEND_BIND:-127.0.0.1}:${MAKOSH_BACKEND_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ..
        target: /workspace
      - type: bind
        source: ${HOME:?Set HOME before starting the Docker app profile}/.makosh/vault
        target: /makosh-vault
      - type: volume
        source: makosh-cargo-registry
        target: /usr/local/cargo/registry
      - type: volume
        source: makosh-cargo-git
        target: /usr/local/cargo/git
      - type: volume
        source: makosh-backend-target
        target: /workspace/target
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      clamav:
        condition: service_healthy
      attachment-extractor-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  frontend:
    profiles:
      - app
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    restart: unless-stopped
    working_dir: /workspace/frontend
    command:
      - bash
      - -c
      - corepack pnpm install --frozen-lockfile && corepack pnpm dev --host 0.0.0.0 --port 5174 --strictPort
    environment:
      VITE_MAKOSH_API_BASE_URL: http://127.0.0.1:${MAKOSH_BACKEND_PORT:-8080}
      VITE_MAKOSH_LOCAL_API_SECRET: ${MAKOSH_LOCAL_API_SECRET:?Set MAKOSH_LOCAL_API_SECRET in docker/.env}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${MAKOSH_FRONTEND_BIND:-127.0.0.1}:${MAKOSH_FRONTEND_PORT:-5174}:5174"
    volumes:
      - type: bind
        source: ..
        target: /workspace
      - type: volume
        source: makosh-frontend-node-modules
        target: /workspace/frontend/node_modules
      - type: volume
        source: makosh-pnpm-store
        target: /pnpm
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5174 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MAKOSH_POSTGRES_DB:?Set MAKOSH_POSTGRES_DB in docker/.env}
      POSTGRES_USER: ${MAKOSH_POSTGRES_USER:?Set MAKOSH_POSTGRES_USER in docker/.env}
      POSTGRES_PASSWORD: ${MAKOSH_POSTGRES_PASSWORD:?Set MAKOSH_POSTGRES_PASSWORD in docker/.env}
    ports:
      - "${MAKOSH_POSTGRES_BIND:-127.0.0.1}:${MAKOSH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${MAKOSH_NATS_BIND:-127.0.0.1}:${MAKOSH_NATS_PORT:-34222}:4222"
      - "${MAKOSH_NATS_MONITOR_BIND:-127.0.0.1}:${MAKOSH_NATS_MONITOR_PORT:-38222}:8222"
    volumes:
      - type: bind
        source: ./data/nats
        target: /data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim
    restart: unless-stopped
    ports:
      - "${MAKOSH_CLAMAV_BIND:-127.0.0.1}:${MAKOSH_CLAMAV_PORT:-33310}:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  attachment-extractor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: attachment-extractor
    restart: unless-stopped
    environment:
      MAKOSH_ATTACHMENT_EXTRACTOR_TCP_BIND: 0.0.0.0:8788
      MAKOSH_ATTACHMENT_OCR_LANGUAGES: ${MAKOSH_ATTACHMENT_OCR_LANGUAGES:-eng+rus}
    networks:
      - attachment-extraction
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - type: bind
        source: ./data/mail
        target: /mail
        read_only: true
      - type: bind
        source: ./data/attachment-extractor
        target: /run/makosh-extractor
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import json,socket;s=socket.create_connection((\"127.0.0.1\",8788),2);s.sendall(json.dumps({\"operation\":\"health\"}).encode()+b\"\\n\");assert json.loads(s.recv(1024))[\"status\"] == \"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  attachment-extractor-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: attachment-extractor-gateway
    restart: unless-stopped
    depends_on:
      attachment-extractor:
        condition: service_healthy
    ports:
      - "${MAKOSH_ATTACHMENT_EXTRACTOR_BIND:-127.0.0.1}:${MAKOSH_ATTACHMENT_EXTRACTOR_PORT:-8788}:8788"
    networks:
      - default
      - attachment-extraction
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import json,socket;s=socket.create_connection((\"127.0.0.1\",8788),2);s.sendall(json.dumps({\"operation\":\"health\"}).encode()+b\"\\n\");assert json.loads(s.recv(1024))[\"status\"] == \"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  attachment-extraction:
    internal: true

volumes:
  makosh-backend-target:
  makosh-cargo-git:
  makosh-cargo-registry:
  makosh-frontend-node-modules:
  makosh-pnpm-store:
